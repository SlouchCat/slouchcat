# Publishes a release: the container image on ghcr.io, the image of the updater companion
# (ghcr.io/<owner>/slouchcat-updater, ADR 0024) and the release manifest the update check and the
# updater read (A-5, ADR 0001: source, image and version information are public, decision 1 of
# 2026-10-18). Runs only for a tag `vX.Y.Z`, so nothing is published until somebody tags a commit.
#
# The manifest is attached to the GitHub release as `manifest.json`, because the server reads it
# from the fixed address of the newest release:
#   https://github.com/SlouchCat/slouchcat/releases/latest/download/manifest.json
# Its fields: version, url, notes, publishedAt (the update check, server/internal/admin/update.go)
# and image, the server image pinned by the digest of this build ("ghcr.io/slouchcat/slouchcat@
# sha256:..."). `version` is the tag without the leading v, so it compares as a semantic version
# against the one built into the binary. The updater (server/cmd/updater) refuses a manifest
# without image and compares the pulled image against that digest before it restarts anything.
# Since 1.18.0 (ADR 0024, addendum of 2026-11-08) it also carries updaterImage (the updater image,
# pinned by digest, so the updater can follow the server) and deploy (base name -> sha256 of every
# deploy/compose*.yaml). Those compose files are attached to the release next to manifest.json.
#
# Only a plain tag `vX.Y.Z` that is the highest of the repository becomes the "latest" release and
# gets the image tag `:latest`. A backport on an older line gets neither; a tag with a suffix
# (`v1.18.0-rc1`) becomes a pre-release without them. The version tag is always set.
#
# After the FIRST release a package has to be made public by hand, once -- GitHub creates a new
# one private, and `docker compose pull` would ask every installation for a login. Decision 1 of
# 2026-10-18 says image and version information are public. It takes two settings, in this order,
# and the first one is easy to miss:
#
#   1. https://github.com/organizations/<org>/settings/packages -- the organization has to allow
#      public packages at all. Until it does, "Public" is greyed out further down with "Setting is
#      disabled by organization administrators", and no amount of confirming changes anything.
#      Needs an organization owner, not a repository admin.
#   2. The package page -> Package settings -> Danger Zone -> Change visibility -> Public.
#
#   The updater image is a package of its own (slouchcat-updater). It needs step 2 once as well,
#   after the first release that publishes it (1.16.0); step 1 holds for the organization already.
#
#   Check it without being signed in: ghcr.io hands out an anonymous pull token for a public
#   package, and
#     curl -s "https://ghcr.io/token?scope=repository:<org>/<name>:pull&service=ghcr.io"
#   returns an error while it is private.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  # For the build provenance below: the attestation is signed with a short-lived OIDC token, so
  # whoever pulls the image can check that it came out of this workflow and this commit.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The annotated tag's message becomes the release notes; a shallow checkout has no tag
          # object to read it from.
          fetch-depth: 0

      # The image name has to be lower case: a Docker repository name may not carry a capital, and
      # github.repository keeps the spelling of the owner ("SlouchCat/slouchcat"). The first run of
      # this workflow died on exactly that, before it pushed anything.
      - name: Read the version out of the tag and the image names out of the repository
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "updater_image=ghcr.io/${GITHUB_REPOSITORY,,}-updater" >> "$GITHUB_OUTPUT"

      # Decides what kind of release this tag is, before any image is pushed (the image tags depend
      # on it). fetch-depth 0 above brought all tags of the repository.
      - name: Decide whether the tag is a pre-release, a backport or the latest release
        id: kind
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          plain='^v[0-9]+\.[0-9]+\.[0-9]+$'
          prerelease=false
          latest=false
          if [[ "$tag" =~ $plain ]]; then
            highest="$(git tag -l 'v*.*.*' | grep -E "$plain" | sort -V | tail -n 1)"
            if [ "$highest" = "$tag" ]; then latest=true; fi
          else
            prerelease=true
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "tag $tag: prerelease=$prerelease latest=$latest"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both platforms of P-1 in one image index. VERSION goes into the binary, so the running
      # server reports the release it was built from and the update check compares against it.
      - name: Build and push linux/amd64 and linux/arm64
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.kind.outputs.latest == 'true' && format('{0}:latest', steps.version.outputs.image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Signs a statement that this image index came out of this workflow, this commit and this
      # runner, and stores it next to the image. `gh attestation verify
      # oci://ghcr.io/slouchcat/slouchcat:<version> --repo SlouchCat/slouchcat` checks it. It is
      # what makes a tampered registry or a compromised workflow visible afterwards.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.version.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # v4 also writes an artifact storage record by default, which needs
          # `artifact-metadata: write`. The job does not get that permission, and the attestation
          # pushed to the registry is all `gh attestation verify` needs.
          create-storage-record: false

      # The updater companion (ADR 0024) is released with the server, from the same commit, but
      # it is a separate image: only it gets the Docker socket. Its own cache scope keeps the two
      # builds from overwriting each other's cache.
      - name: Build and push the updater image for linux/amd64 and linux/arm64
        id: build-updater
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.updater
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ${{ steps.version.outputs.updater_image }}:${{ steps.version.outputs.version }}
            ${{ steps.kind.outputs.latest == 'true' && format('{0}:latest', steps.version.outputs.updater_image) || '' }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater
          provenance: mode=max
          sbom: true

      - name: Attest the build provenance of the updater image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.version.outputs.updater_image }}
          subject-digest: ${{ steps.build-updater.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # The notes are the message of the annotated tag, without its first line (which repeats the
      # version).
      #
      # The tag object has to be fetched first. actions/checkout fetches the one ref it checks out
      # and writes refs/tags/<tag> straight to the commit, so the annotation is not in the clone at
      # all: `git tag -l --format=%(contents:body)` then reads the commit's message instead, and
      # the first release went out carrying a commit subject as its notes. --force replaces that
      # lightweight ref with the real tag object. `git for-each-ref` is used rather than `git tag
      # -l` because it fails loudly on a ref that is not there.
      - name: Write the release manifest and the notes
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          ref="refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "${GITHUB_REF_NAME}")" != tag ]; then
            echo "::warning::$GITHUB_REF_NAME is not an annotated tag; the release carries no notes of its own"
          fi
          notes="$(git for-each-ref --format='%(contents:body)' "$ref" | sed -e 's/[[:space:]]*$//')"
          subject="$(git for-each-ref --format='%(contents:subject)' "$ref")"
          [ -n "$notes" ] || notes="$subject"
          [ -n "$notes" ] || notes="Slouchcat ${{ steps.version.outputs.version }}"
          printf '%s\n' "$notes" > release-notes.md
          # Base name -> lowercase sha256 of every compose file; the updater replaces a file of the
          # running project when its hash differs (base names are unique across deploy/).
          deploy="$(sha256sum deploy/compose*.yaml | jq -R -s \
            'split("\n") | map(select(length > 0) | split("  ") | {key: (.[1] | split("/") | last), value: .[0]}) | from_entries')"
          # Base name -> every sha256 the file had in an earlier release: the updater replaces only a
          # file that is one of those (unchanged since some release), never one with own changes.
          known='{}'
          for f in deploy/compose*.yaml; do
            n="$(basename "$f")"
            hashes="$(for t in $(git tag -l 'v*.*.*'); do
                [ "$t" = "$GITHUB_REF_NAME" ] && continue
                if git cat-file -e "$t:deploy/$n" 2>/dev/null; then git show "$t:deploy/$n" | sha256sum | cut -d' ' -f1; fi
              done | sort -u | jq -R -s 'split("\n") | map(select(length > 0))')"
            known="$(jq -n --argjson k "$known" --arg n "$n" --argjson h "$hashes" '$k + {($n): $h}')"
          done
          jq -n \
            --argjson deploy "$deploy" \
            --argjson deployKnown "$known" \
            --arg version "${{ steps.version.outputs.version }}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}" \
            --arg notes "$notes" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg image "${{ steps.version.outputs.image }}@${{ steps.build.outputs.digest }}" \
            --arg updaterImage "${{ steps.version.outputs.updater_image }}@${{ steps.build-updater.outputs.digest }}" \
            '{version: $version, url: $url, notes: $notes, publishedAt: $publishedAt, image: $image, updaterImage: $updaterImage, deploy: $deploy, deployKnown: $deployKnown}' > manifest.json
          # The updater accepts only this form (server/cmd/updater, digestRef).
          jq -e '.image | test("^[a-z0-9][a-z0-9._/:-]*@sha256:[0-9a-f]{64}$")' manifest.json
          jq -e '.updaterImage | test("^[a-z0-9][a-z0-9._/:-]*/slouchcat-updater@sha256:[0-9a-f]{64}$")' manifest.json
          # Names the updater may fetch and write next to the compose file; hashes are lower-case hex.
          jq -e '(.deploy | length > 0) and (.deploy | to_entries | all(.key | test("^compose[a-z0-9.-]*\\.yaml$"))) and (.deploy | all(.[]; test("^[0-9a-f]{64}$")))' manifest.json
          jq -e '.deployKnown | to_entries | all((.key | test("^compose[a-z0-9.-]*\\.yaml$")) and (.value | length <= 200) and (.value | all(test("^[0-9a-f]{64}$"))))' manifest.json
          cat manifest.json

      # The written offer for the GPL source of the ffmpeg build travels with every release
      # (ADR 0001, deploy/licenses/FFMPEG-NOTICE.md). So do the compose files, as
      # releases/download/<tag>/<name>, which the updater fetches.
      - name: Create the release with the manifest, the compose files and the ffmpeg notice
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          flags=(--latest=false)
          if [ "${{ steps.kind.outputs.latest }}" = true ]; then flags=(--latest); fi
          if [ "${{ steps.kind.outputs.prerelease }}" = true ]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "Slouchcat ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            "${flags[@]}" \
            manifest.json \
            deploy/compose*.yaml \
            deploy/licenses/FFMPEG-NOTICE.md
