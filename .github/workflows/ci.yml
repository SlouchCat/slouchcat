# Runs the same checks as `task ci` locally -- the same tasks, split over parallel jobs instead of
# one after the other. `task ci` remains the one local command that builds and checks everything
# (plan section 4); what the jobs below run are its parts, `task ci:server`, `task ci:web` and
# `task ci:e2e`, and `task ci` still runs all of them. Why the split, and what it costs in exchange:
# ADR docs/adr/0013-ci-parallele-jobs.md. Measured times: docs/perf/ci.md.
#
# The serial job this replaced took 56 minutes, which is longer than most pull requests deserve to
# wait (run 40207488836).
name: ci

# A branch with an open pull request used to fire twice for the same commit: once for `push`
# (every branch) and once for `pull_request`. Two full runs raced for the same quota and the same
# 75-minute limit, which is how run 39789916437 was cancelled while its twin 39790013960 ran on.
# `push` is therefore limited to main (the record of what is merged) and everything else is checked
# through its pull request. A branch without one is checked as soon as it has one, and
# `workflow_dispatch` runs it by hand before that.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch: a new push replaces the run of the commit it supersedes. Runs on main are
# never cancelled -- they record whether what was merged is sound.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------------------------
  # Server: the generators with their drift check and the linters, then the tests in parallel
  # groups. Split in two because the linters take about 90 seconds and the tests about 19 minutes:
  # running the linters once instead of once per test group saves three minutes of runner time and
  # reports a lint error minutes before the tests are through.
  # ---------------------------------------------------------------------------------------------
  server-lint:
    name: server (generators, linters)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: ./.github/actions/task

      # The first three steps of `task ci:server`; the fourth, server:test, is the job below.
      # golangci-lint and sqlc need no ffmpeg and no test media.
      - run: task server:gen server:gen:check server:lint

  # The groups are not listed here. They are read out of server/testgroups.txt, so adding a group
  # there gives it a job by itself; a list in this file as well would be the same names in two
  # places, and the half that was forgotten would be the half that runs no tests. The job needs
  # nothing but the checkout: `--matrix` answers from that one text file, without Go.
  server-groups:
    name: server test groups
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: groups
        run: |
          set -euo pipefail
          groups=$(server/scripts/testgroups.sh --matrix)
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "Test groups: $groups"

  server-test:
    name: server tests (${{ matrix.group }})
    needs: server-groups
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      # Every group reports its own result: a failure in one is not a reason to hide the others.
      fail-fast: false
      matrix:
        # Which packages a group holds is server/testgroups.txt. "rest" is every package no group
        # names, so a new package is tested from its first day without anyone having to touch any
        # of this. `task server:test` without GROUP -- what `task ci` and every local run do --
        # still runs all of them at once.
        group: ${{ fromJSON(needs.server-groups.outputs.groups) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: ./.github/actions/task

      # ffmpeg: the probe and transcode tests run it, and the test media are generated with it.
      - uses: ./.github/actions/system-packages
        with:
          group: server

      - uses: ./.github/actions/test-media

      - run: task server:test GROUP=${{ matrix.group }}

  # ---------------------------------------------------------------------------------------------
  # Web: generators with their drift check, linters, Vitest and the Storybook screenshot checks.
  # No Go, no ffmpeg, no browsers from apt -- the Storybook screenshots run in the official
  # Playwright Docker image, which brings its own Chromium and its own libraries.
  # ---------------------------------------------------------------------------------------------
  web:
    name: web (linters, unit tests, Storybook)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node

      - uses: ./.github/actions/task

      - run: task ci:web

      # Screenshot diffs of the Storybook run (storybook.config.ts). The folder starts with a dot,
      # and the action skips hidden files unless told otherwise: without the flag every red run
      # uploaded nothing.
      - name: Keep the Storybook report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storybook-report
          path: web/node_modules/.playwright-storybook/
          include-hidden-files: true
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # The server binary with the web assets embedded, built once and handed to the e2e shards. Six
  # shards building the same binary would be six Go toolchains and six Vite builds for one file.
  # ---------------------------------------------------------------------------------------------
  build:
    name: build (server binary with the web assets)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `task build` stamps `git describe --tags` into the binary the e2e suite runs. With a
          # shallow clone that is a bare commit id, which the server reports as a development
          # build and never offers an update for, and the update-badge test (A-5) fails.
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: ./.github/actions/node

      - uses: ./.github/actions/task

      # web:build then server:build: the PWA is copied into the Go embed folder before the binary
      # is linked, so the binary serves exactly this build.
      - run: task build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slouchcat-binary
          path: server/bin/slouchcat
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # The Playwright suite, split into shards. Each shard is a whole run of its own on a runner of
  # its own: its own server with its own database and its own global setup. Within a shard
  # `workers: 1` still holds, so nothing races; what a shard does not have is the data of the spec
  # files that landed in the other shards, which is why every spec creates what it needs.
  # ---------------------------------------------------------------------------------------------
  e2e:
    name: e2e (shard ${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The length of this list is the shard count: `strategy.job-total` below reads it, so the
        # two can never drift apart.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node

      - uses: ./.github/actions/task

      # ffmpeg for the test media, PulseAudio for the sink below, and Playwright's own library list.
      - uses: ./.github/actions/system-packages
        with:
          group: e2e
          playwright-browsers: chromium firefox

      # Firefox drives an audio-only title from its audio sink. A runner has no audio output, so
      # the sink fails, the element reports MediaError 3 ("OnMediaSinkAudioError"), hls.js detaches
      # and re-attaches it, and the audiobook specs never play on (M6: H-1, H-3, O-5). A null sink
      # is an output that goes nowhere; Chromium brings its own and needs none. The step fails
      # loudly when the sink is missing, so the flake cannot come back unnoticed.
      - name: Give Firefox an audio output (the runner has none)
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=slouchcat_null
          pactl info

      # The browsers are a ~400 MB download that only changes with the Playwright version, which
      # the lock file pins. Downloading them on every run cost 8.3 min in run 39789916437; the
      # libraries they need come from the apt step above and are installed either way.
      - name: Cache the Playwright browsers
        id: playwright-browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install the Playwright browsers
        if: steps.playwright-browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @slouchcat/web exec playwright install chromium firefox

      - uses: ./.github/actions/test-media

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: slouchcat-binary
          path: server/bin

      # An artefact is a zip, and a zip from upload-artifact carries no execute bit: without this
      # the server never starts and every spec of the shard fails at the first page load.
      - name: Make the binary executable again (artefacts lose the bit)
        run: chmod +x server/bin/slouchcat

      - run: task ci:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # The blob report is the machine-readable form of the run, traces and screenshots included.
      # The gate job merges the six of them into one HTML report; a single report per shard would
      # be six reports with a sixth of the run in each. Uploaded on green runs too, because a shard
      # that passed on its retry is the interesting one.
      - name: Keep the blob report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: web/node_modules/.playwright/blob/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # Container image for both platforms (P-1: images amd64 and arm64 start). Unchanged; it already
  # ran next to the old serial job.
  # ---------------------------------------------------------------------------------------------
  image:
    name: image (amd64, arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git describe` needs the tags and the commits behind them; a shallow clone has
          # neither and would stamp a bare commit id into the image.
          fetch-depth: 0

      # The version built into the binary is what the update check compares against the newest
      # release (server/internal/admin/update.go). A commit after a release describes as
      # `v1.4.0-12-gabc1234`, which the check reads as that release; a bare commit id is no
      # version at all, and the server then reports a development build instead of an update.
      - name: Describe the commit relative to the newest tag
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds without pushing: there is no registry yet for a pull request (ADR 0001). The Go
      # binary is cross-compiled; only the apt stage of the arm64 image runs under QEMU.
      - name: Build linux/amd64 and linux/arm64 (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Single-platform loads come from the cache of the step above.
      - name: Load the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.version }}
          load: true
          tags: slouchcat:ci-amd64
          cache-from: type=gha

      - name: Load the arm64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          load: true
          tags: slouchcat:ci-arm64
          cache-from: type=gha

      - name: amd64 turns healthy (< 5 s, idle RSS below the gate in measure-healthy.sh)
        run: IMAGE=slouchcat:ci-amd64 deploy/scripts/measure-healthy.sh

      # Emulated, so both numbers are the emulator's as much as the server's: P-1's 5 s and P-2's
      # memory apply to real hardware, and this step only proves that the arm64 image starts at all.
      # The RSS gate was 120 MB and read 114.9 MB on 23 October -- 96 % of its own limit, about to
      # break for the same reason the amd64 gate did. Measured that day: five runs of the 1.0 image
      # under QEMU on the reference machine gave 94.3 to 105.2 MB (healthy 6.8 to 8.6 s), the runner
      # 114.9 MB. 180 MB clears that spread of 20 MB with room to spare and still catches a server
      # that starts eating memory. See docs/perf/M10.md section 6.
      - name: arm64 starts under emulation (healthy within 30 s)
        run: IMAGE=slouchcat:ci-arm64 MAX_HEALTHY_SECONDS=30 MAX_RSS_MB=180 deploy/scripts/measure-healthy.sh

  # ---------------------------------------------------------------------------------------------
  # The gate. One job that waits for every other one and is green only when all of them are, so
  # there stays exactly one status check to require for a merge, and it is still called "ci / ci"
  # -- the name the old serial job had. Do not rename this job without changing that setting.
  #
  # It also merges the shards' blob reports into the one HTML report with all the traces, which is
  # what a red run uploads.
  # ---------------------------------------------------------------------------------------------
  ci:
    name: ci
    # Must run even when something before it failed, otherwise the gate would be "skipped" instead
    # of red and a broken run could look mergeable.
    if: always()
    needs: [server-lint, server-groups, server-test, web, build, e2e, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `continue-on-error` on all three report steps: whether the report could be assembled must
      # never decide whether the gate is green. That is what the last step is for. A shard that
      # died before it wrote its blob would otherwise let the download fail and hide the summary
      # that says which job broke.
      - name: Collect the blob reports of the shards
        if: needs.e2e.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: e2e-blob-*
          merge-multiple: true
          path: blob-reports

      - uses: ./.github/actions/node
        if: needs.e2e.result != 'skipped'
        continue-on-error: true

      # `merge-reports` reads the shards' blob files and writes one HTML report, with every test of
      # the run and the traces of the failures. It runs in web/, so the path is relative to it.
      - name: Merge the shards into one Playwright report
        if: needs.e2e.result != 'skipped'
        continue-on-error: true
        run: pnpm --filter @slouchcat/web exec playwright merge-reports --reporter html ../blob-reports

      - name: Keep the merged Playwright report
        if: needs.e2e.result != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: web/playwright-report/
          include-hidden-files: true
          if-no-files-found: ignore

      # Named one by one rather than with `contains(needs.*.result, 'failure')`, so the log says
      # which job it was, and so a job that was skipped or cancelled is red here too instead of
      # slipping through as "not a failure".
      #
      # A job added to this workflow has to be added here and to `needs:` above, or the gate does
      # not watch it. That is the price of naming them; ADR 0013 carries it as a standing rule.
      - name: Every job of this workflow must be green
        run: |
          set -eu
          status=0
          check() {
            printf '%-14s %s\n' "$1" "$2"
            [ "$2" = success ] || status=1
          }
          check server-lint   '${{ needs.server-lint.result }}'
          check server-groups '${{ needs.server-groups.result }}'
          check server-test   '${{ needs.server-test.result }}'
          check web           '${{ needs.web.result }}'
          check build         '${{ needs.build.result }}'
          check e2e           '${{ needs.e2e.result }}'
          check image         '${{ needs.image.result }}'
          exit $status
