# Runs exactly what `task ci` runs locally (plan section 4: "Lokal und CI identisch").
name: ci

# A branch with an open pull request used to fire twice for the same commit: once for `push`
# (every branch) and once for `pull_request`. Two full runs raced for the same quota and the same
# 75-minute limit, which is how run 39789916437 was cancelled while its twin 39790013960 ran on.
# `push` is therefore limited to main (the record of what is merged) and everything else is checked
# through its pull request. A branch without one is checked as soon as it has one, and
# `workflow_dispatch` runs it by hand before that.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch: a new push replaces the run of the commit it supersedes. Runs on main are
# never cancelled -- they record whether what was merged is sound.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # pnpm first: setup-node@v5 caches the package manager named in package.json#packageManager
      # and needs the binary on PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One apt transaction for everything the suite needs from the system: ffmpeg for the probe
      # tests and the test media, pulseaudio for the Firefox audio sink below, and Playwright's own
      # library list. Three separate steps used to run `apt-get update` three times and downloaded
      # the same index again each time; on 22 October that cost 11.5 min for ffmpeg alone
      # (run 39789916437), because the package downloads are at the mercy of the Azure mirror.
      - name: Install the system packages (ffmpeg, pulseaudio, Playwright libraries)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg pulseaudio pulseaudio-utils
          pnpm --filter @slouchcat/web exec playwright install-deps chromium firefox

      # Firefox drives an audio-only title from its audio sink. A runner has no audio output, so
      # the sink fails, the element reports MediaError 3 ("OnMediaSinkAudioError"), hls.js detaches
      # and re-attaches it, and the audiobook specs never play on (M6: H-1, H-3, O-5). A null sink
      # is an output that goes nowhere; Chromium brings its own and needs none. The step fails
      # loudly when the sink is missing, so the flake cannot come back unnoticed.
      - name: Give Firefox an audio output (the runner has none)
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=slouchcat_null
          pactl info

      # The browsers are a ~400 MB download that only changes with the Playwright version, which
      # the lock file pins. Downloading them on every run cost 8.3 min in run 39789916437; the
      # libraries they need come from the apt step above and are installed either way.
      - name: Cache the Playwright browsers
        id: playwright-browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install the Playwright browsers
        if: steps.playwright-browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @slouchcat/web exec playwright install chromium firefox

      # The test media is generated from ffmpeg's own lavfi sources, so the same scripts and the
      # same ffmpeg always produce the same files -- both go into the key. The generator skips
      # files that are already there, so a restored cache is checked rather than trusted, and a
      # miss simply regenerates (2.9 min in run 39789916437).
      - name: ffmpeg version (part of the test media cache key)
        id: ffmpeg
        run: echo "version=$(ffmpeg -version | head -1 | cut -d' ' -f3)" >> "$GITHUB_OUTPUT"

      - name: Cache the generated test media
        uses: actions/cache@v4
        with:
          path: testdata/media
          key: testmedia-${{ runner.os }}-${{ steps.ffmpeg.outputs.version }}-${{ hashFiles('testdata/generate-media.sh', 'testdata/*.py') }}

      - name: Generate test media
        run: task testdata:media

      # Includes the Storybook screenshot checks, which run in the Playwright Docker image
      # (task web:storybook:test; the runner has Docker).
      - name: task ci
        run: task ci

      # Playwright artefacts (e2e/env.ts, storybook.config.ts): traces, screenshot diffs, reports.
      # Both folders start with a dot, and the action skips hidden files unless told otherwise:
      # without the flag every red run uploaded nothing, and the traces of a failure were lost.
      - name: Keep Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/node_modules/.playwright/
            web/node_modules/.playwright-storybook/
          include-hidden-files: true
          if-no-files-found: ignore

  # Container image for both platforms (P-1: images amd64 and arm64 start). Builds without pushing:
  # there is no registry yet (ADR 0001). The Go binary is cross-compiled; only the apt stage of the
  # arm64 image runs under QEMU. Each image is then loaded and must turn healthy in < 5 s.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build linux/amd64 and linux/arm64 (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Single-platform loads come from the cache of the step above.
      - name: Load the amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ github.sha }}
          load: true
          tags: slouchcat:ci-amd64
          cache-from: type=gha

      - name: Load the arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          build-args: VERSION=${{ github.sha }}
          load: true
          tags: slouchcat:ci-arm64
          cache-from: type=gha

      - name: amd64 turns healthy (< 5 s, idle RSS < 60 MB)
        run: IMAGE=slouchcat:ci-amd64 deploy/scripts/measure-healthy.sh

      # Under QEMU the emulator's own memory counts towards the RSS, hence the higher limit.
      # Under QEMU the start takes about 7 s on the runner (the backend detection's software test
      # encode runs emulated); P-1's 5 s applies to real hardware, this step only proves the image starts.
      - name: arm64 starts under emulation (healthy within 30 s)
        run: IMAGE=slouchcat:ci-arm64 MAX_HEALTHY_SECONDS=30 MAX_RSS_MB=120 deploy/scripts/measure-healthy.sh
