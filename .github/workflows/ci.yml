# Runs the same checks as `task ci` locally -- the same tasks, split over parallel jobs instead of
# one after the other. `task ci` remains the one local command that builds and checks everything
# (plan section 4); what the jobs below run are its parts, `task ci:server`, `task ci:web`,
# `task ci:storybook` and `task ci:e2e`, and `task ci` still runs all of them. Why the split, and what it costs in exchange:
# ADR docs/adr/0013-ci-parallele-jobs.md. Measured times: docs/perf/ci.md.
#
# The serial job this replaced took 56 minutes, which is longer than most pull requests deserve to
# wait (run 40207488836).
name: ci

# A branch with an open pull request used to fire twice for the same commit: once for `push`
# (every branch) and once for `pull_request`. Two full runs raced for the same quota and the same
# 75-minute limit, which is how run 39789916437 was cancelled while its twin 39790013960 ran on.
# `push` is therefore limited to main (the record of what is merged) and everything else is checked
# through its pull request. A branch without one is checked as soon as it has one, and
# `workflow_dispatch` runs it by hand before that.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Once a week main is checked in full whatever happened, and the -race build cache that only main
  # saves is renewed: a push to main skips the heavy jobs when a pull-request run already checked
  # its exact content (job "changes", ADR 0013 addendum of 15 November 2026).
  schedule:
    - cron: '23 2 * * 1'

# One run per pull request branch: a new push replaces the run of the commit it supersedes. On main
# every commit gets a run of its own: the runs record whether what was merged is sound, so none of
# them may be cancelled -- and none may wait either. With one group for all of main a merge waited
# for the run before it (3.75 min), and a second waiting run replaced the first, which then never
# ran at all: the merge of #77 (run 41704343177) got no main run. The commit id in the group
# gives each one its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------------------------
  # Does the pull request touch anything but documentation? A change to docs/, a Markdown file or
  # release notes cannot turn any check of this workflow red, yet it used to wait for the whole
  # run (about 18 minutes). The heavy jobs below therefore skip when this job answers "docs only",
  # and the gate counts a skipped job as green only then. What counts as documentation, and the
  # Markdown files that do not (prettier and the image read them), is .github/scripts/docs-only.sh.
  # A run by hand and the weekly run always check everything: main is the record of what is merged.
  # A push to main skips the heavy jobs only when a green pull-request run already checked exactly
  # the merged content (.github/scripts/already-tested.sh); the gate then names that run.
  # No third-party action: the merge commit of a pull request has the base as its first parent,
  # so `git diff HEAD^1 HEAD` is the pull request's change and a checkout two commits deep is enough.
  # ---------------------------------------------------------------------------------------------
  changes:
    name: changes (docs only?)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      tested: ${{ steps.tested.outputs.tested }}
      tested_run: ${{ steps.tested.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            # --no-renames: a file moved from code into docs/ (server/x.go -> docs/x.go) is then
            # listed under both paths, the deleted code path included. With rename detection it
            # would show only the new path under docs/ and the code change would count as docs.
            git diff --name-only --no-renames HEAD^1 HEAD | tee changed.txt
            docs_only=$(.github/scripts/docs-only.sh < changed.txt)
          else
            docs_only=false
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Documentation only: $docs_only"

      - id: tested
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            tested=$(.github/scripts/already-tested.sh)
          else
            tested=false
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          echo "Already checked by its pull-request run: $tested"

  # ---------------------------------------------------------------------------------------------
  # Server: the generators with their drift check and the linters, then the tests in parallel
  # groups. Split in two because the linters take about 90 seconds and the tests about 19 minutes:
  # running the linters once instead of once per test group saves three minutes of runner time and
  # reports a lint error minutes before the tests are through.
  # ---------------------------------------------------------------------------------------------
  server-lint:
    name: server (generators, linters)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: ./.github/actions/task

      # The first three steps of `task ci:server`; the fourth, server:test, is the job below.
      # golangci-lint and sqlc need no ffmpeg and no test media.
      - run: task server:gen server:gen:check server:lint

  # The groups are not listed here. They are read out of server/testgroups.txt, so adding a group
  # there gives it a job by itself; a list in this file as well would be the same names in two
  # places, and the half that was forgotten would be the half that runs no tests. The job needs
  # nothing but the checkout: `--matrix` answers from that one text file, without Go.
  server-groups:
    name: server test groups
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: groups
        run: |
          set -euo pipefail
          groups=$(server/scripts/testgroups.sh --matrix)
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "Test groups: $groups"

  server-test:
    name: server tests (${{ matrix.group }})
    needs: [changes, server-groups]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      # Every group reports its own result: a failure in one is not a reason to hide the others.
      fail-fast: false
      matrix:
        # Which packages a group holds is server/testgroups.txt. "rest" is every package no group
        # names, so a new package is tested from its first day without anyone having to touch any
        # of this. `task server:test` without GROUP -- what `task ci` and every local run do --
        # still runs all of them at once.
        group: ${{ fromJSON(needs.server-groups.outputs.groups) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: ./.github/actions/task

      # ffmpeg: the probe and transcode tests run it, and the test media are generated with it.
      - uses: ./.github/actions/system-packages
        with:
          group: server

      # setup-go caches the module and build cache under a key of go.sum alone. Its primary key hits
      # on every run, so it never saves again: the build cache it restores is whatever the first job
      # after a go.sum change compiled -- often a job without -race -- and every group then compiles
      # the race-instrumented packages from scratch ("Cache hit occurred on the primary key ...,
      # not saving cache" in the post step). This cache holds the -race build cache of one group.
      # The run id in the key gives every save a key of its own; restore-keys hand the newest one to
      # the next run. Only pushes to main save (step "Save the -race build cache" below): a pull
      # request restores main's cache, which every branch may read, but a cache it saved would be
      # readable by that branch alone, and five groups of them per push would crowd main's caches
      # (and the Playwright browsers) out of the 10-GB budget of the repository.
      - name: Restore the -race build cache of this group
        id: race-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-race-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('server/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('server/go.sum') }}-
            go-race-${{ runner.os }}-${{ matrix.group }}-

      - uses: ./.github/actions/test-media

      # -count=1: the restored cache also holds test results, and `go test` would report a package
      # whose inputs it thinks unchanged as "(cached)" instead of running it. The cache is there to
      # skip compiling, never to skip a test (run 41707865418 already showed four such packages).
      - run: task server:test GROUP=${{ matrix.group }}
        env:
          GOFLAGS: -count=1

      # Also after red tests: what was compiled is valid either way.
      - name: Save the -race build cache
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.race-cache.outputs.cache-primary-key }}

  # ---------------------------------------------------------------------------------------------
  # Relay: the second Go module (concept 27 section 5.7), the meeting point service and the push
  # forwarder with their check programs and the stand-in for Google's push service. Build, vet,
  # golangci-lint (the version server/go.mod pins, hence the second cache path) and the tests
  # under -race; `task ci:relay` is the same locally. No ffmpeg, no test media.
  # ---------------------------------------------------------------------------------------------
  relay:
    name: relay (build, linters, tests, images)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: |
            relay/go.mod
            server/go.sum

      - uses: ./.github/actions/task

      - run: task ci:relay

      # Both images, linux/amd64 only and without a push: a broken Dockerfile or .dockerignore
      # shows here and not first in the release run after the tag (code review minor 11). The
      # release builds arm64 as well; the binary is cross-compiled, so arm64 adds nothing to check.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the meeting point image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/relay/pair/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=relay-pair
          cache-to: type=gha,mode=max,scope=relay-pair

      - name: Build the push forwarder image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/relay/push/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=relay-push
          cache-to: type=gha,mode=max,scope=relay-push

  # ---------------------------------------------------------------------------------------------
  # Android: the phone app, the TV app and their modules (concept 27 section 5.7, concept 26 stage
  # 2a). Debug and release builds, lint with the own rules, the generators (client from the contract,
  # texts from the locales, tokens through Node) and the JVM tests with Robolectric (the TV's D-pad
  # tests included); `task ci:android` is the same locally. JDK 21 is the runner's own
  # (JAVA_HOME_21_X64), the SDK the runner's with the packages the build needs added; no third-party
  # action. The debug APKs of both apps stay with the run. The TV's emulator flow runs only locally
  # (task android:e2e:tv; docs/perf/K27-android-ci.md).
  # ---------------------------------------------------------------------------------------------
  android:
    name: android (builds, lint, generators, tests)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm and the workspace: the tokens (style-dictionary) for core/design.
      - uses: ./.github/actions/node

      - uses: ./.github/actions/task

      # The wrapper jar is a binary in the repository: it must be the one Gradle publishes for the
      # version in gradle-wrapper.properties (sha256 of gradle-9.9.2-wrapper.jar).
      - name: Check the Gradle wrapper
        run: echo "621008afc4f5d59357fcf06ffa644dd5aade5e091bdc363742710445f73cdaf8  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict -

      - name: JDK 21 and the Android SDK packages
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `yes` ends with SIGPIPE once sdkmanager stops reading; only sdkmanager's status counts.
          log=$(mktemp)
          if ! (yes || true) | "$sdkmanager" --licenses >"$log" 2>&1; then cat "$log"; exit 1; fi
          if ! "$sdkmanager" --install "platforms;android-37.2" "build-tools;37.0.0" "platform-tools" >"$log" 2>&1; then
            cat "$log"
            exit 1
          fi

      - name: Gradle caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Robolectric keeps the Android framework jars it downloads (about 150 MB) under ~/.m2.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: task ci:android

      - name: Keep the debug APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apks
          path: |
            android/app-mobile/build/outputs/apk/**/*.apk
            android/app-tv/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Keep the lint and test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Android against a real server (concept 27 section 12, «Vertrag»): the contract test of the
  # Kotlin client against bin/slouchcat with fresh data. A job of its own: it needs Go and ffmpeg,
  # and runs beside the job "android". Times: docs/perf/K27-android-ci.md.
  # ---------------------------------------------------------------------------------------------
  android-contract:
    name: android-contract (client against a real server)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: ./.github/actions/node

      - uses: ./.github/actions/task

      - name: Check the Gradle wrapper
        run: echo "621008afc4f5d59357fcf06ffa644dd5aade5e091bdc363742710445f73cdaf8  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict -

      # ffmpeg: the player's contract test needs real video (scripts/android-test-video.sh) and a
      # server that probes it (K27 stage 5).
      - uses: ./.github/actions/system-packages
        with:
          group: android-e2e

      - name: JDK 21 and the Android SDK packages
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          log=$(mktemp)
          if ! (yes || true) | "$sdkmanager" --licenses >"$log" 2>&1; then cat "$log"; exit 1; fi
          if ! "$sdkmanager" --install "platforms;android-37.2" "build-tools;37.0.0" "platform-tools" >"$log" 2>&1; then
            cat "$log"
            exit 1
          fi

      - name: Gradle caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-e2e-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-e2e-${{ runner.os }}-

      - run: task android:contract

      - name: Keep the contract test report on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-contract-reports
          path: android/core/api/build/reports/tests/contractTest/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # The flow of the phone app in an emulator (concept 27 section 12, «Gerät»): address, sign-in,
  # profile with PIN, browsing, the player, sign-out, against bin/slouchcat with the test media.
  #
  # NOT part of the gate "ci", and it may fail (continue-on-error): on the hosted runner the
  # emulator (37.3.10, the version that runs the same flow on the development machine) died with a
  # segmentation fault in each of three runs, about 80 s into the flow, with and without Vulkan in
  # the guest (docs/perf/K27-android-ci.md, «Emulator auf dem Runner»). Concept 27 section 5.7
  # leaves it to this measurement whether the flow runs here. Until the emulator holds, the flow
  # is run on the development machine before every pull request that touches the apps
  # (docs/dev/SETUP.md); this job stays to show when the runner's emulator holds. The AVD is made
  # here from the SDK's system image; no third-party action.
  # ---------------------------------------------------------------------------------------------
  android-emulator:
    name: android-emulator (flow, informational)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: ./.github/actions/node

      - uses: ./.github/actions/task

      - name: Check the Gradle wrapper
        run: echo "621008afc4f5d59357fcf06ffa644dd5aade5e091bdc363742710445f73cdaf8  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict -

      # ffmpeg: the flow plays real video (scripts/android-test-video.sh), and the server probes
      # the test media when it scans.
      - uses: ./.github/actions/system-packages
        with:
          group: android-e2e

      # KVM for the emulator: the runner has /dev/kvm, the runner user needs the rights to it.
      - name: JDK 21, the Android SDK packages, KVM and the AVD
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          log=$(mktemp)
          if ! (yes || true) | "$sdkmanager" --licenses >"$log" 2>&1; then cat "$log"; exit 1; fi
          image="system-images;android-36;google_apis;x86_64"
          if ! "$sdkmanager" --install "platforms;android-37.2" "build-tools;37.0.0" "platform-tools" "emulator" "$image" >"$log" 2>&1; then
            cat "$log"
            exit 1
          fi
          # The runner sets XDG_CONFIG_HOME, and avdmanager then keeps its AVDs below it instead of
          # ~/.android; a fixed ANDROID_AVD_HOME gives avdmanager, this step and the emulator one place.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n ci_phone -k "$image" >"$log" 2>&1 || { cat "$log"; exit 1; }
          # A phone of the mockup's size (412 dp wide), as sc_phone on the development machine.
          printf '%s\n' hw.lcd.width=1080 hw.lcd.height=2424 hw.lcd.density=420 hw.ramSize=4096 hw.keyboard=yes \
            >> "$ANDROID_AVD_HOME/ci_phone.avd/config.ini"

      - name: Gradle caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-e2e-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-e2e-${{ runner.os }}-

      # The test media (cached under the same key as the server tests, generated on a miss): with
      # them the emulator flow browses a real library (docs/perf/K27-android-ci.md).
      - uses: ./.github/actions/test-media

      - run: task android:e2e AVD=ci_phone

      # Also when the job was cancelled: a flow that hangs ends at the job's time limit, and its
      # logs (server, emulator, logcat) are what explains it.
      - name: Keep the instrumentation reports on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-reports
          path: |
            android/app-mobile/build/reports/androidTests/
            android/app-mobile/build/outputs/androidTest-results/
            android/app-mobile/build/e2e-logs/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # Web: generators with their drift check, linters and Vitest in one job, the Storybook screenshot
  # checks in another. The two need nothing from each other, and together they were the longest
  # job of the run after the e2e path (8 to 10 min: lint 1.7, Vitest 3.5, Storybook 3.6). No Go,
  # no ffmpeg, no browsers from apt -- the Storybook screenshots run in the official Playwright
  # Docker image, which brings its own Chromium and its own libraries.
  # ---------------------------------------------------------------------------------------------
  web:
    name: web (generators, linters, unit tests)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node

      - uses: ./.github/actions/task

      - run: task ci:web

  storybook:
    name: web (Storybook screenshots)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node

      - uses: ./.github/actions/task

      - run: task ci:storybook

      # Screenshot diffs of the Storybook run (storybook.config.ts). The folder starts with a dot,
      # and the action skips hidden files unless told otherwise: without the flag every red run
      # uploaded nothing.
      - name: Keep the Storybook report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-report
          path: web/node_modules/.playwright-storybook/
          include-hidden-files: true
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # The server binary with the web assets embedded, built once and handed to the e2e shards. Six
  # shards building the same binary would be six Go toolchains and six Vite builds for one file.
  # ---------------------------------------------------------------------------------------------
  build:
    name: build (server binary with the web assets)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `task build` stamps `git describe --tags` into the binary the e2e suite runs. With a
          # shallow clone that is a bare commit id, which the server reports as a development
          # build and never offers an update for, and the update-badge test (A-5) fails.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: ./.github/actions/node

      - uses: ./.github/actions/task

      # web:build then server:build: the PWA is copied into the Go embed folder before the binary
      # is linked, so the binary serves exactly this build.
      - run: task build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slouchcat-binary
          # Both builds: the e2e suite runs slouchcat-e2e (tag radiotest, plan 3.8).
          path: |
            server/bin/slouchcat
            server/bin/slouchcat-e2e
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # The Playwright suite, split into shards. Each shard is a whole run of its own on a runner of
  # its own: its own server with its own database and its own global setup. Within a shard
  # `workers: 1` still holds, so nothing races; what a shard does not have is the data of the spec
  # files that landed in the other shards, which is why every spec creates what it needs.
  # ---------------------------------------------------------------------------------------------
  e2e:
    name: e2e (shard ${{ matrix.shard }})
    needs: [changes, build]
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The length of this list is the shard count: `strategy.job-total` below reads it, so the
        # two can never drift apart. The shards are cut by measured duration, not by test count
        # (web/e2e/shard-plan.mjs from web/e2e/durations.json); `task web:e2e:shards:check` and
        # web:e2e:durations take the same count from CI_E2E_SHARDS in web/Taskfile.yml.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node

      - uses: ./.github/actions/task

      # ffmpeg for the test media, PulseAudio for the sink below, and Playwright's own library list.
      - uses: ./.github/actions/system-packages
        with:
          group: e2e
          playwright-browsers: chromium firefox

      # Firefox drives an audio-only title from its audio sink. A runner has no audio output, so
      # the sink fails, the element reports MediaError 3 ("OnMediaSinkAudioError"), hls.js detaches
      # and re-attaches it, and the audiobook specs never play on (M6: H-1, H-3, O-5). A null sink
      # is an output that goes nowhere; Chromium brings its own and needs none. The step fails
      # loudly when the sink is missing, so the flake cannot come back unnoticed.
      - name: Give Firefox an audio output (the runner has none)
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=slouchcat_null
          pactl info

      # The browsers are a ~400 MB download that only changes with the Playwright version, which
      # the lock file pins. Downloading them on every run cost 8.3 min in run 39789916437; the
      # libraries they need come from the apt step above and are installed either way.
      - name: Cache the Playwright browsers
        id: playwright-browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install the Playwright browsers
        if: steps.playwright-browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @slouchcat/web exec playwright install chromium firefox

      - uses: ./.github/actions/test-media

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slouchcat-binary
          path: server/bin

      # An artefact is a zip, and a zip from upload-artifact carries no execute bit: without this
      # the server never starts and every spec of the shard fails at the first page load.
      - name: Make the binary executable again (artefacts lose the bit)
        run: chmod +x server/bin/slouchcat server/bin/slouchcat-e2e

      # Every shard plans the same split (deterministic) and runs its part with --test-list.
      - run: task ci:e2e SHARD=${{ matrix.shard }}/${{ strategy.job-total }}

      # The blob report is the machine-readable form of the run, traces and screenshots included.
      # The gate job merges the six of them into one HTML report; a single report per shard would
      # be six reports with a sixth of the run in each. Uploaded on green runs too, because a shard
      # that passed on its retry is the interesting one.
      - name: Keep the blob report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: web/node_modules/.playwright/blob/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # Container image for both platforms (P-1: images amd64 and arm64 start). Unchanged; it already
  # ran next to the old serial job.
  # ---------------------------------------------------------------------------------------------
  image:
    name: image (amd64, arm64)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git describe` needs the tags and the commits behind them; a shallow clone has
          # neither and would stamp a bare commit id into the image.
          fetch-depth: 0

      # The version built into the binary is what the update check compares against the newest
      # release (server/internal/admin/update.go). A commit after a release describes as
      # `v1.4.0-12-gabc1234`, which the check reads as that release; a bare commit id is no
      # version at all, and the server then reports a development build instead of an update.
      - name: Describe the commit relative to the newest tag
        id: version
        # `--match`: the tags of the relay services and of the apps are no server version.
        run: echo "version=$(git describe --tags --match 'v[0-9]*' --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds without pushing: there is no registry yet for a pull request (ADR 0001). The Go
      # binary is cross-compiled; only the apt stage of the arm64 image runs under QEMU.
      - name: Build linux/amd64 and linux/arm64 (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Single-platform loads come from the cache of the step above.
      - name: Load the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.version }}
          load: true
          tags: slouchcat:ci-amd64
          cache-from: type=gha

      - name: Load the arm64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          load: true
          tags: slouchcat:ci-arm64
          cache-from: type=gha

      # The updater companion (ADR 0024) is published with every release; building it here keeps
      # the first release that carries it from being the first build. A Go cross-compile on the
      # Docker CLI image, nothing runs under QEMU. Own cache scope.
      - name: Build the updater image for linux/amd64 and linux/arm64 (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.updater
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: false
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater

      - name: amd64 turns healthy (< 5 s, idle RSS below the gate in measure-healthy.sh)
        run: IMAGE=slouchcat:ci-amd64 deploy/scripts/measure-healthy.sh

      # Emulated, so both numbers are the emulator's as much as the server's: P-1's 5 s and P-2's
      # memory apply to real hardware, and this step only proves that the arm64 image starts at all.
      # The RSS gate was 120 MB and read 114.9 MB on 23 October -- 96 % of its own limit, about to
      # break for the same reason the amd64 gate did. Measured that day: five runs of the 1.0 image
      # under QEMU on the reference machine gave 94.3 to 105.2 MB (healthy 6.8 to 8.6 s), the runner
      # 114.9 MB. 180 MB clears that spread of 20 MB with room to spare and still catches a server
      # that starts eating memory. See docs/perf/M10.md section 6.
      - name: arm64 starts under emulation (healthy within 30 s)
        run: IMAGE=slouchcat:ci-arm64 MAX_HEALTHY_SECONDS=30 MAX_RSS_MB=180 deploy/scripts/measure-healthy.sh

  # ---------------------------------------------------------------------------------------------
  # The gate. One job that waits for every other one and is green only when all of them are, so
  # there stays exactly one status check to require for a merge, and it is still called "ci / ci"
  # -- the name the old serial job had. Do not rename this job without changing that setting.
  #
  # It also merges the shards' blob reports into the one HTML report with all the traces, which is
  # what a red run uploads.
  # ---------------------------------------------------------------------------------------------
  ci:
    name: ci
    # Must run even when something before it failed, otherwise the gate would be "skipped" instead
    # of red and a broken run could look mergeable.
    if: always()
    needs: [changes, server-lint, server-groups, server-test, relay, android, android-contract, web, storybook, build, e2e, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `continue-on-error` on all three report steps: whether the report could be assembled must
      # never decide whether the gate is green. That is what the last step is for. A shard that
      # died before it wrote its blob would otherwise let the download fail and hide the summary
      # that says which job broke.
      - name: Collect the blob reports of the shards
        if: needs.e2e.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-blob-*
          merge-multiple: true
          path: blob-reports

      - uses: ./.github/actions/node
        if: needs.e2e.result != 'skipped'
        continue-on-error: true

      # `merge-reports` reads the shards' blob files and writes one HTML report, with every test of
      # the run and the traces of the failures. It runs in web/, so the path is relative to it.
      - name: Merge the shards into one Playwright report
        if: needs.e2e.result != 'skipped'
        continue-on-error: true
        run: pnpm --filter @slouchcat/web exec playwright merge-reports --reporter html ../blob-reports

      - name: Keep the merged Playwright report
        if: needs.e2e.result != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report/
          include-hidden-files: true
          if-no-files-found: ignore

      # Named one by one rather than with `contains(needs.*.result, 'failure')`, so the log says
      # which job it was, and so a job that was skipped or cancelled is red here too instead of
      # slipping through as "not a failure".
      #
      # A job added to this workflow has to be added here and to `needs:` above, or the gate does
      # not watch it. That is the price of naming them; ADR 0013 carries it as a standing rule.
      #
      # "skipped" is green in exactly two cases, both decided by the job "changes" that itself
      # succeeded: it found nothing but documentation in the pull request, or (a push to main) a
      # green pull-request run already checked exactly this content in full. Any other skip -- a
      # job that never ran because something before it broke -- stays red, as before.
      - name: Every job of this workflow must be green
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          TESTED: ${{ needs.changes.outputs.tested }}
          TESTED_RUN: ${{ needs.changes.outputs.tested_run }}
        run: |
          set -eu
          status=0
          skip_ok=false
          reason=
          if [ "$CHANGES" = success ] && [ "$DOCS_ONLY" = true ]; then
            skip_ok=true
            reason="documentation only"
          elif [ "$CHANGES" = success ] && [ "$TESTED" = true ]; then
            skip_ok=true
            reason="checked by pull-request run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$TESTED_RUN"
          fi
          check() {
            if [ "$2" = skipped ] && [ "$skip_ok" = true ]; then
              printf '%-14s %s\n' "$1" "skipped ($reason)"
              return
            fi
            printf '%-14s %s\n' "$1" "$2"
            [ "$2" = success ] || status=1
          }
          printf '%-14s %s (documentation only: %s)\n' changes "$CHANGES" "${DOCS_ONLY:-?}"
          [ "$CHANGES" = success ] || status=1
          check server-lint   '${{ needs.server-lint.result }}'
          check server-groups '${{ needs.server-groups.result }}'
          check server-test   '${{ needs.server-test.result }}'
          check relay         '${{ needs.relay.result }}'
          check android       '${{ needs.android.result }}'
          check android-contract '${{ needs.android-contract.result }}'
          check web           '${{ needs.web.result }}'
          check storybook     '${{ needs.storybook.result }}'
          check build         '${{ needs.build.result }}'
          check e2e           '${{ needs.e2e.result }}'
          check image         '${{ needs.image.result }}'
          exit $status
