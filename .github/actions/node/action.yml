# pnpm, Node and the workspace dependencies, the same three steps in every job that touches the
# web side.
#
# pnpm first: setup-node@v5 caches the package manager named in package.json#packageManager and
# needs the binary on PATH.
name: Set up Node and pnpm
description: Installs pnpm and Node and runs a frozen-lockfile install of the workspace

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .tool-versions
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
