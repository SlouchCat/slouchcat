openapi: 3.1.0
info:
  title: Slouchcat API
  version: 0.2.0
  summary: Public API of the Slouchcat media server.
  description: |
    Contract-first API of Slouchcat. Server handlers and the web client are generated from this file.

    Every operation carries the vendor extension `x-visibility` with one of the values
    `public` (no session needed), `scoped` (filtered through the visibility layer of the active
    profile), `system` (unfiltered, internal callers only) or `admin` (main account only).
    A schema test fails when an operation has no marker.

    Sessions: the web app authenticates with the cookie `slouchcat_session` (HttpOnly, SameSite=Lax).
    Every request with a method other than GET, HEAD or OPTIONS must carry the header
    `X-Requested-With: Slouchcat`, otherwise the server answers 403 `csrf_header_missing`.
    `scoped` and `admin` operations without a valid session answer 401 `unauthenticated`.

    Errors use RFC 9457 problem details (`application/problem+json`) with the extra member `code`,
    a stable machine-readable identifier such as `not_found` or `validation_failed`.
    Items that the active profile may not see answer with HTTP 404, never 403.

    Binary endpoints (images, media streams) are described here but implemented as plain
    `http.Handler`s (plan principle 3): the generated strict server covers only JSON operations.

    Stream tokens (plan 5.4): the media stream and the HLS endpoints are authorised by the query
    parameter `st` from `PlaybackInfo.streamUrl` instead of the cookie, so native players work too.
    Every response carries `Referrer-Policy: no-referrer`, so the token never leaves in a Referer.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
    description: Same origin as the web app.
tags:
  - name: system
    description: Health and server information.
  - name: setup
    description: First-start wizard.
  - name: auth
    description: Login, logout and the active session.
  - name: items
    description: Titles, images and playback, always scoped to the active profile.
  - name: admin
    description: Administration by the main account.
  - name: spike
    description: Temporary endpoints of the offline spike (M1a, removed after the M1b decision).
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and readiness of the server
      description: |
        Returns 200 once the HTTP server listens, the database is open and migrations ran.
        Used by the container health check and the web app to detect a reachable server.
      tags: [system]
      x-visibility: public
      security: []
      responses:
        "200":
          description: The server is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The server is starting or a dependency is not ready.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /setup:
    get:
      operationId: getSetupStatus
      summary: Whether the first-start wizard still has to run
      tags: [setup]
      x-visibility: public
      security: []
      responses:
        "200":
          description: Setup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
    post:
      operationId: runSetup
      summary: Run the first-start wizard
      description: |
        Creates the main account with its default profile, the first library and optionally stores the
        TMDB key (encrypted at rest). The key is checked against TMDB before it is stored. On success the
        caller is logged in (session cookie). Allowed only while no account exists.
      tags: [setup]
      x-visibility: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Setup completed; the response carries the new session.
          headers:
            Set-Cookie:
              description: Session cookie `slouchcat_session`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "403":
          description: CSRF header missing (`csrf_header_missing`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Setup already completed (`setup_done`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many attempts from this client (`too_many_attempts`); `Retry-After` names the pause in seconds.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            Validation failed. Codes: `validation_failed` (see `errors`), `library_path_invalid`
            (not absolute, missing, not a directory or not readable), `tmdb_key_invalid` (TMDB answered 401),
            `tmdb_unreachable` (TMDB did not answer; retry or leave the key empty).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/login:
    post:
      operationId: login
      summary: Log in with e-mail and password
      tags: [auth]
      x-visibility: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; the response carries the session.
          headers:
            Set-Cookie:
              description: Session cookie `slouchcat_session`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          description: Unknown e-mail or wrong password (`invalid_credentials`). The message is the same for both.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: CSRF header missing (`csrf_header_missing`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many attempts from this client (`too_many_attempts`); `Retry-After` names the pause in seconds.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      x-visibility: scoped
      responses:
        "204":
          description: Session revoked and cookie cleared. Also 204 without a session.
        "403":
          description: CSRF header missing (`csrf_header_missing`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/session:
    get:
      operationId: getSession
      summary: Account and active profile of the current session
      tags: [auth]
      x-visibility: scoped
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /home:
    get:
      operationId: getHome
      summary: Rows of the start page for the active profile
      description: |
        Returns the rows in display order: `picks` (Cat's recommendations; M1a placeholder content),
        `continue` (continue watching) and `recent` (recently added). Empty rows are omitted (E-9).
        Every item passed the visibility layer of the active profile.
      tags: [items]
      x-visibility: scoped
      responses:
        "200":
          description: Start page rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePage"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /items/{id}:
    get:
      operationId: getItem
      summary: Detail of a title
      tags: [items]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/ItemID"
      responses:
        "200":
          description: The title with its media files and the resume position of the active profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetail"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Unknown or not visible for the active profile (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /items/{id}/images/{kind}/{size}:
    get:
      operationId: getItemImage
      summary: Poster or backdrop of a title (binary)
      description: |
        Implemented as an `http.Handler`. Images are reachable only through the item ID; the handler checks
        the scope (not visible → 404) and answers with `Cache-Control: private, max-age=31536000, immutable`.
        The query parameter `v` is the content hash and serves cache busting only. Since M1b the image
        pipeline (plan 3.1) scales every image with ffmpeg: posters exist in `w200`, `w400` and `w800`,
        backdrops in `w780`, `w1280` and `w1920` (the number is the width in pixels). Every size is stored
        as WebP and as JPEG; the server answers WebP when the request's `Accept` header lists
        `image/webp`, JPEG otherwise, and sets `Vary: Accept`.
      tags: [items]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ImageKind"
        - name: size
          in: path
          required: true
          schema:
            type: string
            enum: [w200, w400, w800, w780, w1280, w1920]
        - name: v
          in: query
          required: false
          description: Content hash for cache busting; ignored by the server.
          schema:
            type: string
      responses:
        "200":
          description: The image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Unknown, not visible, or no image of this kind and size (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /items/{id}/play:
    post:
      operationId: startPlayback
      summary: Decide how the title is played and return the stream description
      description: |
        Decides between direct play, remux and transcode (plan 10.3) from the stored probe of the media
        file and the `capabilities` the client reports, creates a playback session and returns its
        stream URL with the stream token `st` (plan 5.4): the Range endpoint for `direct`, the HLS
        master playlist for `hls`. The token authorises every request of this playback without the
        session cookie; `DELETE /playback/sessions/{id}` and logout revoke it. A title that is not
        probed yet, or a server without a transcoder, plays directly and the client checks the codecs
        itself (`canPlayType`).
      tags: [items]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/ItemID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackRequest"
      responses:
        "200":
          description: Playback description.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackInfo"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: CSRF header missing (`csrf_header_missing`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Unknown, not visible, or the requested media file does not belong to the title (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`), for example an over-long `deviceId`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: |
            The transcode budget stayed exhausted for 10 s (`transcode_busy`); the client may retry later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /items/{id}/stream:
    get:
      operationId: getItemStream
      summary: Direct play of the media file (binary, Range)
      description: |
        Implemented as an `http.Handler`. Serves the media file of a direct-play session through the
        `paths` package with full Range support (HTTP 206), authorised by the stream token `st` only
        (no cookie needed; plan 5.4). A missing, forged, revoked or expired token → 401; a token of
        another title, an HLS session or a title that is no longer visible → 404.
        `Accept-Ranges: bytes`, `Cache-Control: private, no-store`. Revoking the playback session
        (stop, logout, an ended login) also ends a response that is already streaming: the server
        closes the connection within a second.
      tags: [items]
      x-visibility: scoped
      security:
        - streamToken: []
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/StreamToken"
        - name: Range
          in: header
          required: false
          schema:
            type: string
            examples: ["bytes=0-"]
      responses:
        "200":
          description: Whole file.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/x-matroska:
              schema:
                type: string
                format: binary
        "206":
          description: Requested byte range.
          headers:
            Content-Range:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/x-matroska:
              schema:
                type: string
                format: binary
        "401":
          description: Stream token missing, forged, revoked or expired (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not visible, another title than the token's, or the file is missing (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "416":
          description: Range not satisfiable.

  /items/{id}/progress:
    post:
      operationId: reportProgress
      summary: Report a playback progress event
      description: |
        The client sends an event every 10 s, on pause and at the end (plan 3.4 step 7). The server
        stores the raw event (`progress_events`) and updates the merged position of the active profile.
        Positions at or beyond 90 % of the duration mark the title as completed.
      tags: [items]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/ItemID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressEvent"
      responses:
        "200":
          description: Merged progress after the event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: CSRF header missing (`csrf_header_missing`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Unknown or not visible (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /playback/sessions/{id}:
    delete:
      operationId: stopPlayback
      summary: End a playback session
      description: |
        Revokes the stream token of the playback session and stops its HLS output; requests with the
        token answer 401 from then on (plan 5.4). Only the browser session that started the playback
        may stop it; any other, unknown or already ended id answers 404. Logout ends all playback
        sessions of the browser session.
      tags: [items]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/PlaybackSessionID"
      responses:
        "204":
          description: Playback session ended.
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: CSRF header missing (`csrf_header_missing`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not a running playback session of this browser session (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /playback/sessions/{id}/master.m3u8:
    get:
      operationId: getPlaybackMaster
      summary: HLS master playlist (binary)
      description: |
        Implemented as an `http.Handler`, authorised by the stream token `st` only (plan 5.4). One
        variant: the media playlist `media.m3u8?st=…` (relative URL) with `CODECS`, `RESOLUTION` and
        `BANDWIDTH`. Every request re-checks the title through the visibility layer. When the server
        lost the HLS output of a valid playback session (restart), any HLS request rebuilds it; a
        segment request restarts the encoder at that segment.
        `Cache-Control: private, no-store`.
      tags: [items]
      x-visibility: scoped
      security:
        - streamToken: []
      parameters:
        - $ref: "#/components/parameters/PlaybackSessionID"
        - $ref: "#/components/parameters/StreamToken"
      responses:
        "200":
          description: Master playlist.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/StreamUnauthenticated"
        "404":
          $ref: "#/components/responses/StreamNotFound"
        "503":
          $ref: "#/components/responses/StreamUnavailable"

  /playback/sessions/{id}/media.m3u8:
    get:
      operationId: getPlaybackMedia
      summary: HLS media playlist (binary)
      description: |
        Implemented as an `http.Handler`, authorised by `st`. A complete VOD playlist (fMP4,
        `#EXT-X-MAP` to `init.mp4?st=…`, segments `seg/{n}?st=…`, relative URLs), created at start
        from the duration (transcode: 4-s grid) or the keyframe index (remux), so the client can seek
        anywhere at once (plan 3.5).
      tags: [items]
      x-visibility: scoped
      security:
        - streamToken: []
      parameters:
        - $ref: "#/components/parameters/PlaybackSessionID"
        - $ref: "#/components/parameters/StreamToken"
      responses:
        "200":
          description: Media playlist.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/StreamUnauthenticated"
        "404":
          $ref: "#/components/responses/StreamNotFound"
        "503":
          $ref: "#/components/responses/StreamUnavailable"

  /playback/sessions/{id}/init.mp4:
    get:
      operationId: getPlaybackInit
      summary: fMP4 initialisation segment (binary)
      description: Implemented as an `http.Handler`, authorised by `st`. `ftyp` and `moov` of the HLS output.
      tags: [items]
      x-visibility: scoped
      security:
        - streamToken: []
      parameters:
        - $ref: "#/components/parameters/PlaybackSessionID"
        - $ref: "#/components/parameters/StreamToken"
      responses:
        "200":
          description: Initialisation segment.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/StreamUnauthenticated"
        "404":
          $ref: "#/components/responses/StreamNotFound"
        "503":
          $ref: "#/components/responses/StreamUnavailable"

  /playback/sessions/{id}/seg/{n}:
    get:
      operationId: getPlaybackSegment
      summary: fMP4 media segment (binary)
      description: |
        Implemented as an `http.Handler`, authorised by `st`. Segment `n` of the media playlist
        (`moof` + `mdat`). A segment that is not produced yet is awaited while the encoder is close to
        it; a seek further away restarts the encoder at that segment (plan 3.5).
      tags: [items]
      x-visibility: scoped
      security:
        - streamToken: []
      parameters:
        - $ref: "#/components/parameters/PlaybackSessionID"
        - name: n
          in: path
          required: true
          description: Segment number, from 0.
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/StreamToken"
      responses:
        "200":
          description: Media segment.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/StreamUnauthenticated"
        "404":
          $ref: "#/components/responses/StreamNotFound"
        "503":
          $ref: "#/components/responses/StreamUnavailable"

  /admin/libraries:
    get:
      operationId: listLibraries
      summary: All libraries with their scan state
      tags: [admin]
      x-visibility: admin
      responses:
        "200":
          description: Libraries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Library"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Not the main account (`forbidden`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: createLibrary
      summary: Create a library and start its first scan
      tags: [admin]
      x-visibility: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryRequest"
      responses:
        "201":
          description: Created; the first scan is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Not the main account or CSRF header missing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`, `library_path_invalid`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/libraries/{id}:
    get:
      operationId: getLibrary
      summary: One library with its scan state
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/LibraryID"
      responses:
        "200":
          description: The library.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Not the main account (`forbidden`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Unknown library (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/libraries/{id}/scan:
    post:
      operationId: scanLibrary
      summary: Queue a full scan of the library
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/LibraryID"
      responses:
        "202":
          description: Scan queued (or already running).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Not the main account or CSRF header missing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Unknown library (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/libraries/{id}/accept-loss:
    post:
      operationId: acceptLibraryLoss
      summary: Accept that files disappeared and let the next scan apply the deletions
      description: |
        A scan aborts without changes when the library root is missing or empty or when more than 20 %
        of the known files vanished (plan 3.2). After this confirmation the next scan applies the loss.
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/LibraryID"
      responses:
        "202":
          description: Loss accepted; a scan is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Not the main account or CSRF header missing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Unknown library (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /spike/{variant}:
    get:
      operationId: getSpikeFile
      summary: Download file of the offline spike (binary, Range)
      description: |
        Temporary endpoint of the M1a offline spike (plan 10.4). Implemented as an `http.Handler` that
        serves `spike-fmp4.mp4` or `spike-faststart.mp4` from the directory in `SLOUCHCAT_SPIKE_DIR` with
        Range support. Without that setting the endpoint answers 404. Removed after the M1b decision.
      tags: [spike]
      x-visibility: public
      security: []
      parameters:
        - name: variant
          in: path
          required: true
          schema:
            type: string
            enum: [fmp4, faststart]
      responses:
        "200":
          description: Whole file.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "206":
          description: Requested byte range.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: Spike not enabled or file missing (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  responses:
    StreamUnauthenticated:
      description: Stream token missing, forged, revoked or expired (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StreamNotFound:
      description: |
        Unknown playback session, no HLS output, or the title is no longer visible (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StreamUnavailable:
      description: |
        `transcode_busy`: the HLS output was lost (server restart) and restarting it found no transcode
        budget within 10 s. `segment_restarted`: a newer seek restarted the encoder while this request
        waited (`Retry-After: 1`). `Retry-After` names the pause in seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: slouchcat_session
      description: Browser session (HttpOnly, SameSite=Lax; Secure over HTTPS).
    bearerToken:
      type: http
      scheme: bearer
      description: Bearer token for third-party clients. Added in M2.
    streamToken:
      type: apiKey
      in: query
      name: st
      description: |
        Stream token of a playback session (plan 5.4), returned in `PlaybackInfo.streamUrl`:
        `<playback session id>.<base64url HMAC-SHA256 over id and item>`. No expiry inside the token;
        the playback session expires 12 h after its last request and is revoked on stop and logout.
  parameters:
    ItemID:
      name: id
      in: path
      required: true
      description: Item ID (ULID).
      schema:
        $ref: "#/components/schemas/ItemID"
    PlaybackSessionID:
      name: id
      in: path
      required: true
      description: Playback session ID (ULID) from `PlaybackInfo.playbackSessionId`.
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    StreamToken:
      name: st
      in: query
      required: true
      description: Stream token from `PlaybackInfo.streamUrl` (plan 5.4). Redacted in all logs.
      schema:
        type: string
        maxLength: 128
    LibraryID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    Health:
      type: object
      required: [status, version, uptimeSeconds]
      properties:
        status:
          type: string
          enum: [ok]
          description: Always `ok` on a 200 response.
        version:
          type: string
          description: Server version as built, for example `0.1.0+abc1234`.
          examples: ["0.1.0+abc1234"]
        uptimeSeconds:
          type: integer
          format: int64
          minimum: 0
          description: Seconds since the process started.

    Problem:
      type: object
      description: RFC 9457 problem details with a stable `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI reference identifying the problem type; `about:blank` for generic HTTP errors.
          examples: ["about:blank"]
        title:
          type: string
          description: Short human-readable summary, English, stable per `code`.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code of this response.
        detail:
          type: string
          description: Human-readable explanation for this occurrence. Never contains secrets.
        instance:
          type: string
          format: uri-reference
          description: Request path that produced the problem.
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: Stable machine-readable identifier, for example `not_found`, `validation_failed`, `not_ready`.
          examples: ["not_found"]
        errors:
          type: array
          description: Field errors for `validation_failed`.
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: JSON pointer-like field name, for example `email` or `library.path`.
        code:
          type: string
          description: Stable identifier the client translates, for example `required`, `too_short`, `invalid_email`.

    SetupStatus:
      type: object
      required: [setupRequired]
      properties:
        setupRequired:
          type: boolean
          description: True until the wizard created the main account.

    SetupRequest:
      type: object
      required: [email, password, library]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 256
          writeOnly: true
        library:
          $ref: "#/components/schemas/LibraryRequest"
        tmdbApiKey:
          type: string
          writeOnly: true
          description: TMDB v4 read access token; optional. Stored encrypted, never returned.
        language:
          $ref: "#/components/schemas/Language"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          maxLength: 256
          writeOnly: true

    SessionInfo:
      type: object
      required: [account, profile]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        profile:
          $ref: "#/components/schemas/Profile"

    Account:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner]
          description: M1a knows only the main account.

    Profile:
      type: object
      description: A viewing profile. Profiles carry no e-mail and no password (K-1); only `name` is required.
      required: [id, name, maxRating, language]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 60
        image:
          type: string
          format: uri-reference
          description: Optional profile image (M2).
        maxRating:
          $ref: "#/components/schemas/Rating"
        language:
          $ref: "#/components/schemas/Language"
        accent:
          type: string
          description: Accent colour token name, for example `ember` (M2).

    Language:
      type: string
      enum: [de, en]

    Rating:
      type: integer
      description: FSK age rating.
      enum: [0, 6, 12, 16, 18]

    ItemID:
      type: string
      description: ULID of an item.
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"

    ItemKind:
      type: string
      enum: [movie, series, season, episode, extra, audiobook, podcast, podcast_episode]

    ImageKind:
      type: string
      enum: [poster, backdrop]

    ImageRef:
      type: object
      required: [url, width, height]
      properties:
        url:
          type: string
          format: uri-reference
          description: Relative URL under the API base, including the cache-busting `v` parameter.
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1

    ItemImages:
      type: object
      properties:
        poster:
          $ref: "#/components/schemas/ImageRef"
        backdrop:
          $ref: "#/components/schemas/ImageRef"
        backdropSmall:
          $ref: "#/components/schemas/ImageRef"
          description: Backdrop in w780 for viewports up to about 900 px.
        posterSmall:
          $ref: "#/components/schemas/ImageRef"
          description: Poster in w200 (narrow cards, `srcset`); M1b image pipeline.
        posterLarge:
          $ref: "#/components/schemas/ImageRef"
          description: Poster in w800 (detail page on wide screens); M1b image pipeline.
        backdropLarge:
          $ref: "#/components/schemas/ImageRef"
          description: Backdrop in w1920 for viewports above about 1400 px; M1b image pipeline.

    Progress:
      type: object
      required: [positionMs, durationMs, percent, completed, updatedAt]
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
          minimum: 0
        percent:
          type: number
          minimum: 0
          maximum: 100
        completed:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    ItemRef:
      type: object
      description: |
        A title as it appears in lists. Every response that contains an ItemRef is `scoped`; the
        contract test enforces this.
      required: [id, kind, title, images]
      properties:
        id:
          $ref: "#/components/schemas/ItemID"
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
          description: Title in the profile language, fallback English, fallback parsed file name.
        year:
          type: integer
        runtimeMinutes:
          type: integer
          minimum: 0
        rating:
          $ref: "#/components/schemas/Rating"
          description: Effective FSK rating; omitted when unknown (then hidden from profiles under 18).
        images:
          $ref: "#/components/schemas/ItemImages"
        accent:
          type: string
          pattern: "^#[0-9a-f]{6}$"
          description: |
            Accent colour of the title, derived from its poster by the image pipeline (plan 3.1:
            `palettegen`, the most saturated colour at medium lightness). Lower-case hex, for the
            poster tint and the backdrop scrim; omitted while no poster is processed.
        progress:
          $ref: "#/components/schemas/Progress"

    ItemDetail:
      allOf:
        - $ref: "#/components/schemas/ItemRef"
        - type: object
          required: [mediaFiles, genres]
          properties:
            originalTitle:
              type: string
            tagline:
              type: string
            overview:
              type: string
            releaseDate:
              type: string
              format: date
            genres:
              type: array
              items:
                type: string
            tmdbId:
              type: integer
              format: int64
            mediaFiles:
              type: array
              items:
                $ref: "#/components/schemas/MediaFileInfo"

    MediaFileInfo:
      type: object
      required: [id, container, sizeBytes, available]
      properties:
        id:
          type: string
        container:
          type: string
          description: Container by extension, for example `mp4`, `mkv`.
        mimeType:
          type: string
          description: MIME type with codecs parameter when known, for example `video/mp4; codecs="avc1.640028, mp4a.40.2"`.
        videoCodec:
          type: string
        audioCodec:
          type: string
        width:
          type: integer
        height:
          type: integer
        durationMs:
          type: integer
          format: int64
        sizeBytes:
          type: integer
          format: int64
        versionLabel:
          type: string
          description: Version label parsed from the file name, for example `1080p` (B-5 in M3).
        available:
          type: boolean
          description: False while the file is missing (24 h grace period).

    HomeRowKey:
      type: string
      enum: [picks, continue, recent]

    HomeRow:
      type: object
      required: [key, items]
      properties:
        key:
          $ref: "#/components/schemas/HomeRowKey"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemRef"

    HomePage:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/HomeRow"

    PlaybackRequest:
      type: object
      properties:
        mediaFileId:
          type: string
          description: Which file to play; defaults to the primary file.
        deviceId:
          type: string
          maxLength: 64
          description: Stable client identifier (used for progress merging in M5).
        capabilities:
          $ref: "#/components/schemas/PlaybackCapabilities"

    PlaybackCapabilities:
      type: object
      description: |
        What the client can play, from `canPlayType` / `MediaSource.isTypeSupported` (device profiles
        follow in M4). Without it the server assumes H.264 and AAC through MSE.
      required: [video, audio, hls]
      properties:
        video:
          type: array
          maxItems: 16
          description: Decodable video codecs, ffprobe names (`h264`, `hevc`, `av1`, `vp9`).
          items:
            type: string
            pattern: "^[a-z0-9]{1,16}$"
        audio:
          type: array
          maxItems: 16
          description: Decodable audio codecs, ffprobe names (`aac`, `ac3`, `eac3`, `mp3`, `opus`, `flac`).
          items:
            type: string
            pattern: "^[a-z0-9]{1,16}$"
        hls:
          type: string
          enum: [native, mse, none]
          description: "`native`: the media element plays HLS itself (Safari); `mse`: through hls.js; `none`: no HLS."

    PlaybackInfo:
      type: object
      required: [mode, item, mediaFile, streamUrl, resumePositionMs, playbackSessionId]
      properties:
        mode:
          type: string
          enum: [direct, hls]
          description: "`direct`: the file as it is through the Range endpoint; `hls`: fMP4-HLS (remux or transcode)."
        item:
          $ref: "#/components/schemas/ItemRef"
        mediaFile:
          $ref: "#/components/schemas/MediaFileInfo"
        streamUrl:
          type: string
          format: uri-reference
          description: |
            Relative URL with the stream token `st`: the Range endpoint (`direct`) or the HLS master
            playlist (`hls`).
        playbackSessionId:
          type: string
          description: ID of the playback session, for `DELETE /playback/sessions/{id}` when playback ends.
        transcoding:
          $ref: "#/components/schemas/Transcoding"
        resumePositionMs:
          type: integer
          format: int64
          minimum: 0
          description: Position to resume from; 0 when the title was never started or was completed.

    Transcoding:
      type: object
      description: How an `hls` playback is produced; absent for direct play.
      required: [mode, reason]
      properties:
        mode:
          type: string
          enum: [remux, transcode]
          description: "`remux`: the video is copied into fMP4; `transcode`: encoded to H.264/AAC."
        backend:
          type: string
          description: Encoder backend of a transcode (`nvenc`, `qsv`, `vaapi`, `software`).
        reason:
          type: string
          description: |
            Why the file is not played directly (`container`, `video_codec`, `audio_codec`, `hdr`,
            `pixel_format` for H.264 High 10 and 4:2:2/4:4:4 sources, `keyframes_pending` for a remux
            candidate that is transcoded until its keyframe index exists).

    ProgressEvent:
      type: object
      required: [positionMs, durationMs, playedMs, seq, state, clientTime]
      properties:
        mediaFileId:
          type: string
        positionMs:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
          minimum: 0
        playedMs:
          type: integer
          format: int64
          minimum: 0
          description: Milliseconds actually played since the previous event.
        seq:
          type: integer
          format: int64
          minimum: 0
          description: Running sequence number per playback on the client.
        state:
          type: string
          enum: [playing, paused, ended]
        clientTime:
          type: string
          format: date-time
          description: Device clock when the event was created.

    LibraryKind:
      type: string
      enum: [movies, series]

    LibraryRequest:
      type: object
      required: [name, kind, path]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          $ref: "#/components/schemas/LibraryKind"
        path:
          type: string
          description: Absolute directory on the server (inside the container, for example `/media/Filme`).
          minLength: 1
          maxLength: 4096

    ScanState:
      type: string
      enum: [never, queued, running, done, failed, aborted]
      description: |
        `aborted` means the loss protection stopped the scan (root missing or empty, or more than 20 % of
        the files vanished); `lastError` carries the reason and `acceptLibraryLoss` lifts the block.

    Library:
      type: object
      required: [id, name, kind, roots, scan, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LibraryKind"
        roots:
          type: array
          items:
            $ref: "#/components/schemas/LibraryRoot"
        scan:
          $ref: "#/components/schemas/LibraryScan"
        createdAt:
          type: string
          format: date-time

    LibraryRoot:
      type: object
      required: [id, path, fsType, watch]
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
        fsType:
          type: string
          description: Detected file system class (`ext4`, `xfs`, `btrfs`, `zfs`, `fuse`, `nfs`, `smb`, `unknown`).
        watch:
          type: string
          enum: [inotify, poll, inotify_poll]
          description: Change detection strategy chosen from `fsType` (plan 3.4).
        warning:
          type: string
          description: Stable code for a warning shown in the wizard, for example `network_share`.

    LibraryScan:
      type: object
      required: [state, itemCount, fileCount]
      properties:
        state:
          $ref: "#/components/schemas/ScanState"
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        filesSeen:
          type: integer
          description: Files processed in the running or last scan.
        filesTotal:
          type: integer
          description: Files found by the directory walk of the running or last scan.
        lastError:
          type: string
          description: Stable code (`root_missing`, `root_empty`, `loss_over_threshold`) or a message.
        lossAcceptedAt:
          type: string
          format: date-time
        itemCount:
          type: integer
          description: Titles that are not deleted.
        fileCount:
          type: integer
          description: Media files that are not missing.
