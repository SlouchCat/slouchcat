          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminItem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown title (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/items/{id}/match:
    put:
      operationId: setItemMatch
      summary: Assign a title manually to a provider entry (B-6)
      description: |
        Stores the provider id on the title, locks the provider ids against enrichment and queues a metadata
        refresh at high priority; images and trailers follow from it. The assignment survives every later scan
        and refresh: files are matched by path, inode and hash, never by title, and locked fields are never
