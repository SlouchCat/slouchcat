      responses:
        "202":
          description: Jobs queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminItem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
