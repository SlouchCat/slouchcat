                $ref: "#/components/schemas/Problem"
        "403":
          description: Not the main account (`forbidden`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Unknown library (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/libraries/{id}/scan:
    post:
      operationId: scanLibrary
      summary: Queue a full scan of the library
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/LibraryID"
      responses:
        "202":
          description: Scan queued (or already running).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Not the main account or CSRF header missing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Unknown library (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

    delete:
      operationId: cancelLibraryScan
      summary: Cancel the queued or running scan of a library
      description: |
        Cancels the active scan job (M3: the first scan of a large collection may take hours and must be
        interruptible, decision 3). The scan ends with state `aborted` and `lastError` `cancelled`; the next
        scheduled or triggered scan runs normally. Without an active scan the library is returned unchanged.
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/LibraryID"
      responses:
        "202":
          description: Cancellation requested; the library with its scan state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown library (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/libraries/{id}/accept-loss:
    post:
      operationId: acceptLibraryLoss
      summary: Accept that files disappeared and let the next scan apply the deletions
      description: |
        A scan aborts without changes when the library root is missing or empty or when more than 20 %
        of the known files vanished (plan 3.2). After this confirmation the next scan applies the loss.
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/LibraryID"
      responses:
        "202":
          description: Loss accepted; a scan is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Not the main account or CSRF header missing.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Unknown library (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/invitations:
    get:
      operationId: listInvitations
      summary: Invitation links with their state
      tags: [admin]
      x-visibility: admin
      responses:
