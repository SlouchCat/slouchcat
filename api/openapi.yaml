openapi: 3.1.0
info:
  title: Slouchcat API
  version: 0.6.0
  summary: Public API of the Slouchcat media server.
  description: |
    Contract-first API of Slouchcat. Server handlers and the web client are generated from this file.

    Every operation carries the vendor extension `x-visibility` with one of the values
    `public` (no session needed), `account` (a valid session, no profile needed: profile picker,
    profile management of the own account), `scoped` (filtered through the visibility layer of the
    active profile), `system` (unfiltered, internal callers only) or `admin` (main account with its
    primary profile active). A schema test fails when an operation has no marker.

    Profiles (M2): a login starts a session without an active profile unless the account has exactly
    one profile without PIN. `selectProfile` activates a profile (with its PIN, K-4) in place; `scoped`
    operations of a session without profile answer 403 `profile_required`. Each account has one
    primary profile (`isPrimary`), created with the account, that manages the account's profiles.

    Sessions: the web app authenticates with the cookie `slouchcat_session` (HttpOnly, SameSite=Lax).
    Every request with a method other than GET, HEAD or OPTIONS must carry the header
    `X-Requested-With: Slouchcat`, otherwise the server answers 403 `csrf_header_missing`.
    `account`, `scoped` and `admin` operations without a valid session answer 401 `unauthenticated`.
    The cookie `slouchcat_device` identifies the browser (PIN lock per profile and device, AN-11).

    Errors use RFC 9457 problem details (`application/problem+json`) with the extra member `code`,
    a stable machine-readable identifier such as `not_found` or `validation_failed`.
    Items that the active profile may not see answer with HTTP 404, never 403.

    Binary endpoints (images, media streams) are described here but implemented as plain
    `http.Handler`s (plan principle 3): the generated strict server covers only JSON operations.

    Stream tokens (plan 5.4): the media stream and the HLS endpoints are authorised by the query
    parameter `st` from `PlaybackInfo.streamUrl` instead of the cookie, so native players work too.
    Every response carries `Referrer-Policy: no-referrer`, so the token never leaves in a Referer.

    Offline (M5): a profile downloads movies, episodes and seasons to its device (`createDownloads`). The
    server prepares a fragmented MP4 per title in the background; the device fetches it through
    `getDownloadManifest` and the download token `dt`, stores it in the browser (OPFS) and plays it
    without the server. `syncOffline` keeps the device in step: which profiles may see each download
    (`allowedProfileIds`, computed by the server; the client only looks it up), which downloads it must
    delete, the offline PIN material and the remaining watch time. Buffered progress events go up with
    `uploadOfflineEvents`.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: /api/v1
    description: Same origin as the web app.
tags:
  - name: system
    description: Health and server information.
  - name: setup
    description: First-start wizard.
  - name: auth
    description: Login, logout and the active session.
  - name: items
    description: Titles, images and playback, always scoped to the active profile.
  - name: profiles
    description: Profile management of the signed-in account (K-2).
  - name: invitations
    description: Invitation links for guest accounts (K-6).
  - name: admin
    description: Administration by the main account.
  - name: offline
    description: Downloads to the device and offline playback (M5).
  - name: spike
    description: Temporary endpoints of the offline spike (M1a, removed after the M1b decision).
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and readiness of the server
      description: |
        Returns 200 once the HTTP server listens, the database is open and migrations ran.
        Used by the container health check and the web app to detect a reachable server.
      tags: [system]
      x-visibility: public
      security: []
      responses:
        "200":
          description: The server is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The server is starting or a dependency is not ready.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /setup:
    get:
      operationId: getSetupStatus
      summary: Whether the first-start wizard still has to run
      tags: [setup]
      x-visibility: public
      security: []
      responses:
        "200":
          description: Setup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
    post:
      operationId: runSetup
      summary: Run the first-start wizard
      description: |
        Creates the main account with its default profile, the first library and optionally stores the
        TMDB key (encrypted at rest). The key is checked against TMDB before it is stored. On success the
        caller is logged in (session cookie). Allowed only while no account exists.
      tags: [setup]
      x-visibility: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: Setup completed; the response carries the new session.
          headers:
            Set-Cookie:
              description: Session cookie `slouchcat_session`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "403":
          description: CSRF header missing (`csrf_header_missing`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Setup already completed (`setup_done`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many attempts from this client (`too_many_attempts`); `Retry-After` names the pause in seconds.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            Validation failed. Codes: `validation_failed` (see `errors`), `library_path_invalid`
            (not absolute, missing, not a directory or not readable), `tmdb_key_invalid` (TMDB answered 401),
            `tmdb_unreachable` (TMDB did not answer; retry or leave the key empty).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/login:
    post:
      operationId: login
      summary: Log in with e-mail and password
      tags: [auth]
      x-visibility: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: |
            Logged in; the response carries the session. `profile` is set only when the account has exactly
            one profile without PIN; otherwise the client shows the picker (`listMyProfiles`, `selectProfile`).
          headers:
            Set-Cookie:
              description: Session cookie `slouchcat_session`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          description: Unknown e-mail or wrong password (`invalid_credentials`). The message is the same for both.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: CSRF header missing (`csrf_header_missing`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many attempts from this client (`too_many_attempts`); `Retry-After` names the pause in seconds.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      x-visibility: account
      responses:
        "204":
          description: Session revoked and cookie cleared. Also 204 without a session.
          headers:
            Clear-Site-Data:
              description: '`"cache"`: the browser drops cached images of the signed-out profile.'
              schema:
                type: string
        "403":
          description: CSRF header missing (`csrf_header_missing`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/session:
    get:
      operationId: getSession
      summary: Account and active profile of the current session
      tags: [auth]
      x-visibility: account
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /auth/profiles:
    get:
      operationId: listMyProfiles
      summary: Profiles of the signed-in account for the profile picker
      description: |
        Every profile of the account with what the picker needs (name, accent, whether a PIN is set).
        Works before a profile is selected (`account`).
      tags: [auth]
      x-visibility: account
      responses:
        "200":
          description: Profiles of the account, primary profile first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfileSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/profiles/{id}/select:
    post:
      operationId: selectProfile
      summary: Activate a profile of the signed-in account (asks for its PIN)
      description: |
        Switches the session to the profile (K-4). A PIN-protected profile needs `pin`; wrong PINs are
        counted per profile and device (cookie `slouchcat_device`) and lock the profile from the third
        failure on for 30 s, 60 s, 120 s … up to 15 min (AN-11). Every playback session of the browser
        session is revoked, so stream tokens of the previous profile stop working, and the response
        carries `Clear-Site-Data: "cache"`.
      tags: [auth]
      x-visibility: account
      parameters:
        - $ref: "#/components/parameters/ProfileID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectProfileRequest"
      responses:
        "200":
          description: The session now runs as this profile.
          headers:
            Clear-Site-Data:
              description: '`"cache"`: the browser drops cached images of the previous profile.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: '`pin_required` (profile has a PIN, none sent), `pin_invalid` (wrong PIN) or `csrf_header_missing`.'
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No such profile in this account (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`; `pin` must be 4 to 8 digits).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: |
            `pin_locked`: too many wrong PINs for this profile on this device; `Retry-After` and the
            problem member `retryAfterSeconds` name the remaining lock in seconds. Also
            `too_many_attempts` for the per-client limit.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /profiles:
    get:
      operationId: listProfiles
      summary: Profiles of the signed-in account with their settings
      description: Profile management of the own account (K-2); needs the account's primary profile to be active.
      tags: [profiles]
      x-visibility: account
      responses:
        "200":
          description: Profiles, primary profile first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PrimaryProfileRequired"
    post:
      operationId: createProfile
      summary: Create a profile in the signed-in account
      tags: [profiles]
      x-visibility: account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PrimaryProfileRequired"
        "422":
          description: |
            Validation failed (`validation_failed`): `name` required or too long, `maxRating` above the
            account's limit (`above_account_limit`), unknown `accent` or `language`, `libraryIds` outside the
            account's libraries (`unknown_library`), more than 10 profiles (`too_many_profiles` on `name`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /profiles/{id}:
    patch:
      operationId: updateProfile
      summary: Change name, rating, language, accent or library rights of a profile
      description: Only the fields sent change. Lowering `maxRating` or removing a library right takes effect with the next request of that profile.
      tags: [profiles]
      x-visibility: account
      parameters:
        - $ref: "#/components/parameters/ProfileID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PrimaryProfileRequired"
        "404":
          description: No such profile in this account (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`), codes as for createProfile.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteProfile
      summary: Delete a profile with its progress
      description: The primary profile cannot be deleted (409 `primary_profile`). Sessions that had the profile active fall back to the profile picker; their playback sessions are revoked.
      tags: [profiles]
      x-visibility: account
      parameters:
        - $ref: "#/components/parameters/ProfileID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PrimaryProfileRequired"
        "404":
          description: No such profile in this account (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The primary profile of the account (`primary_profile`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /profiles/{id}/pin:
    put:
      operationId: setProfilePin
      summary: Set or replace the PIN of a profile
      tags: [profiles]
      x-visibility: account
      parameters:
        - $ref: "#/components/parameters/ProfileID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinRequest"
      responses:
        "204":
          description: PIN stored (argon2id); the lock counters of the profile are reset.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PrimaryProfileRequired"
        "404":
          description: No such profile in this account (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`; `pin` must be 4 to 8 digits).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: removeProfilePin
      summary: Remove the PIN of a profile
      tags: [profiles]
      x-visibility: account
      parameters:
        - $ref: "#/components/parameters/ProfileID"
      responses:
        "204":
          description: PIN removed. Also 204 when the profile had none.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PrimaryProfileRequired"
        "404":
          description: No such profile in this account (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /profiles/{id}/offline-pin:
    put:
      operationId: setOfflinePin
      summary: Set or replace the separate offline PIN of a profile (AN-19)
      description: |
        A separate, longer PIN (6 to 12 digits) that guards the profile in the offline library instead of
        the normal PIN. The server keeps a PBKDF2-SHA256 verifier (600 000 iterations, random salt) and
        hands it only to devices that hold downloads the profile may play (`syncOffline`). Protection
        goal: a curious child on a shared device, not a manipulated browser (plan 3.3). Online the normal
        PIN keeps guarding the profile. Only the account's primary profile may set it.
      tags: [profiles]
      x-visibility: account
      parameters:
        - $ref: "#/components/parameters/ProfileID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfflinePinRequest"
      responses:
        "204":
          description: Offline PIN stored.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PrimaryProfileRequired"
        "404":
          description: No such profile in this account (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`; `pin` must be 6 to 12 digits).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: removeOfflinePin
      summary: Remove the separate offline PIN of a profile
      description: Offline the profile is then guarded by its normal PIN again (if it has one).
      tags: [profiles]
      x-visibility: account
      parameters:
        - $ref: "#/components/parameters/ProfileID"
      responses:
        "204":
          description: Offline PIN removed. Also 204 when the profile had none.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PrimaryProfileRequired"
        "404":
          description: No such profile in this account (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /profiles/{id}/watch-time:
    get:
      operationId: getWatchReport
      summary: Watch-time report of a profile (K-5)
      description: |
        Minutes watched per calendar day (server's local time zone) for one profile of the account, from
        the raw progress events (`playedMs`), the last `days` days including today. Only the account's
        primary profile may read it, like every profile setting.
      tags: [profiles]
      x-visibility: account
      parameters:
        - $ref: "#/components/parameters/ProfileID"
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        "200":
          description: Report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchReport"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PrimaryProfileRequired"
        "404":
          description: No such profile in this account (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /libraries:
    get:
      operationId: listAccountLibraries
      summary: Libraries the signed-in account may see, by name
      description: |
        Names and kinds of the libraries available to the account (all libraries for the main account, the
        allowed ones for a guest), for the library choice in profile settings. No titles, so `account`.
      tags: [profiles]
      x-visibility: account
      responses:
        "200":
          description: Libraries, by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibrarySummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /invitations/{token}:
    get:
      operationId: getInvitation
      summary: Preview of an invitation link before accepting it
      description: Public, rate limited per client like login. The token is the last path segment of the invitation URL.
      tags: [invitations]
      x-visibility: public
      security: []
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      responses:
        "200":
          description: The invitation is open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "404":
          description: Unknown token (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: The link was used, expired or revoked (`invitation_gone`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many requests from this client (`too_many_attempts`).
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      summary: Create a guest account from an invitation link
      description: |
        Creates the guest account with its primary profile, limited to the rating ceiling and the libraries of
        the invitation, marks the link used (one-time, AN-14) and starts a session with the new profile
        active. The second attempt with the same link answers 410.
      tags: [invitations]
      x-visibility: public
      security: []
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "201":
          description: Guest account created and signed in.
          headers:
            Set-Cookie:
              description: Session cookie `slouchcat_session`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "403":
          description: CSRF header missing (`csrf_header_missing`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Unknown token (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: The link was used, expired or revoked (`invitation_gone`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`; `email` `already_exists` when an account uses it).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many attempts from this client (`too_many_attempts`).
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /home:
    get:
      operationId: getHome
      summary: Rows of the start page for the active profile
      description: |
        Returns the rows in display order: `picks` (Cat's recommendations; M1a placeholder content),
        `continue` (continue watching) and `recent` (recently added). Empty rows are omitted (E-9).
        Every item passed the visibility layer of the active profile.
      tags: [items]
      x-visibility: scoped
      responses:
        "200":
          description: Start page rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePage"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /items/{id}:
    get:
      operationId: getItem
      summary: Detail of a title
      tags: [items]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/ItemID"
      responses:
        "200":
          description: The title with its media files and the resume position of the active profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetail"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Unknown or not visible for the active profile (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /items/{id}/images/{kind}/{size}:
    get:
      operationId: getItemImage
      summary: Poster or backdrop of a title (binary)
      description: |
        Implemented as an `http.Handler`. Images are reachable only through the item ID; the handler checks
        the scope (not visible → 404) and answers with `Cache-Control: private, max-age=31536000, immutable`.
        The query parameter `v` is the content hash and serves cache busting only. Since M1b the image
        pipeline (plan 3.1) scales every image with ffmpeg: posters exist in `w200`, `w400` and `w800`,
        backdrops in `w780`, `w1280` and `w1920` (the number is the width in pixels). Every size is stored
        as WebP and as JPEG; the server answers WebP when the request's `Accept` header lists
        `image/webp`, JPEG otherwise, and sets `Vary: Accept`.
      tags: [items]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ImageKind"
        - name: size
          in: path
          required: true
          schema:
            type: string
            enum: [w200, w400, w800, w780, w1280, w1920]
        - name: v
          in: query
          required: false
          description: Content hash for cache busting; ignored by the server.
          schema:
            type: string
      responses:
        "200":
          description: The image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Unknown, not visible, or no image of this kind and size (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /items/{id}/trailers:
    get:
      operationId: getItemTrailers
      summary: Trailers of a title (B-8, W-10)
      description: |
        The YouTube trailers found for a film or series, one or more per language, the profile language
        first. Trailers come from the chain of plan 5.3 (TMDB videos, then the YouTube Data API, an optional
        AI provider) or were set by the administrator (`source` `manual`). The client plays them only in the
        YouTube IFrame player at `embedUrl` (`youtube-nocookie.com`); the server never downloads a video.
        An invisible title answers 404 like every other ID endpoint.
      tags: [items]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/ItemID"
      responses:
        "200":
          description: Trailers, profile language first; empty when none is known.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trailer"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Unknown or not visible for the active profile (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /people/{id}:
    get:
      operationId: getPerson
      summary: A person with the titles the active profile may see
      description: |
        Cast and crew come from the metadata provider (B-3). The credits list only visible titles; a person
        without any visible credit does not exist for the profile and answers 404 (plan 10.2: a person with
        roles in an FSK-6 and an FSK-18 film shows only the FSK-6 role to a 6-rated profile).
      tags: [items]
      x-visibility: scoped
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The person and the visible credits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Unknown person, or no visible credit for the active profile (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /items/{id}/play:
    post:
      operationId: startPlayback
      summary: Decide how the title is played and return the stream description
      description: |
        Decides between direct play, remux and transcode (plan 10.3) from the stored probe of the media
        file and the `capabilities` the client reports, creates a playback session and returns its
        stream URL with the stream token `st` (plan 5.4): the Range endpoint for `direct`, the HLS
        master playlist for `hls`. The token authorises every request of this playback without the
        session cookie; `DELETE /playback/sessions/{id}` and logout revoke it. A title that is not
        probed yet, or a server without a transcoder, plays directly and the client checks the codecs
        itself (`canPlayType`).
      tags: [items]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/ItemID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackRequest"
      responses:
        "200":
          description: Playback description.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackInfo"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: |
            CSRF header missing (`csrf_header_missing`), or the profile's daily watch-time limit is reached
            (`watch_limit_reached`, K-5; `extensions.limitMinutes` and `extensions.usedMinutes`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Unknown, not visible, or the requested media file does not belong to the title (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            The profile already runs as many streams as its limit allows (`stream_limit_reached`, W-8);
            `extensions.maxStreams` and `extensions.activeStreams` say how many. The client shows the hint and
            does not retry by itself.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            Validation failed (`validation_failed`), for example an over-long `deviceId`, an `audioTrack` or
            `subtitleTrack` that does not belong to the media file, or a `subtitleDelivery` of `text` for a
            bitmap track.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: |
            The transcode budget stayed exhausted for 10 s (`transcode_busy`); the client may retry later.
            For SDR sources the server first retries one rung lower (`budget_lowered`, plan 3.5); only an
            HDR source or an exhausted budget at the lowest rung answers 503.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /items/{id}/tracks:
    get:
      operationId: getItemTracks
      summary: Audio and subtitle tracks of a media file
      description: |
        The tracks of a media file of a visible title (embedded streams and sidecar subtitles). The player
        asks again while its track menu is open, so a subtitle Bazarr placed next to the file (I-5) appears
        within the watcher latency without restarting the playback. Without `mediaFileId` the primary file.
      tags: [items]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - name: mediaFileId
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Tracks of the file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackList"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Unknown, not visible, or the media file does not belong to the title (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /items/{id}/download-options:
    get:
      operationId: getDownloadOptions
      summary: Download profiles of a title with size estimates (O-1)
      description: |
        The three download profiles (`high` ≤ 1080p, `medium` ≤ 720p, `low` ≤ 480p; H.264 and AAC in
        fragmented MP4) with the expected size, the audio tracks and the text subtitles that travel along
        as WebVTT files. For a season the sizes are the sum over its visible episodes (`episodeCount`) and
        the track lists are empty (each episode takes its default audio track or `audioLanguage`). Movies,
        episodes and seasons only; other kinds answer 422 `not_downloadable`. `existing` is the download of
        this device for a movie or episode, when there is one.
      tags: [offline]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - name: mediaFileId
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Download options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadOptions"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Unknown, not visible, or the media file does not belong to the title (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Not a movie, an episode or a season (`not_downloadable`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /items/{id}/downloads:
    post:
      operationId: createDownloads
      summary: Download a movie, an episode or a whole season to this device (O-1, O-2)
      description: |
        Creates one download per title on the session's device: a movie or an episode gives one, a season
        all its visible episodes in one action (O-2). The server prepares the file in the background
        (queued → preparing → ready; paused while live playback needs the transcode budget, plan 3.5); the
        client fetches it through `getDownloadManifest` once `ready`. A title the device already has is
        returned as it is (a different quality needs `deleteDownload` first). `audioTrack` and
        `mediaFileId` apply to a single title only; for a season `audioLanguage` picks the track per
        episode (fallback: the default track). `allowedProfileIds` lists the profiles of the account that
        may see the title (plan 3.3).
      tags: [offline]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/ItemID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadRequest"
      responses:
        "201":
          description: The downloads of the request, new or existing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: CSRF header missing (`csrf_header_missing`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Unknown or not visible (`not_found`), also a season without visible episodes.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The session has no device (`device_required`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Not downloadable (`not_downloadable`) or validation failed (`validation_failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /items/{id}/stream:
    get:
      operationId: getItemStream
      summary: Direct play of the media file (binary, Range)
      description: |
        Implemented as an `http.Handler`. Serves the media file of a direct-play session through the
        `paths` package with full Range support (HTTP 206), authorised by the stream token `st` only
        (no cookie needed; plan 5.4). A missing, forged, revoked or expired token → 401; a token of
        another title, an HLS session or a title that is no longer visible → 404.
        `Accept-Ranges: bytes`, `Cache-Control: private, no-store`. Revoking the playback session
        (stop, logout, an ended login) also ends a response that is already streaming: the server
        closes the connection within a second.
      tags: [items]
      x-visibility: scoped
      security:
        - streamToken: []
      parameters:
        - $ref: "#/components/parameters/ItemID"
        - $ref: "#/components/parameters/StreamToken"
        - name: Range
          in: header
          required: false
          schema:
            type: string
            examples: ["bytes=0-"]
      responses:
        "200":
          description: Whole file.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/x-matroska:
              schema:
                type: string
                format: binary
        "206":
          description: Requested byte range.
          headers:
            Content-Range:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/x-matroska:
              schema:
                type: string
                format: binary
        "401":
          description: Stream token missing, forged, revoked or expired (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not visible, another title than the token's, or the file is missing (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "416":
          description: Range not satisfiable.

  /items/{id}/progress:
    post:
      operationId: reportProgress
      summary: Report a playback progress event
      description: |
        The client sends an event every 10 s, on pause and at the end (plan 3.4 step 7). The server
        stores the raw event (`progress_events`) and updates the merged position of the active profile.
        Positions at or beyond 90 % of the duration mark the title as completed.
      tags: [items]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/ItemID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressEvent"
      responses:
        "200":
          description: Merged progress after the event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Progress"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: CSRF header missing (`csrf_header_missing`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Unknown or not visible (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /playback/sessions/{id}:
    delete:
      operationId: stopPlayback
      summary: End a playback session
      description: |
        Revokes the stream token of the playback session and stops its HLS output; requests with the
        token answer 401 from then on (plan 5.4). Only the browser session that started the playback
        may stop it; any other, unknown or already ended id answers 404. Logout ends all playback
        sessions of the browser session.
      tags: [items]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/PlaybackSessionID"
      responses:
        "204":
          description: Playback session ended.
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: CSRF header missing (`csrf_header_missing`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not a running playback session of this browser session (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /playback/sessions/{id}/master.m3u8:
    get:
      operationId: getPlaybackMaster
      summary: HLS master playlist (binary)
      description: |
        Implemented as an `http.Handler`, authorised by the stream token `st` only (plan 5.4). One
        variant: the media playlist `media.m3u8?st=…` (relative URL) with `CODECS`, `RESOLUTION` and
        `BANDWIDTH`. Every request re-checks the title through the visibility layer. When the server
        lost the HLS output of a valid playback session (restart), any HLS request rebuilds it; a
        segment request restarts the encoder at that segment.
        `Cache-Control: private, no-store`.
      tags: [items]
      x-visibility: scoped
      security:
        - streamToken: []
      parameters:
        - $ref: "#/components/parameters/PlaybackSessionID"
        - $ref: "#/components/parameters/StreamToken"
      responses:
        "200":
          description: Master playlist.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/StreamUnauthenticated"
        "404":
          $ref: "#/components/responses/StreamNotFound"
        "503":
          $ref: "#/components/responses/StreamUnavailable"

  /playback/sessions/{id}/media.m3u8:
    get:
      operationId: getPlaybackMedia
      summary: HLS media playlist (binary)
      description: |
        Implemented as an `http.Handler`, authorised by `st`. A complete VOD playlist (fMP4,
        `#EXT-X-MAP` to `init.mp4?st=…`, segments `seg/{n}?st=…`, relative URLs), created at start
        from the duration (transcode: 4-s grid) or the keyframe index (remux), so the client can seek
        anywhere at once (plan 3.5).
      tags: [items]
      x-visibility: scoped
      security:
        - streamToken: []
      parameters:
        - $ref: "#/components/parameters/PlaybackSessionID"
        - $ref: "#/components/parameters/StreamToken"
      responses:
        "200":
          description: Media playlist.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/StreamUnauthenticated"
        "404":
          $ref: "#/components/responses/StreamNotFound"
        "503":
          $ref: "#/components/responses/StreamUnavailable"

  /playback/sessions/{id}/init.mp4:
    get:
      operationId: getPlaybackInit
      summary: fMP4 initialisation segment (binary)
      description: Implemented as an `http.Handler`, authorised by `st`. `ftyp` and `moov` of the HLS output.
      tags: [items]
      x-visibility: scoped
      security:
        - streamToken: []
      parameters:
        - $ref: "#/components/parameters/PlaybackSessionID"
        - $ref: "#/components/parameters/StreamToken"
      responses:
        "200":
          description: Initialisation segment.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/StreamUnauthenticated"
        "404":
          $ref: "#/components/responses/StreamNotFound"
        "503":
          $ref: "#/components/responses/StreamUnavailable"

  /playback/sessions/{id}/seg/{n}:
    get:
      operationId: getPlaybackSegment
      summary: fMP4 media segment (binary)
      description: |
        Implemented as an `http.Handler`, authorised by `st`. Segment `n` of the media playlist
        (`moof` + `mdat`). A segment that is not produced yet is awaited while the encoder is close to
        it; a seek further away restarts the encoder at that segment (plan 3.5).
      tags: [items]
      x-visibility: scoped
      security:
        - streamToken: []
      parameters:
        - $ref: "#/components/parameters/PlaybackSessionID"
        - name: n
          in: path
          required: true
          description: Segment number, from 0.
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/StreamToken"
      responses:
        "200":
          description: Media segment.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/StreamUnauthenticated"
        "404":
          $ref: "#/components/responses/StreamNotFound"
        "503":
          $ref: "#/components/responses/StreamUnavailable"

  /playback/sessions/{id}/subtitles/{track}.vtt:
    get:
      operationId: getPlaybackSubtitle
      summary: Text subtitle track as WebVTT (binary)
      description: |
        Implemented as an `http.Handler`, authorised by `st` (W-4). Converts an embedded text subtitle
        stream (SubRip, ASS/SSA, MOV text, WebVTT) or a sidecar file of the playback's media file to WebVTT
        with ffmpeg once per playback session and caches the result in the session's work directory. ASS
        styling is dropped. Works for direct and HLS playbacks alike: the client attaches the URL as a
        `<track>` element. `track` is the `id` of a `Track` with `kind` `subtitle` and `text` true; a bitmap
        track (PGS, DVD) or a track of another file answers 404. `Cache-Control: private, no-store`.
      tags: [items]
      x-visibility: scoped
      security:
        - streamToken: []
      parameters:
        - $ref: "#/components/parameters/PlaybackSessionID"
        - name: track
          in: path
          required: true
          description: Track id (`Track.id`).
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: "#/components/parameters/StreamToken"
      responses:
        "200":
          description: WebVTT file.
          content:
            text/vtt:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/StreamUnauthenticated"
        "404":
          $ref: "#/components/responses/StreamNotFound"

  /downloads/{id}:
    delete:
      operationId: deleteDownload
      summary: Delete a download (O-6)
      description: |
        Deletes a download of the session's account (any device of the account) together with the server's
        prepared copy. The device that holds the file learns it from the revocation list at its next sync
        and removes the file. The active profile may delete a download when it may see the title (it is in
        `allowedProfileIds`), when it requested the download, or when it is the account's primary profile.
        Any other download, a download of another account or an unknown id → 404.
      tags: [offline]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/DownloadID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: CSRF header missing (`csrf_header_missing`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: |
            Unknown or another account's download, or one the active profile may not delete (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /downloads/{id}/manifest:
    get:
      operationId: getDownloadManifest
      summary: Fragment index and file URL of a prepared download
      description: |
        Everything the device needs to fetch and play a download offline: the size, the init segment and
        every media segment of the fragmented MP4 with its time and byte range (the client builds a VOD
        playlist with byte ranges from it and plays through Media Source Extensions; spike decision AN-20),
        the codecs string, the audio track, the WebVTT subtitles and the file URL with the download token
        `dt`. Only for downloads of the session's device. The title must be visible to the active profile
        (404 otherwise); a download that is not prepared yet → 409 `download_not_ready`; a prepared copy the
        server already removed (fetched more than 24 h ago, or not fetched within 7 days) → 410
        `download_evicted` (the next sync prepares it again while the device lacks the file).
      tags: [offline]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/DownloadID"
      responses:
        "200":
          description: Manifest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadManifest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Unknown, another device's download, or the title is not visible to the active profile (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Not prepared yet (`download_not_ready`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "410":
          description: The server's prepared copy was removed (`download_evicted`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /downloads/{id}/file:
    get:
      operationId: getDownloadFile
      summary: The prepared download file (binary, Range)
      description: |
        Implemented as an `http.Handler`. Serves the fragmented MP4 of a prepared download with full Range
        support (HTTP 206), authorised by the download token `dt` from `DownloadManifest.fileUrl` only. The
        token names the profile it was issued to; every request checks that the download exists and that
        this profile still belongs to the account and sees the title, so the fetch continues in the
        background after a profile switch, but a child profile never gets a token for a title above its
        rating. Missing or forged token, or a token of an unknown download → 401; title not visible to the
        token's profile → 404; prepared copy removed or not prepared → 410 `download_evicted`. A strong
        `ETag` names the preparation, so `If-Range` never mixes two preparations of the same download.
        `Cache-Control: private, no-store`.
      tags: [offline]
      x-visibility: scoped
      security:
        - downloadToken: []
      parameters:
        - $ref: "#/components/parameters/DownloadID"
        - $ref: "#/components/parameters/DownloadToken"
        - name: Range
          in: header
          required: false
          schema:
            type: string
            examples: ["bytes=0-8388607"]
      responses:
        "200":
          description: Whole file.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "206":
          description: Requested byte range.
          headers:
            Content-Range:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/DownloadUnauthenticated"
        "404":
          $ref: "#/components/responses/DownloadNotFound"
        "410":
          $ref: "#/components/responses/DownloadEvicted"
        "416":
          description: Range not satisfiable.

  /downloads/{id}/subtitles/{track}.vtt:
    get:
      operationId: getDownloadSubtitle
      summary: WebVTT subtitle of a prepared download (binary)
      description: |
        Implemented as an `http.Handler`, authorised by `dt` like `getDownloadFile`. One of the text
        subtitle tracks listed in `DownloadManifest.subtitles`, converted to WebVTT during preparation.
        Any other track → 404. `Cache-Control: private, no-store`.
      tags: [offline]
      x-visibility: scoped
      security:
        - downloadToken: []
      parameters:
        - $ref: "#/components/parameters/DownloadID"
        - name: track
          in: path
          required: true
          description: Track id (`Track.id`).
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: "#/components/parameters/DownloadToken"
      responses:
        "200":
          description: WebVTT file.
          content:
            text/vtt:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/DownloadUnauthenticated"
        "404":
          $ref: "#/components/responses/DownloadNotFound"
        "410":
          $ref: "#/components/responses/DownloadEvicted"

  /offline/sync:
    post:
      operationId: syncOffline
      summary: Synchronise the downloads of this device (O-6, O-7, K-7)
      description: |
        The device reports the downloads it holds and whether each file is complete. The server records
        complete fetches (its prepared copy is removed 24 h later, AN-20), applies the auto-download rules of
        the account's profiles on this device (O-3), prepares evicted copies again that the device still
        lacks, recomputes `allowedProfileIds` for every download of the device (plan 3.3) and answers with:
        the state of every download of this device and account (`item` only where the active profile is
        allowed), `revoked`, the reported ids the device must delete (deleted by a profile, by the
        administration, through a revoked guest account or a forgotten device; AN-4), the offline profile
        data of the profiles that may play a download on this device (PIN salt, offline PIN verifier, watch
        time of today with the moment it resets; AN-18, AN-19) and the auto-download rule of the active
        profile. The client never decides visibility itself: it shows a download only to the profiles in its
        `allowedProfileIds` (plan principle 1).
      tags: [offline]
      x-visibility: scoped
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfflineSyncRequest"
      responses:
        "200":
          description: State of the device's downloads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflineSync"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: CSRF header missing (`csrf_header_missing`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The session has no device (`device_required`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /offline/rules:
    get:
      operationId: getDownloadRules
      summary: Auto-download rule of the active profile on this device (O-3)
      tags: [offline]
      x-visibility: scoped
      responses:
        "200":
          description: The stored rule, or the default rule (disabled).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadRules"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: The session has no device (`device_required`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      operationId: setDownloadRules
      summary: Set the auto-download rule of the active profile on this device (O-3, AN-13)
      description: |
        With `enabled` the server downloads the next episode of every series the profile started (watched in
        the last 60 days) at the next sync, until `maxCount` auto-downloads the profile has not finished are
        on the device. `wifiOnly` is checked by the client before it fetches (`navigator.connection`; iOS
        cannot tell and hides the option, AN-13). `newPodcastEpisodes` is stored for podcasts (M6).
      tags: [offline]
      x-visibility: scoped
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadRules"
      responses:
        "200":
          description: Stored rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadRules"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: CSRF header missing (`csrf_header_missing`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The session has no device (`device_required`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /offline/revocations:
    post:
      operationId: checkOfflineRevocations
      summary: Revocation list of a device without a valid session (K-7, AN-4)
      description: |
        After the administration revoked a guest, the guest's sessions are gone and `syncOffline` answers
        401. The device then reports the download ids it holds here, identified only by its device cookie
        `slouchcat_device`, and gets back the ids it must delete (downloads removed by a profile, the
        administration, a revoked account or a forgotten device). The answer contains nothing but ids the
        device named; without the cookie the list is empty.
      tags: [offline]
      x-visibility: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevocationCheck"
      responses:
        "200":
          description: Ids to delete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevocationList"
        "403":
          description: CSRF header missing (`csrf_header_missing`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /offline/events:
    post:
      operationId: uploadOfflineEvents
      summary: Upload the raw progress events of offline playback (O-5, AN-10, AN-18)
      description: |
        The events the device buffered while it played downloads, for any profile of the account. The
        server corrects the device clock by the difference between `sentAt` and its own time, stores each
        event with the corrected time (watch time is booked to the right day; an overrun appears in the
        watch-time report, AN-18) and merges the position: per profile and title the event with the latest
        corrected time wins over the stored progress; "completed" stays until a newer event below 90 % comes
        (AN-10). An event of a profile outside the account or of a title the profile may not see is
        `rejected`, and so is an event whose `downloadId` names a download it cannot come from (another
        account, device or title, a profile not in its `allowedProfileIds`, or a corrected time before the
        download was created). A corrected time older than 30 days counts as 30 days ago. The same playback
        id and sequence number again is a `duplicate`. Results come in the order of the events.
      tags: [offline]
      x-visibility: account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfflineEventBatch"
      responses:
        "200":
          description: Result per event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflineEventResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: CSRF header missing (`csrf_header_missing`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/libraries:
    get:
      operationId: listLibraries
      summary: All libraries with their scan state
      tags: [admin]
      x-visibility: admin
      responses:
        "200":
          description: Libraries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Library"
        "401":
          description: No valid session (`unauthenticated`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Not the main account (`forbidden`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: createLibrary
      summary: Create a library and start its first scan
      tags: [admin]
      x-visibility: admin
      requestBody:
        required: true
        content:
          application/json:
