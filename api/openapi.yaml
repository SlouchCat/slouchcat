            type: integer
            format: int64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: One page of issues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuePage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "422":
          description: Validation failed (`validation_failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/maintenance/duplicates:
    get:
      operationId: listDuplicates
      summary: Titles and files that exist twice (B-9)
      description: |
        Groups of films or series of one library with the same provider id, with the same title and year
        (without provider id), and media files with the same content hash (also across titles).
      tags: [admin]
      x-visibility: admin
      parameters:
        - name: libraryId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Duplicate groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DuplicateGroup"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"

  /admin/maintenance/merge:
    post:
      operationId: mergeItems
      summary: Merge duplicate titles into one (B-9)
      description: |
        Moves the media files, children, extras, trailers and credits of the source titles to the target,
        merges the progress per profile (the larger position wins) and deletes the sources. Sources must be
        of the same kind and library as the target.
      tags: [admin]
      x-visibility: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeRequest"
      responses:
        "200":
          description: The merged title.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminItem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown title (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/maintenance/cleanup:
    post:
      operationId: cleanupItems
      summary: Remove orphaned titles and unplayable files (B-9)
      description: |
        Titles in the list are soft-deleted when they have no file or only missing files (others are skipped).
        Media files in the list are removed from the library and recorded as ignored, so the next scan does
        not add them again; a title left without a file is soft-deleted too.
      tags: [admin]
      x-visibility: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CleanupRequest"
      responses:
        "200":
          description: What was removed.
          content:
            application/json:
              schema:
                type: object
                required: [items, files]
                properties:
                  items:
                    type: integer
                  files:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "422":
          description: Validation failed (`validation_failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/devices:
    get:
      operationId: listDevices
      summary: Devices with owner, last contact and capability profile (W-7)
      description: |
        Every browser (device cookie) that signed in, newest contact first: the name and type the client
        reported, the account and profile of its last playback start (owner), the last contact of any
        session of the device (±1 min, the session middleware touches it at most once a minute), the
        capability profile the client reported with its last playback start (containers, video and audio
        codecs, maximum resolution, HDR) and the number of its running streams.
      tags: [admin]
      x-visibility: admin
      responses:
        "200":
          description: Devices, last contact first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminDevice"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"

  /admin/devices/{id}:
    delete:
      operationId: deleteDevice
      summary: Forget a device
      description: |
        Revokes the sessions of the device, ends its running streams, deletes its PIN counters and its row.
        The browser keeps its device cookie: its next sign-in recreates the device under the same id (without
        name, capabilities and owner until its next playback start). The reserved device of the per-profile
        PIN ceiling is not listed and answers 404.
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/DeviceID"
      responses:
        "204":
          description: Forgotten.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown device (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/streams:
    get:
      operationId: listStreams
      summary: Running playback sessions (W-6)
      description: |
        Every playback session that is neither revoked nor expired and had a request (token or progress
        event) within the last two minutes, newest first: profile, device, title (a plain title, not an
        `ItemRef`: the admin view is unfiltered), quality (output size and bit rate), mode (direct, remux or
        transcode), hardware or software encoder, backend, reason, start, last activity and the last
        reported position.
      tags: [admin]
      x-visibility: admin
      responses:
        "200":
          description: Running streams.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminStream"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"

  /admin/streams/{id}:
    delete:
      operationId: stopStream
      summary: End a running stream (W-6)
      description: |
        Revokes the playback session (`stopped_by` admin), closes an open Range response, stops the ffmpeg
        process of its HLS output and removes its files. The client's next stream request answers 401, so it
        stops within seconds and shows that the administrator ended the stream.
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/PlaybackSessionID"
      responses:
        "204":
          description: Ended.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown or already ended playback session (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  # ---------------------------------------------------------------------------------------------
  # Discover and curation (M7, E-1 to E-9, I-7): search, genres, collections, watchlist, favourites
  # and the in-app inbox of the active profile.
  # ---------------------------------------------------------------------------------------------
  /search:
    post:
      operationId: search
      summary: Search titles, people and collections (E-4)
      description: |
        Full-text search from the second character over titles (all languages, original title, author,
        narrator, series name), people and collections, with the filters genre, year, age rating, media type
        and availability; or, without a query, a browse by those filters (titles only, by title). Titles are paged (`offset`/`limit`); people and collections are the first ten
        matches. Every title passed the visibility layer of the active profile; a person appears only when a
        title of hers is visible, a collection only with a visible member (10.2). A POST because the filters
        form an object and the walk of the contract test covers POST operations too.
      tags: [discover]
      x-visibility: scoped
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Matches for the active profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          description: |
            Validation failed (`validation_failed`; `query` `too_short` (one character), `too_long`, or
            `required` when neither a query nor a filter is given; `maxRating` `invalid_value` outside
            0/6/12/16/18; `yearFrom`/`yearTo` `invalid_value` outside 1870..2100; `genre` `too_long` over 80
            characters).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /genres:
    get:
      operationId: listGenres
      summary: Genres of the visible titles with their counts
      description: |
        The genres (in the profile language) of the titles the active profile may see, most frequent first,
        at most 20; the search page offers them as filter values and the start page row `genres` shows them.
      tags: [discover]
      x-visibility: scoped
      responses:
        "200":
          description: Genres with the number of visible titles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GenreRef"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /collections/{id}:
    get:
      operationId: getCollection
      summary: A collection with its visible members (E-6)
      description: |
        A TMDB collection or a manual collection of the admin; the members the active profile may see, in
        collection order (paged). A collection without a visible member answers 404 (10.2).
      tags: [discover]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/CollectionID"
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: The collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Unknown or without a visible member (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /watchlist:
    get:
      operationId: listWatchlist
      summary: The watchlist of the active profile (E-5)
      description: Newest entry first; entries whose title became invisible are omitted.
      tags: [discover]
      x-visibility: scoped
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One page of the watchlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /items/{id}/watchlist:
    put:
      operationId: addToWatchlist
      summary: Put a title on the watchlist of the active profile (E-5)
      description: Idempotent. Every kind except seasons and extras; an invisible title answers 404.
      tags: [discover]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/ItemID"
      responses:
        "204":
          description: On the watchlist.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Unknown or not visible for the active profile (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Seasons and extras cannot be listed (`not_listable`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: removeFromWatchlist
      summary: Remove a title from the watchlist of the active profile
      description: Idempotent; an invisible or unknown title answers 404.
      tags: [discover]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/ItemID"
      responses:
        "204":
          description: Not on the watchlist (any more).
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Unknown or not visible for the active profile (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /favorites:
    get:
      operationId: listFavorites
      summary: The favourite series and podcasts of the active profile (E-8)
      description: Newest first; favourites whose title became invisible are omitted.
      tags: [discover]
      x-visibility: scoped
      responses:
        "200":
          description: The favourites.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemRef"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /items/{id}/favorite:
    put:
      operationId: addFavorite
      summary: Mark a series or podcast as favourite of the active profile (E-8)
      description: |
        Idempotent. A new episode of a favourite creates an in-app notification for the profile when the
        profile may see the episode (5.5); favourite podcasts also feed the auto-download rule (O-3).
      tags: [discover]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/ItemID"
      responses:
        "204":
          description: Marked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Unknown or not visible for the active profile (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Only series and podcasts can be favourites (`not_favoritable`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: removeFavorite
      summary: Remove the favourite mark
      description: Idempotent; an invisible or unknown title answers 404.
      tags: [discover]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/ItemID"
      responses:
        "204":
          description: Not a favourite (any more).
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Unknown or not visible for the active profile (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /notifications:
    get:
      operationId: listNotifications
      summary: The in-app inbox of the active profile (E-8)
      description: |
        Newest first, read and unread, with the unread count. A notification whose episode is no longer
        visible to the profile is omitted (5.5). Channels (e-mail, push, Telegram) follow in M8.
      tags: [discover]
      x-visibility: scoped
      parameters:
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One page of the inbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /notifications/{id}/read:
    put:
      operationId: markNotificationRead
      summary: Mark one notification as read
      description: Idempotent; a notification of another profile answers 404.
      tags: [discover]
      x-visibility: scoped
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Read.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Unknown or not of the active profile (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark every notification of the active profile as read
      tags: [discover]
      x-visibility: scoped
      responses:
        "204":
          description: All read.
        "401":
          $ref: "#/components/responses/Unauthenticated"

  # ---------------------------------------------------------------------------------------------
  # Curation by the main user (M7, E-2, E-6, E-9, E-7; M11 spotlight): Cat's picks, collections, row
  # order, Trakt state and the spotlight list.
  # Administration views name titles by id and title; they are never ItemRefs.
  # ---------------------------------------------------------------------------------------------
  /admin/picks:
    get:
      operationId: listTopPicks
      summary: Cat's recommendations in display order (E-2)
      description: Every pick, global ones and those of single profiles, in the order of the carousel.
      tags: [admin]
      x-visibility: admin
      responses:
        "200":
          description: The picks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPick"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
    post:
      operationId: createTopPicks
      summary: Add a title to Cat's recommendations, for all profiles or for single ones (E-2)
      description: |
        Without `profileIds` one global pick; with them one pick per profile of the main account. New picks
        go to the end of the carousel. A profile sees a pick only when it may see the title (E-3), and only
        inside the optional time window.
      tags: [admin]
      x-visibility: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickRequest"
      responses:
        "201":
          description: The created picks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPick"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "422":
          description: |
            Validation failed (`validation_failed`; `itemId` `unknown_item` or `invalid_value` for seasons and
            extras, `profileIds` `invalid_value` for profiles outside the main account, `note` `too_long`,
            `endsAt` `invalid_value` when not after `startsAt`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/picks/order:
    put:
      operationId: reorderTopPicks
      summary: Set the order of Cat's recommendations (E-2, E-9)
      description: Every existing pick id exactly once, in the new order.
      tags: [admin]
      x-visibility: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickOrder"
      responses:
        "204":
          description: Reordered.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "422":
          description: Validation failed (`validation_failed`; `ids` `invalid_value` unless every pick appears once).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/picks/{id}:
    patch:
      operationId: updateTopPick
      summary: Change the note or the time window of a pick
      description: A field set to `null` clears it; an absent field keeps its value.
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/PickID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PickUpdate"
      responses:
        "200":
          description: The updated pick.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPick"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown pick (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`; `note` `too_long`, `endsAt` `invalid_value`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteTopPick
      summary: Remove a pick
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/PickID"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown pick (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/items/search:
    get:
      operationId: searchAdminItems
      summary: Find titles by name for curation (admin, unfiltered)
      description: |
        The same search index as `search`, without any profile filter, for the pick and collection
        dialogs. Returns ids and names only, never an `ItemRef` or an image.
      tags: [admin]
      x-visibility: admin
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Matching titles, best match first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminItemHit"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "422":
          description: Validation failed (`validation_failed`; `q` `too_short` or `too_long`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/collections:
    get:
      operationId: listCollections
      summary: All collections, automatic (TMDB) and manual (E-6)
      description: An administration view without members; `getAdminCollection` lists them.
      tags: [admin]
      x-visibility: admin
      responses:
        "200":
          description: Collections by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
    post:
      operationId: createCollection
      summary: Create a manual collection (E-6)
      tags: [admin]
      x-visibility: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionRequest"
      responses:
        "201":
          description: The new, empty collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "422":
          description: Validation failed (`validation_failed`; `name` `required` or `too_long`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/collections/{id}:
    get:
      operationId: getAdminCollection
      summary: A collection with all its members (admin, unfiltered)
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/CollectionID"
      responses:
        "200":
          description: The collection with members in order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown collection (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      operationId: updateCollection
      summary: Rename a manual collection
      description: TMDB collections keep their names from the provider (`not_editable`).
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/CollectionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionRequest"
      responses:
        "200":
          description: The renamed collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown collection (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`) or a TMDB collection (`not_editable`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteCollection
      summary: Delete a manual collection
      description: Members stay as titles; TMDB collections cannot be deleted (`not_editable`).
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/CollectionID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown collection (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: A TMDB collection (`not_editable`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/collections/{id}/items:
    put:
      operationId: setCollectionItems
      summary: Replace the members of a manual collection, in this order
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/CollectionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionItemsRequest"
      responses:
        "200":
          description: The collection with its new members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown collection (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            Validation failed (`validation_failed`; `itemIds` `unknown_item` or `invalid_value` for seasons,
            episodes and extras) or a TMDB collection (`not_editable`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/home-rows:
    get:
      operationId: getHomeRows
      summary: The order of the start page rows (E-9)
      tags: [admin]
      x-visibility: admin
      responses:
        "200":
          description: All eight rows in display order, with the hidden flag.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HomeRowSetting"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
    put:
      operationId: setHomeRows
      summary: Set the order and visibility of the start page rows (E-9)
      description: Every row key exactly once; the array order is the display order.
      tags: [admin]
      x-visibility: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 8
              maxItems: 8
              items:
                $ref: "#/components/schemas/HomeRowSetting"
      responses:
        "200":
          description: The stored order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HomeRowSetting"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "422":
          description: Validation failed (`validation_failed`; `rows` `invalid_value` unless every key appears once).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/trakt:
    get:
      operationId: getTraktStatus
      summary: State of the Trakt fetch behind the spotlight row (E-7, I-7)
      description: |
        Whether a Trakt client id is configured (`SLOUCHCAT_TRAKT_CLIENT_ID`), when the spotlight list
        was last fetched, which list it is (`listKey`) and how many entries it holds before the library
        intersection. Trakt is reached with the server key only; there is no Trakt account per profile
        and nothing is sent to Trakt (I-7).
      tags: [admin]
      x-visibility: admin
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraktStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"

  /admin/spotlight:
    get:
      operationId: getSpotlightConfig
      summary: The spotlight configuration and the catalogue of list kinds (M11, ADR 0011)
      description: |
        Which public Trakt list the spotlight row shows (`listKey`, for `url` the address of a
        public user list), which media it holds, how many visible library hits the row shows at
        most (`itemCount`, 5 to 20), below how many hits it is omitted (`minHits`, 0 to 10) and how
        often the list is fetched (`intervalHours`, 6 to 48; entries count as stale after twice that).
        `listKinds` is the fixed catalogue of the seven list kinds with the media each allows,
        whether the media is a post-filter (the user list) and whether the kind needs an address;
        the administration reads the catalogue from here instead of keeping its own table.
      tags: [admin]
      x-visibility: admin
      responses:
        "200":
          description: The configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotlightConfig"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
    put:
      operationId: setSpotlightConfig
      summary: Set the spotlight configuration
      description: |
        Replaces the writable values. `422 validation_failed` names the field: `itemCount` outside
        5..20, `minHits` outside 0..10, `intervalHours` outside 6..48, a `media` the list kind does
        not offer (`boxoffice` takes `movie` only), a `listUrl` that is not a public user list of
        trakt.tv, or a watchlist address (`listUrl: invalid_value`; importing watchlists is a
        non-goal). Changing the list keeps the fetched entries of the old list until the next run;
        the overrides belong to their list and do not move.
      tags: [admin]
      x-visibility: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpotlightConfigUpdate"
      responses:
        "200":
          description: The stored configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotlightConfig"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "422":
          description: A value is outside its range or the address is not a public user list (`validation_failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/spotlight/entries:
    get:
      operationId: getSpotlightEntries
      summary: The fetched spotlight list with its library hits and overrides
      description: |
        The entries of the last successful fetch of the configured list in fetch order (at most 100
        per medium), each with its library hit if the title is in the library — entries without a
        hit are listed as well, so the administration shows what Trakt delivered, while the start
        page never shows them — and with the override of the main user (hidden, pinned rank, note).
        `orphans` are overrides of the configured list whose title is no longer in the fetched
        entries; they stay deletable. Administration views name titles by id and title; they are
        never ItemRefs.
      tags: [admin]
      x-visibility: admin
      responses:
        "200":
          description: The entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotlightEntries"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"

  /admin/spotlight/entries/{media}/{tmdbId}:
    patch:
      operationId: setSpotlightEntryOverride
      summary: Hide, pin or annotate one entry of the spotlight list
      description: |
        Writes the override of the entry (`media`, `tmdbId`) of the configured list: `hidden`,
        `pinnedRank` (1-based place in the row; `null` unpins) and `note` (`null` removes it). An
        empty body removes the override. The override hangs on the title and the list, never on a
        position, so it survives a fetch that reorders the list. `409 rank_taken` when another
        entry of the list already holds the rank; `404` when neither an entry nor an override of
        that title exists.
      tags: [admin]
      x-visibility: admin
      parameters:
        - name: media
          in: path
          required: true
          schema:
            type: string
            enum: [movie, show]
        - name: tmdbId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpotlightEntryOverride"
      responses:
        "200":
          description: The entry with its override, or the orphaned override.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotlightEntry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Neither an entry nor an override of that title exists in the configured list (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Another entry of the list holds this rank (`rank_taken`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`; `note` `too_long`, `pinnedRank` `invalid_value`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/spotlight/refresh:
    post:
      operationId: refreshSpotlight
      summary: Fetch the spotlight list now
      description: |
        Queues the fetch job out of schedule; the result shows up in `getTraktStatus` and
        `getSpotlightEntries`. At most once a minute: the time of the last manual refresh is stored
        in the database, so the limit survives a restart.
      tags: [admin]
      x-visibility: admin
      responses:
        "202":
          description: Queued.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "422":
          description: No Trakt client id configured (`provider_not_configured`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: A manual refresh ran less than a minute ago (`too_many_requests`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  # ---------------------------------------------------------------------------------------------
  # Administration and notifications (M8, A-1 to A-9, E-8): system state, dashboard, jobs,
  # settings and integrations, backup, update check, accounts, statistics, announcements and the
  # notification channels of every account. Administration views name titles by id and title;
  # they are never ItemRefs.
  # ---------------------------------------------------------------------------------------------
  /admin/system:
    get:
      operationId: getSystemInfo
      summary: Version, transcode hardware, inotify limit and file systems (A-1, A-3)
      description: |
        The state the wizard shows before the first account (`getSetupStatus.system`) and the dashboard
        shows afterwards: version and start, the detected transcode backend with the Docker Compose
        override file that passes the GPU into the container, the inotify watch limit with its use and the
        file systems of the config and cache directories.
      tags: [admin]
      x-visibility: admin
      responses:
        "200":
          description: The system state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"

  /admin/dashboard:
    get:
      operationId: getDashboard
      summary: Running streams, jobs, storage, integrations, errors and update state (A-3)
      description: |
        One request for the admin overview, polled every few seconds: the running streams (as
        `listStreams`), the job counters with the last ten failed jobs, free and total space of the
        config and cache directories, the state of every integration (keys, e-mail, Web Push, Telegram,
        update check), the newest 50 errors of the server log (redacted, newest first) and the update
        state.
      tags: [admin]
      x-visibility: admin
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"

  /admin/jobs/{id}/retry:
    post:
      operationId: retryJob
      summary: Queue a failed job again (A-3)
      description: The job goes back to the queue with its attempts reset; only failed jobs qualify.
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: The queued job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown job (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The job has not failed (`job_not_failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/jobs/{id}:
    delete:
      operationId: cancelJob
      summary: Cancel a queued or running job, or dismiss a failed one (A-3)
      description: The job ends `cancelled`; a failed job leaves the list of failed jobs.
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "204":
          description: Cancelled.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown job, or a job that is done or cancelled already (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/settings:
    get:
      operationId: getAdminSettings
      summary: Server settings and integrations (A-2)
      description: |
        Public URL, update check, the provider keys (where each comes from; a stored key shows its last
        four characters only), the e-mail server, the Telegram bot and the Web Push key pair. Secrets
        never leave the server: passwords, tokens and private keys are write-only.
      tags: [admin]
      x-visibility: admin
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
    put:
      operationId: updateAdminSettings
      summary: Change server settings and integrations (A-2)
      description: |
        Fields left out keep their value; `clear` removes stored values. Secrets are stored encrypted
        (plan 3.8 point 3). A value set through the environment cannot be overridden or cleared here
        (`env_wins`, the field in `errors`). A new TMDB key is checked against TMDB, a new Telegram bot
        token with `getMe`, before anything is stored; the whole request then changes nothing.
      tags: [admin]
      x-visibility: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsUpdate"
      responses:
        "200":
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "422":
          description: |
            `validation_failed` (see `errors`), `env_wins` (the field named in `errors` comes from the
            environment), `tmdb_key_invalid`, `tmdb_unreachable`, `telegram_token_invalid` (Telegram
            rejected the token), `telegram_unreachable` (Telegram did not answer).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/settings/email/test:
    post:
      operationId: sendTestEmail
      summary: Send a test mail through the configured e-mail server (A-2, A-6)
      description: |
        Sends to `to`, or to the main account's address when absent. Counts against the client's
        attempt limit (as a login).
      tags: [admin]
      x-visibility: admin
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailTestRequest"
      responses:
        "204":
          description: The mail server accepted the mail.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "422":
          description: No e-mail server configured (`email_not_configured`) or `validation_failed` (`to` `invalid_email`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many attempts from this client (`too_many_attempts`); `Retry-After` names the pause in seconds.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: The mail server refused or did not answer (`email_send_failed`; `detail` names why, without secrets).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/settings/push/rotate:
    post:
      operationId: rotatePushKeys
      summary: Create a new Web Push key pair (A-6)
      description: |
        Creates a new VAPID key pair (the private key stored encrypted) and deletes every push
        subscription, which was bound to the old pair; devices subscribe again from the settings.
      tags: [admin]
      x-visibility: admin
      responses:
        "200":
          description: The settings with the new public key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"

  /admin/backups:
    get:
      operationId: listBackups
      summary: Backups in the backup directory (A-4)
      description: |
        Manual backups (`slouchcat-backup-*`) and the automatic copies the server writes before
        migrations and restores (`pre-migration-*`, `pre-restore-*`), newest first.
      tags: [admin]
      x-visibility: admin
      responses:
        "200":
          description: The backups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Backup"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
    post:
      operationId: createBackup
      summary: Create a backup of the database (A-4)
      description: |
        Writes a tar.gz archive with a manifest and a consistent copy of the database (never a media
        file) to the backup directory. Without `includeSecrets` the copy carries no encrypted setting,
        push subscription, Telegram link code or session. With `includeSecrets` the archive also holds
        the key file and is encrypted with `passphrase` (age, scrypt). Private podcast feed URLs stay
        in every archive with the credentials they carry (a token in the path or query), so a restore
        keeps the subscriptions; the manifest says so (`includesFeedCredentials: true`).
      tags: [admin]
      x-visibility: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupRequest"
      responses:
        "201":
          description: The new backup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "422":
          description: |
            `passphrase_required` (secrets without a passphrase), `passphrase_too_short` (fewer than 12
            characters).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/backups/{name}/download:
    get:
      operationId: downloadBackup
      summary: Download a backup archive (binary)
      description: |
        Implemented as an `http.Handler`. The name must be one of `listBackups`; a name with a path part
        answers 404.
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/BackupName"
      responses:
        "200":
          description: The archive.
          headers:
            Content-Disposition:
              description: '`attachment` with the file name.'
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown backup (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/backups/{name}:
    delete:
      operationId: deleteBackup
      summary: Delete a backup
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/BackupName"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown backup (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/backups/restore:
    post:
      operationId: restoreBackupUpload
      summary: Restore an uploaded backup (A-4)
      description: |
        Checks the uploaded archive (format, a version not newer than the server, a database that passes
        the integrity check; with secrets the passphrase) and stages it next to the database. After the
        202 the server stops and starts again in the same process; the start keeps the current database
        as `pre-restore-*` in the backup directory, swaps in the restored one and migrates it.
      tags: [admin]
      x-visibility: admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RestoreUpload"
            encoding:
              file:
                contentType: application/octet-stream
      responses:
        "202":
          description: Staged; the server restarts now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "422":
          description: |
            `backup_invalid` (not an archive of Slouchcat, damaged or failing the integrity check),
            `passphrase_required`, `passphrase_wrong`, `backup_newer_than_server`, `validation_failed`
            (`file` missing or not a multipart part, `passphrase` too long).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/backups/{name}/restore:
    post:
      operationId: restoreBackup
      summary: Restore a backup from the list (A-4)
      description: Like `restoreBackupUpload` with an archive of `listBackups`.
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/BackupName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
      responses:
        "202":
          description: Staged; the server restarts now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown backup (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            `backup_invalid`, `passphrase_required`, `passphrase_wrong`, `backup_newer_than_server` (see
            `restoreBackupUpload`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/update:
    get:
      operationId: getUpdateState
      summary: State of the update check (A-5)
      description: |
        The running version, the newest published version from the release manifest and when it was
        checked. The check runs daily while it is enabled; it only reads the manifest and never installs.
      tags: [admin]
      x-visibility: admin
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateState"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"

  /admin/update/check:
    post:
      operationId: checkForUpdate
      summary: Check for a new version now (A-5)
      description: Reads the release manifest at once; a failure is reported in `error`, not as a problem.
      tags: [admin]
      x-visibility: admin
      responses:
        "200":
          description: The state after the check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateState"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "422":
          description: The update check is disabled (`update_check_disabled`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/accounts:
    get:
      operationId: listAccounts
      summary: Every account with its role, limits, profiles and channels (A-2)
      tags: [admin]
      x-visibility: admin
      responses:
        "200":
          description: The owner first, then the other administrators, then the accounts by creation, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAccount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"

  /admin/accounts/{id}:
    patch:
      operationId: updateAccountAccess
      summary: Change the rating ceiling, the library rights or the playback caps of an account
      description: |
        Takes effect with the account's next request; profiles above the new ceiling are capped by the
        visibility layer.

        Only an account with `role: user` has access limits. An administrator is fixed at `maxRating` 18
        and all libraries (ADR 0014, decision 12 f), because the administration views read system-wide and
        without a profile check; this answers `409 admin_limits_fixed` for one. Take the role away first if
        the account should be limited again.
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/AccountID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAccessUpdate"
      responses:
        "204":
          description: Updated; read the account list again for the new values.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown account (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The account is an administrator and has no access limits (`admin_limits_fixed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`; `libraryIds` `unknown_library`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteAccount
      summary: Delete an account with its profiles and progress (K-7)
      description: |
        Ends every running stream of the account, revokes all its sessions and stream tokens and deletes the
        account with its profiles and progress. From the next request on, cookies and stream tokens of the
        account answer 401.

        The owner cannot be deleted (`owner_protected`), and the last administrator cannot either
        (`last_admin`): there is no path to a server without an administration (ADR 0014).
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/AccountID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown account (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The owner (`owner_protected`) or the last administrator (`last_admin`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/accounts/{id}/role:
    put:
      operationId: setAccountRole
      summary: Appoint an account as administrator, or take the role away
      description: |
        Only the owner may call this (ADR 0014); an administrator that is not the owner gets 403
        `owner_required`.

        Appointing lifts the account to `maxRating` 18 and all libraries, because the
        administration views read system-wide and without a profile check - a lower ceiling there
        would be a false promise, not a protection. Taking the role away does **not** put the old
        limits back; the administration sets them again on the account if it wants to. The
        account's profiles keep their own levels either way, and `admin` still needs the active
        primary profile.

        Taking the role away revokes every session of the account, so no browser keeps an
        administration page that the next request would refuse. Appointing revokes nothing: the
        middleware decides per request and nobody loses anything.
      tags: [admin]
      x-visibility: owner
      parameters:
        - $ref: "#/components/parameters/AccountID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountRoleUpdate"
      responses:
        "204":
          description: The role is set.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OwnerOnly"
        "404":
          description: Unknown account (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: |
            The owner cannot be demoted (`owner_protected`), or the change would leave the server
            without an administrator (`last_admin`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/stats:
    get:
      operationId: getStats
      summary: Usage statistics over a period (A-8)
      description: |
        Over the last `days` days, unfiltered (the administration sees every profile): the most watched
        titles, the watch time per profile, the share of direct play, remux and transcoding with the
        hardware share, and the devices by type. Watch time is the played time of the progress events
        whose server time lies in the period (offline events count with their upload time).
      tags: [admin]
      x-visibility: admin
      parameters:
        - name: days
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/StatsDays"
      responses:
        "200":
          description: The statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "422":
          description: Validation failed (`validation_failed`; `days` not 7, 30, 90 or 365).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/announcements:
    get:
      operationId: listAnnouncements
      summary: Announcements of the main user (A-7)
      tags: [admin]
      x-visibility: admin
      responses:
        "200":
          description: Every announcement, newest first, with how many profiles acknowledged it.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
    post:
      operationId: createAnnouncement
      summary: Write an announcement, optionally publishing it (A-7)
      description: |
        Publishing shows it to every profile at its next start and sends it on the channels of every
        account that chose the event `announcements`.
      tags: [admin]
      x-visibility: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementRequest"
      responses:
        "201":
          description: The announcement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "422":
          description: Validation failed (`validation_failed`; `title` 1 to 120, `body` 1 to 4000 characters).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/announcements/{id}:
    put:
      operationId: updateAnnouncement
      summary: Change an unpublished announcement
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/AnnouncementID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementUpdate"
      responses:
        "200":
          description: The changed announcement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown announcement (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Already published; published announcements stay as they were sent (`announcement_published`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteAnnouncement
      summary: Delete an announcement with its acknowledgements
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/AnnouncementID"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown announcement (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/announcements/{id}/publish:
    post:
      operationId: publishAnnouncement
      summary: Publish an announcement (A-7)
      description: Idempotent; the first call sends it on the channels, a second one changes nothing.
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/AnnouncementID"
      responses:
        "200":
          description: The published announcement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown announcement (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /announcements:
    get:
      operationId: listMyAnnouncements
      summary: Published announcements the active profile has not acknowledged (A-7)
      description: Newest first, at most 20; the client shows them one after the other at the start.
      tags: [announcements]
      x-visibility: scoped
      responses:
        "200":
          description: The open announcements.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: "#/components/schemas/ProfileAnnouncement"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /announcements/{id}/ack:
    post:
      operationId: ackAnnouncement
      summary: Acknowledge an announcement for the active profile
      description: Idempotent.
      tags: [announcements]
      x-visibility: scoped
      parameters:
        - $ref: "#/components/parameters/AnnouncementID"
      responses:
        "204":
          description: Acknowledged.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Unknown or unpublished announcement (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me/channels:
    get:
      operationId: getMyChannels
      summary: Notification channels of the signed-in account (A-6, E-8, plan 5.5)
      description: |
        E-mail, Web Push and Telegram with the chosen events. The in-app inbox is always on and no
        channel here. `available` tells whether the server has the channel configured. Works without an
        active profile (`account`). Every profile may read the channels; only a session without an
        active profile or with the account's primary profile may change them (ADR 0005).
      tags: [notify]
      x-visibility: account
      responses:
        "200":
          description: The three channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /me/channels/{channel}:
    put:
      operationId: updateMyChannel
      summary: Switch a channel and choose its events
      description: |
        The event `errors` is for the main account only. An e-mail address equal to the account's
        e-mail is stored as "the account's e-mail", so the channel follows a later change of it.
        Only a session without an active profile or with the account's primary profile may change
        the channels (`primary_profile_required` otherwise, ADR 0005); every profile may read them.
      tags: [notify]
      x-visibility: account
      parameters:
        - $ref: "#/components/parameters/ChannelName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelSettingUpdate"
      responses:
        "200":
          description: The stored channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelSetting"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PrimaryProfileRequired"
        "404":
          description: Unknown channel (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            `channel_unavailable` (the server has the channel not configured; switching it off is always
            allowed), `event_not_allowed` (`errors` on a guest account), `validation_failed`
            (`email.address` `invalid_email`, an unknown event).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me/channels/{channel}/test:
    post:
      operationId: testMyChannel
      summary: Send a test message on a channel
      description: |
        Counts against the client's attempt limit (as a login). Only a session without an active
        profile or with the account's primary profile may change or test the channels
        (`primary_profile_required` otherwise, ADR 0005); every profile may read them.
      tags: [notify]
      x-visibility: account
      parameters:
        - $ref: "#/components/parameters/ChannelName"
      responses:
        "204":
          description: Sent; for push, every subscription of the account was handed to its push service.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PrimaryProfileRequired"
        "404":
          description: Unknown channel (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            `channel_unavailable` (not configured on the server), `channel_disabled` (switched off, not
            linked or without subscription).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many attempts from this client (`too_many_attempts`); `Retry-After` names the pause in seconds.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: |
            The channel's service refused or did not answer (`send_failed`). The `detail` is generic; the
            server log names the cause (it may name the mail server).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me/channels/telegram/link:
    post:
      operationId: createTelegramLink
      summary: Start linking a Telegram chat
      description: |
        Returns a new link code (six characters, valid for 15 minutes; an older code of the account
        stops working). The user sends `/start <code>` to the bot; the server links the chat when the
        bot receives it. Replaces an existing link only once the new one is confirmed.
        Only a session without an active profile or with the account's primary profile may change
        the channels (`primary_profile_required` otherwise, ADR 0005); every profile may read them.
      tags: [notify]
      x-visibility: account
      responses:
        "200":
          description: The Telegram channel with the code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelSetting"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PrimaryProfileRequired"
        "422":
          description: No Telegram bot configured (`channel_unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteTelegramLink
      summary: Unlink the Telegram chat
      description: |
        Idempotent; also drops an open link code. The channel is switched off.
        Only a session without an active profile or with the account's primary profile may change
        the channels (`primary_profile_required` otherwise, ADR 0005); every profile may read them.
      tags: [notify]
      x-visibility: account
      responses:
        "204":
          description: Unlinked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PrimaryProfileRequired"

  /push/vapid-key:
    get:
      operationId: getPushPublicKey
      summary: The server's Web Push public key (VAPID)
      description: The browser subscribes with it (`applicationServerKey`).
      tags: [notify]
      x-visibility: account
      responses:
        "200":
          description: The public key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapidKey"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: Web Push is not set up on the server (`push_unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me/push-subscriptions:
    post:
      operationId: createPushSubscription
      summary: Register the push subscription of this browser
      description: |
        Idempotent per endpoint: the same endpoint again updates its keys and device name. The endpoint
        and its keys are capability secrets; they are never returned and never logged.
        Only a session without an active profile or with the account's primary profile may change
        the channels (`primary_profile_required` otherwise, ADR 0005); every profile may read them.
      tags: [notify]
      x-visibility: account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionRequest"
      responses:
        "201":
          description: The subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionSummary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PrimaryProfileRequired"
        "404":
          description: Web Push is not set up on the server (`push_unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`; `endpoint` not an https URL, keys not base64url).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /me/push-subscriptions/{id}:
    delete:
      operationId: deletePushSubscription
      summary: Remove a push subscription of the account
      description: |
        Only a session without an active profile or with the account's primary profile may change
        the channels (`primary_profile_required` otherwise, ADR 0005); every profile may read them.
      tags: [notify]
      x-visibility: account
      parameters:
        - $ref: "#/components/parameters/PushSubscriptionID"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/PrimaryProfileRequired"
        "404":
          description: Unknown or of another account (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/integrations:
    get:
      operationId: listIntegrations
      summary: Webhook integrations of Radarr and Sonarr (I-8)
      tags: [admin]
      x-visibility: admin
      responses:
        "200":
          description: Every integration, oldest first; the address is never part of it.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Integration"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
    post:
      operationId: createIntegration
      summary: Create a webhook integration and reveal its address once (I-8)
      description: |
        The answer is the only moment the full address exists: it carries `url` and `token`, which are
        stored as a SHA-256 and can never be shown again (plan 3.8 point 2). Later reads show the last
        four characters only; `renewIntegrationToken` reveals a new address.
      tags: [admin]
      x-visibility: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationRequest"
      responses:
        "201":
          description: The integration with its address, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationCreated"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "422":
          description: Validation failed (`validation_failed`; `name` 1 to 80 characters and unused, `kind` radarr or sonarr).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/integrations/{id}:
    delete:
      operationId: deleteIntegration
      summary: Delete a webhook integration and its event log (I-8)
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/IntegrationID"
      responses:
        "204":
          description: Deleted; the address stops working immediately.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown integration (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/integrations/{id}/token:
    post:
      operationId: renewIntegrationToken
      summary: Renew the token of an integration and reveal the new address once (I-8)
      description: |
        The old address stops working at once; the new one appears in this answer and never again.
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/IntegrationID"
      responses:
        "200":
          description: The integration with its new address, shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationCreated"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown integration (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/integrations/{id}/path-map:
    put:
      operationId: setIntegrationPathMap
      summary: Replace the path mapping of an integration (I-8)
      description: |
        Prefix pairs that translate the path Radarr or Sonarr reports into the path this server sees
        (`/movies` → `/media/Filme`); the longest matching source wins. The list may be empty, which is
        the default and fits a service that sees the same paths as Slouchcat.
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/IntegrationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PathMapRequest"
      responses:
        "200":
          description: The integration with its new mapping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown integration (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Validation failed (`validation_failed`; both paths absolute, every source only once).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /admin/integrations/{id}/events:
    get:
      operationId: listIntegrationEvents
      summary: Event log of an integration (I-8)
      description: The newest 20 reports of this integration, newest first; older ones are dropped.
      tags: [admin]
      x-visibility: admin
      parameters:
        - $ref: "#/components/parameters/IntegrationID"
      responses:
        "200":
          description: The log entries, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntegrationEvent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          description: Unknown integration (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /webhooks/{token}:
    post:
      operationId: receiveWebhook
      summary: Receive a webhook of Radarr or Sonarr (I-8)
      description: |
        Radarr and Sonarr report a changed file here, so the title appears without waiting for the next
        full comparison (AN-12). The administration creates an integration, Slouchcat shows the full
        address once, and the administration pastes it into "Connect → Webhook". The token in the path is
        the whole authorisation: the request carries no session, only the SHA-256 of the token is stored,
        and the token is redacted in every log line (plan 3.8 points 2, 4 and 8). An unknown token answers
        401 and leaves no trace that could be attributed to an integration.

        `Download` (import and upgrade), `Rename`, `MovieFileDelete`, `EpisodeFileDelete`, `MovieDelete`
        and `SeriesDelete` take the directory from `movie.folderPath` (Radarr) or `series.path` (Sonarr),
        translate it with the integration's path mapping (longest matching prefix) and queue one
        `scan.path` job for it — the same job the file watcher queues, with the same coalescing (3.4).
        `Test` is acknowledged and logged, so the test button of Radarr and Sonarr turns green. Every
        other event (`Grab`, `Health`, `ApplicationUpdate` …) is accepted with 200 and ignored, so a
        generous selection in Radarr breaks nothing. A mapped path under no library root answers 422 and
        records both paths in the event log. Each integration may send 10 requests per second.

        This endpoint does not need the CSRF header: Radarr and Sonarr are not browsers, and the
        authorisation is the secret in the path, never a cookie.
      tags: [integrations]
      x-visibility: public
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The token of the integration; it is never logged.
          schema:
            type: string
            minLength: 43
            maxLength: 43
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
      responses:
        "200":
          description: The webhook was accepted; `result` says what came of it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResult"
        "401":
          description: No integration holds this token (`invalid_webhook_token`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: |
            The reported path lies under no library root after the mapping (`path_outside_roots`), or an
            acting event carried no path (`validation_failed`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: More than 10 requests per second for this integration (`too_many_requests`); `Retry-After` names the pause in seconds.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  responses:
    Unauthenticated:
      description: No valid session (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AdminOnly:
      description: Not an administrator with its primary profile active (`forbidden`), or CSRF header missing.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    OwnerOnly:
      description: |
        Not the owner with its primary profile active (`owner_required`), or CSRF header missing.
        An administrator that is not the owner gets this too: only the owner appoints (ADR 0014).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PrimaryProfileRequired:
      description: The session's active profile is not the account's primary profile (`primary_profile_required`), or CSRF header missing.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StreamUnauthenticated:
      description: Stream token missing, forged, revoked or expired (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StreamNotFound:
      description: |
        Unknown playback session, no HLS output, or the title is no longer visible (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StreamUnavailable:
      description: |
        `transcode_busy`: the HLS output was lost (server restart) and restarting it found no transcode
        budget within 10 s. `segment_restarted`: a newer seek restarted the encoder while this request
        waited (`Retry-After: 1`). `Retry-After` names the pause in seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    DownloadUnauthenticated:
      description: Download token missing, forged or naming an unknown download (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    DownloadNotFound:
      description: |
        A track the download does not carry, a token of another download than the path names, or the title
        is no longer visible to the profile of the token (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    DownloadEvicted:
      description: |
        The server's prepared copy was removed or is not prepared (`download_evicted`); the next sync
        prepares a removed copy again.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: slouchcat_session
      description: Browser session (HttpOnly, SameSite=Lax; Secure over HTTPS).
    bearerToken:
      type: http
      scheme: bearer
      description: Bearer token for third-party clients. Added in M2.
    streamToken:
      type: apiKey
      in: query
      name: st
      description: |
        Stream token of a playback session (plan 5.4), returned in `PlaybackInfo.streamUrl`:
        `<playback session id>.<base64url HMAC-SHA256 over id and item>`. No expiry inside the token;
        the playback session expires 12 h after its last request and is revoked on stop and logout.
    downloadToken:
      type: apiKey
      in: query
      name: dt
      description: |
        Download token from `DownloadManifest.fileUrl`: `<download id>.<profile id>.<base64url HMAC-SHA256
        over download, item and profile>`. No expiry; every request checks the download and that the
        profile still sees the title. Redacted in all logs.
  parameters:
    ProfileID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    AccountID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    InvitationID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    InvitationToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
        description: 256-bit token, base64url without padding.
    ItemID:
      name: id
      in: path
      required: true
      description: Item ID (ULID).
      schema:
        $ref: "#/components/schemas/ItemID"
    CollectionID:
      name: id
      in: path
      required: true
      description: Collection ID (ULID).
      schema:
        $ref: "#/components/schemas/CollectionID"
    PickID:
      name: id
      in: path
      required: true
      description: Pick ID from `listTopPicks`.
      schema:
        type: integer
        format: int64
    PlaybackSessionID:
      name: id
      in: path
      required: true
      description: Playback session ID (ULID) from `PlaybackInfo.playbackSessionId`.
      schema:
        type: string
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    DeviceID:
      name: id
      in: path
      required: true
      description: Device id (32 characters, the device cookie value).
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{32}$"
    StreamToken:
      name: st
      in: query
      required: true
      description: Stream token from `PlaybackInfo.streamUrl` (plan 5.4). Redacted in all logs.
      schema:
        type: string
        maxLength: 128
    DownloadID:
      name: id
      in: path
      required: true
      description: Download ID (ULID).
      schema:
        $ref: "#/components/schemas/DownloadID"
    DownloadToken:
      name: dt
      in: query
      required: true
      description: Download token from `DownloadManifest.fileUrl`. Redacted in all logs.
      schema:
        type: string
        maxLength: 160
    LibraryID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    LibraryRootID:
      name: rootId
      in: path
      required: true
      description: The id of the folder inside the library (`Library.roots[].id`).
      schema:
        type: integer
        format: int64
        minimum: 1
    JobID:
      name: id
      in: path
      required: true
      description: Job id from the dashboard.
      schema:
        type: integer
        format: int64
    BackupName:
      name: name
      in: path
      required: true
      description: File name of a backup from `listBackups` (no path part).
      schema:
        type: string
        maxLength: 200
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
    AnnouncementID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IntegrationID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ChannelName:
      name: channel
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Channel"
    PushSubscriptionID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Health:
      type: object
      required: [status, version, uptimeSeconds]
      properties:
        status:
          type: string
          enum: [ok]
          description: Always `ok` on a 200 response.
        version:
          type: string
          description: Server version as built, for example `0.1.0+abc1234`.
          examples: ["0.1.0+abc1234"]
        uptimeSeconds:
          type: integer
          format: int64
          minimum: 0
          description: Seconds since the process started.

    Problem:
      type: object
      description: RFC 9457 problem details with a stable `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI reference identifying the problem type; `about:blank` for generic HTTP errors.
          examples: ["about:blank"]
        title:
          type: string
          description: Short human-readable summary, English, stable per `code`.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code of this response.
        detail:
          type: string
          description: Human-readable explanation for this occurrence. Never contains secrets.
        instance:
          type: string
          format: uri-reference
          description: Request path that produced the problem.
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: Stable machine-readable identifier, for example `not_found`, `validation_failed`, `not_ready`.
          examples: ["not_found"]
        errors:
          type: array
          description: Field errors for `validation_failed`.
          items:
            $ref: "#/components/schemas/FieldError"
        retryAfterSeconds:
          type: integer
          minimum: 0
          description: Remaining lock in seconds for `pin_locked` (same value as `Retry-After`).
        extensions:
          type: object
          description: |
            Whole-number details of a limit problem: `limitMinutes` and `usedMinutes` for `watch_limit_reached`,
            `maxStreams` and `activeStreams` for `stream_limit_reached`. Absent for other problems.
          additionalProperties:
            type: integer
          examples: [{"maxStreams": 1, "activeStreams": 1}]

    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: JSON pointer-like field name, for example `email` or `library.path`.
        code:
          type: string
          description: Stable identifier the client translates, for example `required`, `too_short`, `invalid_email`.

    SetupStatus:
      type: object
      required: [setupRequired]
      properties:
        setupRequired:
          type: boolean
          description: True until the wizard created the main account.
        system:
          $ref: "#/components/schemas/SystemInfo"
          description: |
            Transcode hardware, inotify limit and file systems for the wizard (A-1); only while
            `setupRequired` is true.

    SetupRequest:
      type: object
      required: [email, password, library]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 256
          writeOnly: true
        library:
          $ref: "#/components/schemas/LibraryRequest"
        tmdbApiKey:
          type: string
          writeOnly: true
          description: TMDB v4 read access token; optional. Stored encrypted, never returned.
        language:
          $ref: "#/components/schemas/Language"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          maxLength: 256
          writeOnly: true

    SessionInfo:
      type: object
      required: [account]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        profile:
          $ref: "#/components/schemas/Profile"
          description: The active profile; absent until `selectProfile` ran (the client shows the picker).
        updateAvailable:
          $ref: "#/components/schemas/UpdateNotice"
          description: |
            A newer version is published (A-5); only for administrators and only while the update
            check is on.

    Account:
      type: object
      required: [id, email, role, isOwner, maxRating, allLibraries, libraryIds]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user]
          description: |
            `admin` runs the server and its libraries, `user` manages only its own profiles
            (ADR 0014). The removed values `owner` and `guest` are never reused.
        isOwner:
          type: boolean
          description: |
            The one account that cannot be deleted or demoted and that appoints further
            administrators. Always an `admin`.
        maxRating:
          $ref: "#/components/schemas/Rating"
          description: Rating ceiling of every profile of the account (18 for an administrator).
        allLibraries:
          type: boolean
          description: True for an administrator; other accounts see only `libraryIds`.
        libraryIds:
          type: array
          items:
            type: integer
            format: int64
          description: Libraries the account may see; empty when `allLibraries` is true.

    Profile:
      type: object
      description: A viewing profile with its settings. Profiles carry no e-mail and no password (K-1); only `name` is required.
      required: [id, name, maxRating, language, allLibraries, libraryIds, hasPin, hasOfflinePin, isPrimary, limits, effectiveLimits]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 60
        image:
          type: string
          format: uri-reference
          description: Optional profile image.
        maxRating:
          $ref: "#/components/schemas/Rating"
        language:
          $ref: "#/components/schemas/Language"
        accent:
          $ref: "#/components/schemas/Accent"
        allLibraries:
          type: boolean
        libraryIds:
          type: array
          items:
            type: integer
            format: int64
          description: Libraries the profile may see; empty when `allLibraries` is true. The account's own limits apply on top.
        hasPin:
          type: boolean
        hasOfflinePin:
          type: boolean
          description: A separate offline PIN is set (AN-19, `setOfflinePin`).
        isPrimary:
          type: boolean
          description: The account's primary profile; it manages the account's profiles and cannot be deleted.
        limits:
          $ref: "#/components/schemas/PlaybackLimits"
          description: |
            The limits of W-8 and K-5. In a request the object replaces all limits at once: a field left out
            clears that limit (no limit); an omitted `limits` keeps the stored limits.
        effectiveLimits:
          $ref: "#/components/schemas/EffectiveLimits"

    ProfileSummary:
      type: object
      description: A profile as the picker shows it; carries no settings beyond the look and whether a PIN is set.
      required: [id, name, hasPin, isPrimary]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        image:
          type: string
          format: uri-reference
        accent:
          $ref: "#/components/schemas/Accent"
        hasPin:
          type: boolean
        isPrimary:
          type: boolean
          description: The account's primary profile; it manages the account's profiles and cannot be deleted.

    Accent:
      type: string
      enum: [ember, coral, amber, lime, teal, sky, violet, rose]
      description: Accent colour token of the design system (`packages/design-tokens`); the UI maps it to CSS variables.

    SelectProfileRequest:
      type: object
      properties:
        pin:
          type: string
          pattern: "^[0-9]{4,8}$"
          writeOnly: true
          description: Required when the profile has a PIN.

    ProfileRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        maxRating:
          $ref: "#/components/schemas/Rating"
          description: Default 18, capped by the account's limit for guests.
        language:
          $ref: "#/components/schemas/Language"
          description: Default is the language of the primary profile.
        accent:
          $ref: "#/components/schemas/Accent"
        allLibraries:
          type: boolean
          description: Default true. With false, `libraryIds` lists the libraries the profile may see.
        libraryIds:
          type: array
          items:
            type: integer
            format: int64
          uniqueItems: true
        pin:
          type: string
          pattern: "^[0-9]{4,8}$"
          writeOnly: true
          description: Optional PIN to set right away.
        limits:
          $ref: "#/components/schemas/PlaybackLimits"
          description: |
            The limits of W-8 and K-5. In a request the object replaces all limits at once: a field left out
            clears that limit (no limit); an omitted `limits` keeps the stored limits.

    ProfileUpdate:
      type: object
      description: Partial update; every field is optional and only sent fields change.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        maxRating:
          $ref: "#/components/schemas/Rating"
        language:
          $ref: "#/components/schemas/Language"
        accent:
          $ref: "#/components/schemas/Accent"
        allLibraries:
          type: boolean
        libraryIds:
          type: array
          items:
            type: integer
            format: int64
          uniqueItems: true
        limits:
          $ref: "#/components/schemas/PlaybackLimits"
          description: |
            The limits of W-8 and K-5. In a request the object replaces all limits at once: a field left out
            clears that limit (no limit); an omitted `limits` keeps the stored limits.

    BitrateKbps:
      type: integer
      minimum: 200
      maximum: 200000
      description: Bandwidth limit in kbit/s (W-8). A source above the limit is transcoded to a rung that fits.
    OutputHeight:
      type: integer
      enum: [360, 480, 720, 1080, 2160]
      description: Maximum output height (W-8). A source above it is transcoded to that rung.
    StreamCount:
      type: integer
      minimum: 1
      maximum: 16
      description: Concurrent streams a profile may run (W-8).
    WatchMinutes:
      type: integer
      minimum: 1
      maximum: 1440
      description: Daily watch-time limit in minutes (K-5). The day follows the server's local time zone.

    PlaybackLimits:
      type: object
      description: Playback limits (W-8, K-5); an absent field means no limit.
      properties:
        maxBitrateKbps:
          $ref: "#/components/schemas/BitrateKbps"
        maxHeight:
          $ref: "#/components/schemas/OutputHeight"
        maxStreams:
          $ref: "#/components/schemas/StreamCount"
        watchLimitMinutes:
          $ref: "#/components/schemas/WatchMinutes"

    EffectiveLimits:
      type: object
      description: "The limits that apply to the profile: its own capped by the account's (guests)."
      properties:
        maxBitrateKbps:
          type: integer
        maxHeight:
          type: integer
        maxStreams:
          type: integer
        watchLimitMinutes:
          type: integer

    WatchTime:
      type: object
      description: Watch time of the active profile today against its limit (K-5).
      required: [limitMinutes, usedMinutes, remainingMinutes]
      properties:
        limitMinutes:
          type: integer
          minimum: 1
        usedMinutes:
          type: integer
          minimum: 0
        remainingMinutes:
          type: integer
          minimum: 0

    WatchReport:
      type: object
      description: Minutes watched per day for one profile (K-5), oldest day first, today last.
      required: [profileId, days]
      properties:
        profileId:
          type: integer
          format: int64
        limitMinutes:
          type: integer
          description: The profile's limit, when set.
        days:
          type: array
          items:
            type: object
            required: [date, minutes]
            properties:
              date:
                type: string
                format: date
                description: Calendar day in the server's local time zone.
              minutes:
                type: integer
                minimum: 0

    PinRequest:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          pattern: "^[0-9]{4,8}$"
          writeOnly: true

    InvitationRequest:
      type: object
      required: [maxRating, allLibraries]
      properties:
        note:
          type: string
          maxLength: 120
          description: Who the link is for; shown to the guest and in the admin list.
        maxRating:
          $ref: "#/components/schemas/Rating"
          description: Rating ceiling of the guest account and all its profiles.
        allLibraries:
          type: boolean
        libraryIds:
          type: array
          items:
            type: integer
            format: int64
          uniqueItems: true
          description: Libraries the guest may see when `allLibraries` is false.

    InvitationState:
      type: string
      enum: [open, used, expired, revoked]

    Invitation:
      type: object
      required: [id, state, maxRating, allLibraries, libraryIds, createdAt, expiresAt]
      properties:
        id:
          type: integer
          format: int64
        note:
          type: string
        state:
          $ref: "#/components/schemas/InvitationState"
        maxRating:
          $ref: "#/components/schemas/Rating"
        allLibraries:
          type: boolean
        libraryIds:
          type: array
          items:
            type: integer
            format: int64
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        usedAt:
          type: string
          format: date-time
        usedByEmail:
          type: string
          format: email
          description: E-mail of the guest account that accepted the link, while that account exists.

    InvitationCreated:
      allOf:
        - $ref: "#/components/schemas/Invitation"
        - type: object
          required: [url, token]
          properties:
            url:
              type: string
              format: uri-reference
              description: Path of the invitation page, relative to the web origin (`/invite/<token>`). Shown once.
            token:
              type: string
              description: The plain token; only a hash is stored.

    InvitationPreview:
      type: object
      required: [maxRating, allLibraries, libraries, expiresAt]
      properties:
        note:
          type: string
        maxRating:
          $ref: "#/components/schemas/Rating"
        allLibraries:
          type: boolean
        libraries:
          type: array
          description: Names of the libraries the guest will see (all libraries when `allLibraries` is true).
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: integer
                format: int64
              name:
                type: string
        expiresAt:
          type: string
          format: date-time

    AcceptInvitationRequest:
      type: object
      required: [email, password, profileName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 256
          writeOnly: true
        profileName:
          type: string
          minLength: 1
          maxLength: 60
          description: Name of the guest's primary profile.
        language:
          $ref: "#/components/schemas/Language"
          description: UI and metadata language of the primary profile; default de.

    AccountAccessUpdate:
      type: object
      properties:
        maxRating:
          $ref: "#/components/schemas/Rating"
        allLibraries:
          type: boolean
        libraryIds:
          type: array
          items:
            type: integer
            format: int64
          uniqueItems: true
        limits:
          $ref: "#/components/schemas/PlaybackLimits"
          description: |
            Bandwidth, maximum output height and concurrent streams of the account (W-8); they cap every
            profile of the account. `watchLimitMinutes` is a profile setting and ignored here. The object
            replaces all three at once: a field left out clears that limit.

    ItemRatingRequest:
      type: object
      required: [rating]
      properties:
        rating:
          oneOf:
            - $ref: "#/components/schemas/Rating"
            - type: "null"
          description: New own rating, or null to drop the manual override.

    AdminItemRating:
      type: object
      description: Administration view of a title's ratings; not an `ItemRef` (unfiltered, admin only).
      required: [id, kind, title]
      properties:
        id:
          $ref: "#/components/schemas/ItemID"
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
          description: Parsed title of the item.
        ownRating:
          $ref: "#/components/schemas/Rating"
        effectiveRating:
          $ref: "#/components/schemas/Rating"
        ratingSource:
          type: string
          description: '`manual` after an override, else the metadata source (`tmdb:DE`, `nfo`) or empty.'

    Language:
      type: string
      enum: [de, en]

    Rating:
      type: integer
      description: FSK age rating.
      enum: [0, 6, 12, 16, 18]

    ItemID:
      type: string
      description: ULID of an item.
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"

    ItemKind:
      type: string
      enum: [movie, series, season, episode, extra, audiobook, podcast, podcast_episode]

    ImageKind:
      type: string
      enum: [poster, backdrop]

    ImageRef:
      type: object
      required: [url, width, height]
      properties:
        url:
          type: string
          format: uri-reference
          description: Relative URL under the API base with the cache-busting `v` parameter and the profile id `p`, so a browser cache never serves one profile's image to another.
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1

    ItemImages:
      type: object
      properties:
        poster:
          $ref: "#/components/schemas/ImageRef"
        backdrop:
          $ref: "#/components/schemas/ImageRef"
        backdropSmall:
          $ref: "#/components/schemas/ImageRef"
          description: Backdrop in w780 for viewports up to about 900 px.
        posterSmall:
          $ref: "#/components/schemas/ImageRef"
          description: Poster in w200 (narrow cards, `srcset`); M1b image pipeline.
        posterLarge:
          $ref: "#/components/schemas/ImageRef"
          description: Poster in w800 (detail page on wide screens); M1b image pipeline.
        backdropLarge:
          $ref: "#/components/schemas/ImageRef"
          description: Backdrop in w1920 for viewports above about 1400 px; M1b image pipeline.

    Progress:
      type: object
      required: [positionMs, durationMs, percent, completed, updatedAt]
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
          minimum: 0
        percent:
          type: number
          minimum: 0
          maximum: 100
        completed:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        playbackRate:
          type: number
          minimum: 0.5
          maximum: 3.0
          description: Playback speed the profile last used for this title (H-3); absent until it was set.
        watchTime:
          $ref: "#/components/schemas/WatchTime"
          description: |
            Present in the answer of `reportProgress` when the active profile has a daily limit (K-5). With
            `remainingMinutes` 0 the server has revoked every playback session of the profile; the client
            stops and shows the hint.

    ItemRef:
      type: object
      description: |
        A title as it appears in lists. Every response that contains an ItemRef is `scoped`; the
        contract test enforces this.
      required: [id, kind, title, images]
      properties:
        id:
          $ref: "#/components/schemas/ItemID"
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
          description: Title in the profile language, fallback English, fallback parsed file name.
        year:
          type: integer
        runtimeMinutes:
          type: integer
          minimum: 0
        rating:
          $ref: "#/components/schemas/Rating"
          description: Effective FSK rating; omitted when unknown (then hidden from profiles under 18).
        images:
          $ref: "#/components/schemas/ItemImages"
        accent:
          type: string
          pattern: "^#[0-9a-f]{6}$"
          description: |
            Accent colour of the title, derived from its poster by the image pipeline (plan 3.1:
            `palettegen`, the most saturated colour at medium lightness). Lower-case hex, for the
            poster tint and the backdrop scrim; omitted while no poster is processed.
        progress:
          $ref: "#/components/schemas/Progress"
        parentId:
          $ref: "#/components/schemas/ItemID"
          description: Season of an episode, series of a season, parent title of an extra.
        seasonNumber:
          type: integer
          minimum: 0
          description: Seasons and episodes; 0 = specials.
        episodeNumber:
          type: integer
          minimum: 0
        episodeEnd:
          type: integer
          minimum: 0
          description: Last episode number of a file that holds several episodes (S01E01-E02).
        seriesTitle:
          type: string
          description: Title of the series in the profile language (seasons and episodes).
        extraKind:
          $ref: "#/components/schemas/ExtraKind"
        childCount:
          type: integer
          minimum: 0
          description: Visible seasons of a series, visible episodes of a season.
        author:
          type: string
          description: Author of an audiobook, author of a podcast and its episodes (M6).
        publishedAt:
          type: string
          format: date-time
          description: Publication time of a podcast episode (from the feed).
        durationMs:
          type: integer
          format: int64
          minimum: 0
          description: Duration of an audiobook (all parts) or a podcast episode in milliseconds.
        explicit:
          type: boolean
          description: "Podcast or episode flagged `itunes:explicit` in the feed (AN-2: counts as FSK 18)."
        note:
          type: string
          maxLength: 280
          description: |
            The personal note of the main user on this title (E-2): on a pick in the row `picks` and
            on a curated entry in the row `spotlight`.
        hasTrailer:
          type: boolean
          description: |
            Whether a trailer is stored for the title. Set only on the items of the rows `spotlight`
            and `picks` of `getHome`; everywhere else the field is absent, which means unknown, not
            "no trailer" (`ItemDetail.trailerCount` is the complete answer).

    ItemDetail:
      allOf:
        - $ref: "#/components/schemas/ItemRef"
        - type: object
          required: [mediaFiles, genres, inWatchlist, favorite, collections]
          properties:
            inWatchlist:
              type: boolean
              description: On the watchlist of the active profile (E-5).
            favorite:
              type: boolean
              description: A favourite of the active profile (E-8; series and podcasts only).
            collections:
              type: array
              description: The visible collections the title belongs to (E-6).
              items:
                $ref: "#/components/schemas/CollectionRef"
            originalTitle:
              type: string
            tagline:
              type: string
            overview:
              type: string
            releaseDate:
              type: string
              format: date
            genres:
              type: array
              items:
                type: string
            tmdbId:
              type: integer
              format: int64
            mediaFiles:
              type: array
              description: Versions of the title (B-5), the primary version first; `versionLabel` is always set.
              items:
                $ref: "#/components/schemas/MediaFileInfo"
            tvdbId:
              type: integer
              format: int64
            series:
              $ref: "#/components/schemas/ItemRef"
              description: The series of a season or an episode.
            season:
              $ref: "#/components/schemas/ItemRef"
              description: The season of an episode.
            seasons:
              type: array
              description: Visible seasons of a series by number, specials last.
              items:
                $ref: "#/components/schemas/ItemRef"
            episodes:
              type: array
              description: |
                Visible episodes of a season by number; for a podcast its newest visible episodes (at most
                50, newest first; `listPodcastEpisodes` pages through the rest).
              items:
                $ref: "#/components/schemas/ItemRef"
            episodeCount:
              type: integer
              minimum: 0
              description: Visible episodes of a podcast in total.
            podcast:
              $ref: "#/components/schemas/ItemRef"
              description: The podcast of an episode.
            narrator:
              type: string
              description: Narrator of an audiobook.
            seriesName:
              type: string
              description: Series an audiobook belongs to (for example "Per Anhalter durch die Galaxis").
            seriesIndex:
              type: number
              description: Volume inside `seriesName` (0.5 for a prequel is possible).
            chapters:
              type: array
              description: Book-wide chapters of an audiobook (from chapter marks or one per file), in order.
              items:
                $ref: "#/components/schemas/Chapter"
            extras:
              type: array
              description: Visible extras of a film, series or season (B-7).
              items:
                $ref: "#/components/schemas/ItemRef"
            nextEpisode:
              $ref: "#/components/schemas/ItemRef"
              description: The next visible episode of the same series after this episode.
            cast:
              type: array
              description: Cast and crew in provider order (B-3).
              items:
                $ref: "#/components/schemas/CastMember"
            trailerCount:
              type: integer
              minimum: 0
              description: Trailers known for the title (`getItemTrailers`).

    ExtraKind:
      type: string
      enum: [trailer, featurette, deleted_scene, behind_the_scenes, interview, scene, short, other]

    CastMember:
      type: object
      required: [personId, name, role]
      properties:
        personId:
          type: integer
          format: int64
        name:
          type: string
        role:
          type: string
          enum: [cast, director, writer, creator]
        character:
          type: string

    Person:
      type: object
      required: [id, name, credits]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        credits:
          type: array
          items:
            type: object
            required: [item, role]
            properties:
              item:
                $ref: "#/components/schemas/ItemRef"
              role:
                type: string
                enum: [cast, director, writer, creator]
              character:
                type: string

    Trailer:
      type: object
      required: [id, lang, youtubeId, embedUrl, source, official]
      properties:
        id:
          type: integer
          format: int64
        lang:
          type: string
          description: ISO 639-1 language of the trailer (`de`, `en`, …).
        youtubeId:
          type: string
        embedUrl:
          type: string
          format: uri
          description: '`https://www.youtube-nocookie.com/embed/<youtubeId>` for the IFrame player.'
        title:
          type: string
        source:
          type: string
          enum: [tmdb, youtube, ai, manual]
        official:
          type: boolean

    MediaFileInfo:
      type: object
      required: [id, container, sizeBytes, available]
      properties:
        id:
          type: string
        container:
          type: string
          description: Container by extension, for example `mp4`, `mkv`.
        mimeType:
          type: string
          description: MIME type with codecs parameter when known, for example `video/mp4; codecs="avc1.640028, mp4a.40.2"`.
        videoCodec:
          type: string
        audioCodec:
          type: string
        width:
          type: integer
        height:
          type: integer
        durationMs:
          type: integer
          format: int64
        sizeBytes:
          type: integer
          format: int64
        versionLabel:
          type: string
          description: Version label parsed from the file name, for example `1080p` (B-5 in M3).
        available:
          type: boolean
          description: False while the file is missing (24 h grace period).
        bitrate:
          type: integer
          format: int64
          description: Container bit rate in bit/s from the probe.
        hdr:
          type: string
          enum: [hdr10, hdr10plus, dolby_vision, hlg]
          description: HDR format of the main video stream; absent for SDR.
        tracks:
          $ref: "#/components/schemas/TrackList"
          description: Audio and subtitle tracks of the file (detail page and versions).

    HomeRowKey:
      type: string
      description: |
        The eight rows of the start page (E-9). Contract 1.1 replaced the two fixed Trakt rows of 1.0
        by `spotlight` and `released` (ADR 0011); removed values are never reused.
      enum: [spotlight, picks, continue, recent, released, watchlist, collections, genres]

    HomeRow:
      type: object
      required: [key, items]
      properties:
        key:
          $ref: "#/components/schemas/HomeRowKey"
        items:
          type: array
          description: The titles of the row; empty for `collections` and `genres`.
          items:
            $ref: "#/components/schemas/ItemRef"
        collections:
          type: array
          description: Only in the row `collections` (E-6).
          items:
            $ref: "#/components/schemas/CollectionRef"
        genres:
          type: array
          description: Only in the row `genres`; each links to the search filtered by that genre.
          items:
            $ref: "#/components/schemas/GenreRef"

    HomePage:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/HomeRow"
        heroRow:
          $ref: "#/components/schemas/HomeRowKey"
          description: |
            The row the client draws as the stage (a framed band with backdrop and a poster strip)
            instead of as a poster row, at its place in `rows`, not necessarily first. The server
            decides which row that is (ADR 0011); a client draws large whatever is named here and
            does not interpret the key itself. Absent when the start page has no stage: then every
            row is a poster row. A row named here is always present in `rows`.

    PlaybackRequest:
      type: object
      properties:
        mediaFileId:
          type: string
          description: Which file to play; defaults to the primary file.
        deviceId:
          type: string
          maxLength: 64
          description: |
            Stable client identifier of a third-party client without the device cookie (used for progress
            merging in M5). Browsers need not send it: the device cookie names the device.
        capabilities:
          $ref: "#/components/schemas/PlaybackCapabilities"
        audioTrack:
          type: integer
          minimum: 0
          description: Stream index of the audio track to play (`Track.index`); default the file's default track.
        subtitleTrack:
          oneOf:
            - $ref: "#/components/schemas/TrackID"
            - type: "null"
          description: Id of the subtitle track to show (`Track.id`); absent or null = no subtitles.
        subtitleDelivery:
          type: string
          enum: [auto, text, burn]
          default: auto
          description: |
            `text`: the client renders the track from `subtitleUrl` (text tracks only); `burn`: burned into
            the video (always a transcode); `auto`: text for text tracks, burned for bitmap tracks (PGS, DVD).
        quality:
          $ref: "#/components/schemas/Quality"
        positionMs:
          type: integer
          format: int64
          minimum: 0
          description: |
            Start position instead of the stored resume position (a track or quality switch restarts the
            playback where it was). Also the resume position in the answer.

    TrackID:
      type: integer
      format: int64
      minimum: 1
      description: Id of a track row (`Track.id`).

    Quality:
      type: string
      enum: [auto, 1080p, 720p, 480p, 360p]
      description: |
        Quality rung (W-8). `auto` = the highest rung the source, the device and the profile's limits allow;
        a rung below the source is always a transcode. Rungs: 1080p 8 Mbit/s, 720p 4, 480p 2, 360p 1
        (video) plus 160 kbit/s AAC.

    PlaybackCapabilities:
      type: object
      description: |
        The device's capability profile (W-7): what it plays, from `canPlayType` /
        `MediaSource.isTypeSupported`, its screen and HDR support. The server stores it with the device
        (admin device overview) and decides direct play, remux or transcode from it. Without it the server
        assumes H.264 and AAC in MP4 through MSE.
      required: [video, audio, hls]
      properties:
        containers:
          type: array
          maxItems: 16
          description: Containers the media element plays directly (`mp4`, `webm`, `mkv`); default MP4 only.
          items:
            type: string
            pattern: "^[a-z0-9]{1,16}$"
        video:
          type: array
          maxItems: 16
          description: Decodable video codecs, ffprobe names (`h264`, `hevc`, `av1`, `vp9`).
          items:
            type: string
            pattern: "^[a-z0-9]{1,16}$"
        audio:
          type: array
          maxItems: 16
          description: Decodable audio codecs, ffprobe names (`aac`, `ac3`, `eac3`, `mp3`, `opus`, `flac`, `dts`, `truehd`).
          items:
            type: string
            pattern: "^[a-z0-9]{1,16}$"
        hls:
          type: string
          enum: [native, mse, none]
          description: "`native`: the media element plays HLS itself (Safari); `mse`: through hls.js; `none`: no HLS."
        maxWidth:
          type: integer
          minimum: 1
          maximum: 16384
          description: Screen width in device pixels (CSS width × devicePixelRatio).
        maxHeight:
          type: integer
          minimum: 1
          maximum: 16384
          description: Screen height in device pixels; a device under 1080 gets at most the 720p rung (phone profile, plan 3.5).
        hdr:
          type: boolean
          description: The display and the browser show HDR (the media query dynamic-range high); only then an HDR stream passes through.
        name:
          type: string
          maxLength: 80
          description: Display name of the device, for example `Chrome 156 · Linux`.
        type:
          type: string
          enum: [desktop, phone, tablet, tv, other]

    Track:
      type: object
      description: One audio or subtitle track of a media file.
      required: [id, index, kind, codec, default, forced, source, text]
      properties:
        id:
          type: integer
          format: int64
          description: Stable id of the track row.
        index:
          type: integer
          description: Stream index inside the file; -1 for a sidecar file.
        kind:
          type: string
          enum: [audio, subtitle]
        codec:
          type: string
          description: ffprobe codec name (`aac`, `ac3`, `eac3`, `dts`, `truehd`, `subrip`, `ass`, `hdmv_pgs_subtitle`, `dvd_subtitle`, …).
        language:
          type: string
          description: ISO 639 code as stored in the file or the sidecar name (`de`, `en`, `ger`).
        title:
          type: string
        default:
          type: boolean
        forced:
          type: boolean
        source:
          type: string
          enum: [embedded, sidecar]
        text:
          type: boolean
          description: A text format (SubRip, ASS/SSA, WebVTT, MOV text) that can be delivered as WebVTT; false for bitmap subtitles, which are burned in. Always false for audio.
        channels:
          type: integer
          minimum: 1
          description: Audio channels.

    TrackList:
      type: object
      required: [mediaFileId, audio, subtitles]
      properties:
        mediaFileId:
          type: string
        audio:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        subtitles:
          type: array
          items:
            $ref: "#/components/schemas/Track"

    TrackSelection:
      type: object
      description: The tracks this playback delivers.
      properties:
        audioTrack:
          type: integer
          description: Stream index of the audio track in the output.
        subtitleTrack:
          type: integer
          format: int64
          description: Id of the subtitle track; absent when none.
        subtitleDelivery:
          type: string
          enum: [text, burn]

    QualityOption:
      type: object
      required: [quality, available, current]
      properties:
        quality:
          $ref: "#/components/schemas/Quality"
        width:
          type: integer
        height:
          type: integer
        bitrate:
          type: integer
          description: Peak video bit rate of the rung in bit/s (the source bit rate for `auto` without transcode).
        available:
          type: boolean
          description: False when the source, the device or the profile's limits rule the rung out.
        current:
          type: boolean

    Chapter:
      type: object
      required: [startMs, endMs]
      properties:
        startMs:
          type: integer
          format: int64
          minimum: 0
        endMs:
          type: integer
          format: int64
          minimum: 0
        title:
          type: string

    PlaybackPart:
      type: object
      required: [mediaFileId, startMs, durationMs]
      properties:
        mediaFileId:
          type: string
        startMs:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
          minimum: 0

    Segment:
      type: object
      description: A detected intro or outro (W-9).
      required: [startMs, endMs, source]
      properties:
        startMs:
          type: integer
          format: int64
          minimum: 0
        endMs:
          type: integer
          format: int64
          minimum: 0
        source:
          type: string
          enum: [fingerprint, chapter, manual]

    Segments:
      type: object
      properties:
        intro:
          $ref: "#/components/schemas/Segment"
        outro:
          $ref: "#/components/schemas/Segment"

    PlaybackInfo:
      type: object
      required: [mode, mediaKind, item, mediaFile, streamUrl, resumePositionMs, playbackSessionId, tracks, selection, qualities, chapters, segments]
      properties:
        mode:
          type: string
          enum: [direct, hls]
          description: "`direct`: the file as it is through the Range endpoint; `hls`: fMP4-HLS (remux or transcode)."
        mediaKind:
          type: string
          enum: [video, audio]
          description: |
            `audio` for audiobooks and podcast episodes (M6): the client shows the audio player with chapters
            and speed. A multi-part audiobook always plays as one HLS timeline over all parts; a podcast
            episode without a file streams through the server from its enclosure.
        parts:
          type: array
          description: Parts of a multi-part audiobook on the single playback timeline (information only).
          items:
            $ref: "#/components/schemas/PlaybackPart"
        item:
          $ref: "#/components/schemas/ItemRef"
        mediaFile:
          $ref: "#/components/schemas/MediaFileInfo"
        streamUrl:
          type: string
          format: uri-reference
          description: |
            Relative URL with the stream token `st`: the Range endpoint (`direct`) or the HLS master
            playlist (`hls`).
        playbackSessionId:
          type: string
          description: ID of the playback session, for `DELETE /playback/sessions/{id}` when playback ends.
        transcoding:
          $ref: "#/components/schemas/Transcoding"
        resumePositionMs:
          type: integer
          format: int64
          minimum: 0
          description: Position to resume from; 0 when the title was never started or was completed.
        tracks:
          $ref: "#/components/schemas/TrackList"
        selection:
          $ref: "#/components/schemas/TrackSelection"
        subtitleUrl:
          type: string
          format: uri-reference
          description: Relative WebVTT URL with the stream token when a text subtitle track is selected (`getPlaybackSubtitle`).
        qualities:
          type: array
          description: The quality rungs of this playback, highest first (W-8 manual choice).
          items:
            $ref: "#/components/schemas/QualityOption"
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/Chapter"
        segments:
          $ref: "#/components/schemas/Segments"
        nextEpisode:
          $ref: "#/components/schemas/ItemRef"
          description: The next visible episode of the same series (auto-next, W-9).
        watchTime:
          $ref: "#/components/schemas/WatchTime"
        device:
          type: object
          description: The device this playback was recorded for (W-7).
          required: [id]
          properties:
            id:
              type: string
            name:
              type: string

    Transcoding:
      type: object
      description: How an `hls` playback is produced; absent for direct play.
      required: [mode, reason, hardware]
      properties:
        mode:
          type: string
          enum: [remux, transcode]
          description: "`remux`: the video is copied into fMP4; `transcode`: encoded to H.264/AAC."
        backend:
          type: string
          description: Encoder backend of a transcode (`nvenc`, `qsv`, `vaapi`, `software`).
        hardware:
          type: boolean
          description: The video is encoded on a GPU (false for remux and software).
        quality:
          $ref: "#/components/schemas/Quality"
        width:
          type: integer
        height:
          type: integer
        bitrate:
          type: integer
          description: Peak video bit rate of the output in bit/s.
        tonemap:
          type: boolean
          description: HDR → SDR tonemapping is applied.
        reason:
          type: string
          description: |
            Why the file is not played directly (`container`, `video_codec`, `audio_codec`, `hdr`,
            `pixel_format` for H.264 High 10 and 4:2:2/4:4:4 sources, `keyframes_pending` for a remux
            candidate that is transcoded until its keyframe index exists, `dolby_vision` for profiles 5 and
            7, `bandwidth` and `max_height` for the profile's limits, `quality` for a manual rung below the
            source, `audio_track` for a non-default audio track in a container that cannot be played
            directly with it, `subtitle_burn` for burned-in subtitles, `budget_lowered` when the transcode
            budget forced the next lower rung).

    AdminPodcast:
      type: object
      description: A podcast subscription as the administration sees it (M6, H-2); not an `ItemRef`.
      required: [id, libraryId, title, feedUrl, episodeCount, explicit, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/ItemID"
        libraryId:
          type: integer
          format: int64
        title:
          type: string
        author:
          type: string
        feedUrl:
          type: string
          format: uri
        episodeCount:
          type: integer
          minimum: 0
          description: Stored episodes (all, unfiltered).
        explicit:
          type: boolean
          description: The channel is flagged `itunes:explicit`; the podcast counts as FSK 18 (AN-2).
        lastCheckedAt:
          type: string
          format: date-time
          description: Last successful or failed feed fetch.
        lastError:
          type: string
          description: Stable code and short text of the last failed fetch; absent after a success.
        createdAt:
          type: string
          format: date-time

    PodcastCreate:
      type: object
      required: [libraryId, feedUrl]
      properties:
        libraryId:
          type: integer
          format: int64
          description: A library of kind `podcasts`.
        feedUrl:
          type: string
          format: uri
          maxLength: 2048
          description: RSS feed (http or https, no credentials).

    PodcastEpisodes:
      type: object
      required: [episodes, total, offset, limit]
      properties:
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/ItemRef"
        total:
          type: integer
          minimum: 0
          description: Visible episodes in total.
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1

    AdminDevice:
      type: object
      description: A device as the administration sees it (W-7); not an `ItemRef`.
      required: [id, createdAt, lastSeenAt, activeStreams]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [desktop, phone, tablet, tv, other]
        userAgent:
          type: string
        ownerEmail:
          type: string
          description: Account of the last playback start on this device.
        ownerProfile:
          type: string
          description: Profile of the last playback start on this device.
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          description: Last request of any session of the device.
        capabilities:
          $ref: "#/components/schemas/PlaybackCapabilities"
        capabilitiesAt:
          type: string
          format: date-time
        activeStreams:
          type: integer
          minimum: 0

    AdminStream:
      type: object
      description: A running playback session as the administration sees it (W-6); not an `ItemRef`.
      required: [id, accountEmail, profileName, itemId, itemTitle, mediaFileId, mode, hardware, startedAt, lastActivityAt]
      properties:
        id:
          type: string
          description: Playback session id.
        accountEmail:
          type: string
        profileName:
          type: string
        device:
          type: object
          required: [id]
          properties:
            id:
              type: string
            name:
              type: string
        itemId:
          $ref: "#/components/schemas/ItemID"
        itemTitle:
          type: string
          description: Title of the item in the default language, with series, season and episode for an episode.
        mediaFileId:
          type: string
        mode:
          type: string
          enum: [direct, remux, transcode]
        backend:
          type: string
        hardware:
          type: boolean
        quality:
          $ref: "#/components/schemas/Quality"
        width:
          type: integer
        height:
          type: integer
        bitrate:
          type: integer
        reason:
          type: string
        startedAt:
          type: string
          format: date-time
        lastActivityAt:
          type: string
          format: date-time
        positionMs:
          type: integer
          format: int64
        durationMs:
          type: integer
          format: int64

    ProgressEvent:
      type: object
      required: [positionMs, durationMs, playedMs, seq, state, clientTime]
      properties:
        mediaFileId:
          type: string
        playbackSessionId:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          description: The playback session this event belongs to; the server records the position for the stream overview (W-6).
        positionMs:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
          minimum: 0
        playedMs:
          type: integer
          format: int64
          minimum: 0
          description: Milliseconds actually played since the previous event.
        seq:
          type: integer
          format: int64
          minimum: 0
          description: Running sequence number per playback on the client.
        state:
          type: string
          enum: [playing, paused, ended]
        clientTime:
          type: string
          format: date-time
          description: Device clock when the event was created.
        playbackRate:
          type: number
          minimum: 0.5
          maximum: 3.0
          description: Playback speed in use; stored per profile and title (H-3) when present.

    MetadataProvider:
      type: string
      enum: [tmdb, tvdb]

    ItemMatchRequest:
      type: object
      required: [provider, providerId]
      properties:
        provider:
          $ref: "#/components/schemas/MetadataProvider"
        providerId:
          type: string
          minLength: 1
          maxLength: 32
          description: Id at the provider (TMDB and TVDB ids are numeric).

    TrailerRequest:
      type: object
      required: [lang]
      properties:
        lang:
          type: string
          pattern: "^[a-z]{2,3}$"
        youtubeId:
          type: string
          minLength: 8
          maxLength: 16
        url:
          type: string
          maxLength: 512
          description: YouTube URL as an alternative to `youtubeId`.

    ItemsRatingRequest:
      type: object
      required: [itemIds, rating]
      properties:
        itemIds:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: "#/components/schemas/ItemID"
        rating:
          oneOf:
            - $ref: "#/components/schemas/Rating"
            - type: "null"

    MetadataCandidate:
      type: object
      required: [provider, providerId, title]
      properties:
        provider:
          $ref: "#/components/schemas/MetadataProvider"
        providerId:
          type: string
        title:
          type: string
        originalTitle:
          type: string
        year:
          type: integer
        overview:
          type: string
        posterUrl:
          type: string
          format: uri
          description: Small poster at the provider's image host (administration only).

    AdminMediaFile:
      type: object
      required: [id, path, sizeBytes, available]
      properties:
        id:
          type: string
        rootId:
          type: integer
          format: int64
        path:
          type: string
          description: Path relative to the library root (administration only).
        sizeBytes:
          type: integer
          format: int64
        available:
          type: boolean
        versionLabel:
          type: string
        probedAt:
          type: string
          format: date-time
        probeError:
          type: string
          description: Last ffprobe failure; set means unplayable (B-9).

    AdminItem:
      type: object
      description: Administration view of a title; not an `ItemRef` (unfiltered, admin only).
      required: [id, kind, title, libraryId, metadataState, lockedFields, trailerState, trailers, mediaFiles, children]
      properties:
        id:
          $ref: "#/components/schemas/ItemID"
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
          description: Parsed title of the item.
        year:
          type: integer
        libraryId:
          type: integer
          format: int64
        parentId:
          $ref: "#/components/schemas/ItemID"
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        episodeEnd:
          type: integer
        metadataState:
          type: string
          enum: [pending, matched, unmatched, failed, skipped]
        metadataError:
          type: string
        matchedAt:
          type: string
          format: date-time
        tmdbId:
          type: integer
          format: int64
        tvdbId:
          type: integer
          format: int64
        imdbId:
          type: string
        lockedFields:
          type: array
          items:
            type: string
        ownRating:
          $ref: "#/components/schemas/Rating"
        effectiveRating:
          $ref: "#/components/schemas/Rating"
        ratingSource:
          type: string
        trailerState:
          type: string
          enum: [pending, found, none, failed]
        trailers:
          type: array
          items:
            $ref: "#/components/schemas/Trailer"
        mediaFiles:
          type: array
          items:
            $ref: "#/components/schemas/AdminMediaFile"
        children:
          type: object
          required: [seasons, episodes, extras]
          properties:
            seasons:
              type: integer
            episodes:
              type: integer
            extras:
              type: integer

    IssueKind:
      type: string
      enum: [unmatched, no_images, unrated, orphaned, unplayable, rating_mismatch]

    Issue:
      type: object
      required: [kind, itemId, itemKind, title, libraryId]
      properties:
        kind:
          $ref: "#/components/schemas/IssueKind"
        itemId:
          $ref: "#/components/schemas/ItemID"
        itemKind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
        year:
          type: integer
        libraryId:
          type: integer
          format: int64
        path:
          type: string
          description: Path of the file concerned, relative to its library root.
        mediaFileId:
          type: string
        detail:
          type: string
          description: Stable code or message, for example the metadata error or the probe error.

    IssuePage:
      type: object
      required: [total, items]
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/Issue"

    DuplicateGroup:
      type: object
      required: [reason, items]
      properties:
        reason:
          type: string
          enum: [provider_id, title_year, file_hash]
        items:
          type: array
          minItems: 2
          items:
            type: object
            required: [itemId, kind, title, files]
            properties:
              itemId:
                $ref: "#/components/schemas/ItemID"
              kind:
                $ref: "#/components/schemas/ItemKind"
              title:
                type: string
              year:
                type: integer
              libraryId:
                type: integer
                format: int64
              files:
                type: array
                items:
                  $ref: "#/components/schemas/AdminMediaFile"

    MergeRequest:
      type: object
      required: [targetId, sourceIds]
      properties:
        targetId:
          $ref: "#/components/schemas/ItemID"
        sourceIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ItemID"

    CleanupRequest:
      type: object
      properties:
        itemIds:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/ItemID"
        mediaFileIds:
          type: array
          maxItems: 5000
          items:
            type: string

    LibraryKind:
      type: string
      enum: [movies, series, audiobooks, podcasts]
      description: |
        `audiobooks` scans M4B files and folders of audio files as books (H-1); `podcasts` holds feed
        subscriptions and has no directory (H-2). Both carry a default age rating (AN-2).

    LibrarySummary:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LibraryKind"
        defaultRating:
          $ref: "#/components/schemas/Rating"
          description: Default age rating of an audio library (AN-2); absent for video libraries.

    LibraryRequest:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          $ref: "#/components/schemas/LibraryKind"
        path:
          type: string
          description: |
            Absolute directory on the server (inside the container, for example `/media/Filme`). Required for
            every kind except `podcasts`, which has no directory (`path` `required` / `not_allowed`).
          minLength: 1
          maxLength: 4096
        defaultRating:
          $ref: "#/components/schemas/Rating"
          description: |
            Default age rating of every title in an audio library (AN-2, decision 9); only for `audiobooks`
            and `podcasts` (`not_allowed` otherwise), default 0. Single titles may be set stricter, never
            below it (`rating_below_library_default`).

    LibraryRootRequest:
      type: object
      required: [path]
      description: A further folder of a library (idea 02, E8).
      properties:
        path:
          type: string
          description: |
            Absolute directory on the server, below a browsable root (idea 02, E14), for example
            `/media/Filme-2`.
          minLength: 1
          maxLength: 4096

    LibraryRootRemoval:
      type: object
      required: [confirmPath]
      description: |
        The confirmation of a folder removal (idea 02, E12). It is typed by the administrator and
        compared against the stored row, so a mis-aimed click cannot delete the titles of a folder.
      properties:
        confirmPath:
          type: string
          description: The folder's path, repeated by the administrator.
          minLength: 1
          maxLength: 4096

    LibraryUpdate:
      type: object
      description: Changes to a library; every field is optional.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        defaultRating:
          $ref: "#/components/schemas/Rating"
          description: |
            New default age rating of an audio library; every title whose rating still comes from the
            library (`rating_source` `library`) follows at once, manual ratings stay. `not_allowed` for
            video libraries.

    ScanState:
      type: string
      enum: [never, queued, running, done, failed, aborted]
      description: |
        `aborted` means the loss protection stopped the scan (root missing or empty, or more than 20 % of
        the files vanished) or the administrator cancelled it (`lastError` `cancelled`); `lastError` carries
        the reason and `acceptLibraryLoss` lifts the block.

    Library:
      type: object
      required: [id, name, kind, roots, scan, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          $ref: "#/components/schemas/LibraryKind"
        defaultRating:
          $ref: "#/components/schemas/Rating"
          description: Default age rating of an audio library (AN-2); absent for video libraries.
        roots:
          type: array
          items:
            $ref: "#/components/schemas/LibraryRoot"
        scan:
          $ref: "#/components/schemas/LibraryScan"
        createdAt:
          type: string
          format: date-time

    LibraryRoot:
      type: object
      required: [id, path, fsType, watch, itemCount, fileCount]
      properties:
        id:
          type: integer
          format: int64
        path:
          type: string
        fsType:
          type: string
          description: Detected file system class (`ext4`, `xfs`, `btrfs`, `zfs`, `fuse`, `nfs`, `smb`, `unknown`).
        watch:
          type: string
          enum: [inotify, poll, inotify_poll]
          description: Change detection strategy chosen from `fsType` (plan 3.4).
        warning:
          type: string
          description: Stable code for a warning shown in the wizard, for example `network_share`.
        itemCount:
          type: integer
          description: |
            Titles with at least one file in this folder. It is the upper bound of what
            `removeLibraryRoot` takes out of the library: a title that also has a file in another
            folder of the library stays. The confirmation dialog names this number (idea 02, E12).
        fileCount:
          type: integer
          description: Media files registered in this folder; they all go with the folder.

    LibraryScan:
      type: object
      required: [state, itemCount, fileCount]
      properties:
        state:
          $ref: "#/components/schemas/ScanState"
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        filesSeen:
          type: integer
          description: Files processed in the running or last scan.
        filesTotal:
          type: integer
          description: Files found by the directory walk of the running or last scan.
        lastError:
          type: string
          description: Stable code (`root_missing`, `root_empty`, `loss_over_threshold`) or a message.
        lossAcceptedAt:
          type: string
          format: date-time
        itemCount:
          type: integer
          description: Titles that are not deleted.
        fileCount:
          type: integer
          description: Media files that are not missing.

    OfflinePinRequest:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          pattern: "^[0-9]{6,12}$"
          writeOnly: true

    DownloadQuality:
      type: string
      enum: [high, medium, low]
      description: "Download profile (H.264 and AAC in fragmented MP4): `high` ≤ 1080p at 6 Mbit/s, `medium` ≤ 720p at 3 Mbit/s, `low` ≤ 480p at 1.2 Mbit/s."

    DownloadID:
      type: string
      description: ULID of a download.
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"

    DownloadQualityOption:
      type: object
      required: [quality, width, height, videoBitrate, audioBitrate, estimatedBytes, copy]
      properties:
        quality:
          $ref: "#/components/schemas/DownloadQuality"
        width:
          type: integer
          minimum: 0
        height:
          type: integer
          minimum: 0
        videoBitrate:
          type: integer
          minimum: 0
          description: kbit/s.
        audioBitrate:
          type: integer
          minimum: 0
          description: kbit/s.
        estimatedBytes:
          type: integer
          format: int64
          minimum: 0
          description: Expected size of the file (O-1 promises ±10 %); for a season the sum over its episodes.
        copy:
          type: boolean
          description: The video is copied from the source (no re-encode); for a season true when every episode copies.

    DownloadOptions:
      type: object
      required: [qualities, audioTracks, subtitles]
      properties:
        mediaFileId:
          type: string
          description: Media file the options refer to (movies and episodes).
        durationMs:
          type: integer
          format: int64
          minimum: 0
        episodeCount:
          type: integer
          minimum: 0
          description: Visible episodes of a season.
        qualities:
          type: array
          items:
            $ref: "#/components/schemas/DownloadQualityOption"
        audioTracks:
          type: array
          items:
            $ref: "#/components/schemas/Track"
        subtitles:
          type: array
          description: Text subtitle tracks that travel along as WebVTT; bitmap subtitles are not available offline.
          items:
            $ref: "#/components/schemas/Track"
        existing:
          $ref: "#/components/schemas/DownloadState"

    DownloadRequest:
      type: object
      required: [quality]
      properties:
        quality:
          $ref: "#/components/schemas/DownloadQuality"
        audioTrack:
          type: integer
          minimum: 0
          description: Stream index of the audio track (`Track.index`), single titles only; default track otherwise.
        audioLanguage:
          type: string
          maxLength: 16
          description: Seasons; per episode the first audio track in this language, fallback the default track.
        mediaFileId:
          type: string
          maxLength: 64
          description: Version of a single title; the primary file otherwise.

    DownloadStateValue:
      type: string
      enum: [queued, preparing, paused, ready, failed, evicted]
      description: |
        Preparation on the server: `queued` (waiting for the worker or for room in the download budget,
        `error` `budget_full`), `preparing`, `paused` (live playback needed the transcode budget; it
        continues by itself), `ready` (the device can fetch it), `failed`, `evicted` (the prepared copy was
        removed; prepared again at the next sync while the device lacks the file).

    DownloadState:
      type: object
      description: |
        A download of this device. `item` is present only when the active profile may see the title; the
        device keeps the title data of downloads of other profiles locally.
      required: [id, state, quality, auto, allowedProfileIds, estimatedBytes, segmentsDone, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/DownloadID"
        state:
          $ref: "#/components/schemas/DownloadStateValue"
        quality:
          $ref: "#/components/schemas/DownloadQuality"
        auto:
          type: boolean
          description: Created by an auto-download rule (O-3).
        allowedProfileIds:
          type: array
          description: Profiles of the account that may see the title, computed by the server (plan 3.3).
          items:
            type: integer
            format: int64
        estimatedBytes:
          type: integer
          format: int64
          minimum: 0
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          description: Size of the prepared file.
        segmentsDone:
          type: integer
          minimum: 0
        segmentsTotal:
          type: integer
          minimum: 0
        error:
          type: string
          description: Stable code (`budget_full`, `not_visible`, `encode_failed`, `source_unavailable` when the enclosure of a podcast episode could not be fetched).
        createdAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
        item:
          $ref: "#/components/schemas/ItemRef"

    DownloadList:
      type: object
      required: [downloads]
      properties:
        downloads:
          type: array
          items:
            $ref: "#/components/schemas/DownloadState"

    DownloadSegment:
      type: object
      required: [startMs, durationMs, offset, length]
      properties:
        startMs:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
          minimum: 1
        offset:
          type: integer
          format: int64
          minimum: 0
        length:
          type: integer
          format: int64
          minimum: 1

    DownloadSubtitle:
      type: object
      required: [track, url]
      properties:
        track:
          $ref: "#/components/schemas/Track"
        url:
          type: string
          format: uri-reference
          description: Relative URL with the download token (`getDownloadSubtitle`).

    DownloadManifest:
      type: object
      required: [id, itemId, sizeBytes, durationMs, mimeType, codecs, width, height, initLength, segments, fileUrl, subtitles, chapters]
      properties:
        id:
          $ref: "#/components/schemas/DownloadID"
        itemId:
          $ref: "#/components/schemas/ItemID"
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        durationMs:
          type: integer
          format: int64
          minimum: 0
        mimeType:
          type: string
          description: "`video/mp4` for video, `audio/mp4` for audiobooks and podcast episodes (M6)."
        codecs:
          type: string
          description: RFC 6381 codecs for `MediaSource.isTypeSupported`, e.g. `avc1.64001f,mp4a.40.2`.
        width:
          type: integer
        height:
          type: integer
        initLength:
          type: integer
          format: int64
          minimum: 1
          description: Length of the init segment (ftyp and moov) at offset 0.
        segments:
          type: array
          description: Media segments in playback order, contiguous after the init segment.
          items:
            $ref: "#/components/schemas/DownloadSegment"
        fileUrl:
          type: string
          format: uri-reference
          description: Relative URL of the file with the download token `dt` (`getDownloadFile`).
        audio:
          $ref: "#/components/schemas/Track"
          description: The audio track the file carries.
        subtitles:
          type: array
          items:
            $ref: "#/components/schemas/DownloadSubtitle"
        chapters:
          type: array
          description: Chapters of an audiobook on the file's timeline (empty for video and episodes without marks).
          items:
            $ref: "#/components/schemas/Chapter"

    OfflineSyncRequest:
      type: object
      required: [held]
      properties:
        held:
          type: array
          maxItems: 2000
          items:
            type: object
            required: [id, complete]
            properties:
              id:
                $ref: "#/components/schemas/DownloadID"
              complete:
                type: boolean
                description: The device holds the whole file, its subtitles and poster.
        network:
          type: string
          enum: [wifi, cellular, unknown]
          description: What the device knows about its connection (informational; the client applies `wifiOnly`).

    OfflinePinVerifier:
      type: object
      description: PBKDF2-SHA256 verifier of the separate offline PIN (AN-19); salt and hash base64url without padding.
      required: [salt, iterations, hash]
      properties:
        salt:
          type: string
        iterations:
          type: integer
          minimum: 1
        hash:
          type: string

    OfflineWatchTime:
      type: object
      description: |
        Remaining watch time of today at the moment of the sync (K-5, AN-18). Offline the client subtracts
        what it plays by the device clock and stops at 0 with a hint; from `resetsAt` on (midnight in the
        server's time zone) the full `limitMinutes` apply again, every further 24 h as well.
      required: [limitMinutes, remainingMinutes, resetsAt]
      properties:
        limitMinutes:
          type: integer
          minimum: 1
        remainingMinutes:
          type: integer
          minimum: 0
        resetsAt:
          type: string
          format: date-time

    OfflineProfile:
      type: object
      description: |
        What the offline library needs of a profile that may play a download on this device. `pinSalt`
        lets the client derive its own verifier of the normal PIN at the next successful online PIN entry
        (PBKDF2-SHA256 over the PIN with the hex-decoded salt, `pinIterations`); a new salt means the PIN
        changed and the old verifier is void. `offlinePin` replaces the normal PIN offline when set.
      required: [id, name, language, isPrimary, hasPin]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        accent:
          $ref: "#/components/schemas/Accent"
        language:
          $ref: "#/components/schemas/Language"
        isPrimary:
          type: boolean
        hasPin:
          type: boolean
        pinSalt:
          type: string
          pattern: "^[0-9a-f]{32}$"
        pinIterations:
          type: integer
          minimum: 1
        offlinePin:
          $ref: "#/components/schemas/OfflinePinVerifier"
        watchTime:
          $ref: "#/components/schemas/OfflineWatchTime"

    DownloadRules:
      type: object
      required: [enabled, nextEpisodes, newPodcastEpisodes, wifiOnly, maxCount, quality]
      properties:
        enabled:
          type: boolean
        nextEpisodes:
          type: boolean
          description: Download the next episode of every started series.
        newPodcastEpisodes:
          type: boolean
          description: New episodes of the profile's favourite podcasts (O-3; favourites replaced the listening history in M7).
        wifiOnly:
          type: boolean
        maxCount:
          type: integer
          minimum: 1
          maximum: 20
          description: Most auto-downloads on this device the profile has not finished watching.
        quality:
          $ref: "#/components/schemas/DownloadQuality"

    OfflineSync:
      type: object
      required: [serverTime, downloads, revoked, profiles, rules]
      properties:
        serverTime:
          type: string
          format: date-time
        downloads:
          type: array
          items:
            $ref: "#/components/schemas/DownloadState"
        revoked:
          type: array
          description: Reported ids the device must delete.
          items:
            $ref: "#/components/schemas/DownloadID"
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/OfflineProfile"
        rules:
          $ref: "#/components/schemas/DownloadRules"

    RevocationCheck:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/DownloadID"

    RevocationList:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: array
          items:
            $ref: "#/components/schemas/DownloadID"

    OfflineEvent:
      type: object
      required: [profileId, itemId, playbackId, positionMs, durationMs, playedMs, seq, state, clientTime]
      properties:
        profileId:
          type: integer
          format: int64
        itemId:
          $ref: "#/components/schemas/ItemID"
        playbackId:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          description: Id the client created for one offline playback (duplicate check, played-time bound).
        downloadId:
          $ref: "#/components/schemas/DownloadID"
        mediaFileId:
          type: string
          maxLength: 64
        positionMs:
          type: integer
          format: int64
          minimum: 0
        durationMs:
          type: integer
          format: int64
          minimum: 1
        playedMs:
          type: integer
          format: int64
          minimum: 0
          description: Milliseconds actually played since the previous event of this playback.
        seq:
          type: integer
          format: int64
          minimum: 0
        state:
          type: string
          enum: [playing, paused, ended]
        clientTime:
          type: string
          format: date-time
          description: Device clock when the event was created.
        playbackRate:
          type: number
          minimum: 0.5
          maximum: 3.0
          description: Playback speed in use offline; stored per profile and title (H-3) when present.

    OfflineEventBatch:
      type: object
      required: [sentAt, events]
      properties:
        sentAt:
          type: string
          format: date-time
          description: Device clock when the batch was sent; the server derives the clock offset from it.
        events:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/OfflineEvent"

    OfflineEventResult:
      type: object
      required: [accepted, duplicates, rejected, results]
      properties:
        accepted:
          type: integer
          minimum: 0
        duplicates:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
        results:
          type: array
          items:
            type: string
            enum: [accepted, duplicate, rejected]

    # -------------------------------------------------------------------------------------------
    # Discover and curation (M7).
    # -------------------------------------------------------------------------------------------
    SearchRequest:
      type: object
      description: |
        A text search (`query` with at least two characters) or a browse by filters (`query` absent or
        empty with at least one filter, e.g. the genre row of the start page); without both the server
        answers 422 `validation_failed` (`query` `required`).
      properties:
        query:
          type: string
          maxLength: 100
          description: |
            Words are matched as prefixes (from the second character), diacritics folded; one-character
            words are ignored when a longer word is present, at most eight words count. Absent or empty:
            browse by the filters, ordered by title.
        genre:
          type: string
          maxLength: 80
          description: A genre name in the profile language (`listGenres`).
        yearFrom:
          type: integer
        yearTo:
          type: integer
        maxRating:
          $ref: "#/components/schemas/Rating"
          description: Only titles rated at most this FSK level (an unknown rating never passes).
        mediaTypes:
          type: array
          maxItems: 4
          items:
            type: string
            enum: [movie, series, audiobook, podcast]
          description: Media types to include; `series` covers series and episodes, `podcast` podcasts and episodes. Absent = all.
        availability:
          type: array
          maxItems: 2
          items:
            type: string
            enum: [local, download]
          description: |
            `local`: a media file is present; `download`: the title is downloaded on this device for the
            active profile (M5). Absent = no restriction. `acquiring` follows with the Arr status in M9.
        offset:
          type: integer
          minimum: 0
          default: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50

    SearchResult:
      type: object
      required: [items, total, offset, limit, people, collections]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemRef"
        total:
          type: integer
          minimum: 0
          description: Matching titles over all pages.
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        people:
          type: array
          items:
            $ref: "#/components/schemas/PersonRef"
        collections:
          type: array
          items:
            $ref: "#/components/schemas/CollectionRef"

    PersonRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    GenreRef:
      type: object
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer
          minimum: 0
          description: Visible titles with this genre.

    CollectionID:
      type: string
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"

    CollectionRef:
      type: object
      description: A collection as it appears in rows and on the detail page; counts only visible members.
      required: [id, name, count]
      properties:
        id:
          $ref: "#/components/schemas/CollectionID"
        name:
          type: string
          description: Name in the profile language (TMDB), or the admin's name.
        count:
          type: integer
          minimum: 0
        cover:
          $ref: "#/components/schemas/ItemRef"
          description: The first visible member; its poster represents the collection.

    Collection:
      type: object
      required: [id, name, items, total, offset, limit]
      properties:
        id:
          $ref: "#/components/schemas/CollectionID"
        name:
          type: string
        overview:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemRef"
        total:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1

    ItemPage:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemRef"
        total:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1

    Notification:
      type: object
      required: [id, kind, createdAt, item]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [new_episode]
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
        item:
          $ref: "#/components/schemas/ItemRef"
          description: The new episode.
        parent:
          $ref: "#/components/schemas/ItemRef"
          description: The favourite series or podcast, when still visible.

    NotificationPage:
      type: object
      required: [notifications, total, unread, offset, limit]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        total:
          type: integer
          minimum: 0
        unread:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1

    AdminPick:
      type: object
      description: One of Cat's recommendations in the administration (not an `ItemRef`).
      required: [id, itemId, kind, title, position, createdAt]
      properties:
        id:
          type: integer
          format: int64
        itemId:
          $ref: "#/components/schemas/ItemID"
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
          description: Title of the item (German text, else English, else the parsed name).
        year:
          type: integer
        profileId:
          type: integer
          format: int64
          description: The single profile this pick is for; absent = all profiles.
        profileName:
          type: string
        position:
          type: integer
          minimum: 0
        note:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        posterUrl:
          type: string
          description: |
            The poster (`w200`) through `getAdminItemImage`, system-wide and without profile id;
            absent when no poster is stored (the page shows its placeholder).

    PickRequest:
      type: object
      required: [itemId]
      properties:
        itemId:
          $ref: "#/components/schemas/ItemID"
        profileIds:
          type: array
          maxItems: 50
          items:
            type: integer
            format: int64
          description: Profiles of the main account the pick is for; absent or empty = all profiles.
        note:
          type: string
          maxLength: 280
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time

    PickUpdate:
      type: object
      properties:
        note:
          type: string
          maxLength: 280
          nullable: true
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true

    PickOrder:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          maxItems: 500
          items:
            type: integer
            format: int64

    AdminItemHit:
      type: object
      description: A title found for curation (not an `ItemRef`, no images).
      required: [id, kind, title, libraryId]
      properties:
        id:
          $ref: "#/components/schemas/ItemID"
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
        year:
          type: integer
        libraryId:
          type: integer
          format: int64
        parentTitle:
          type: string
          description: The series or podcast of an episode.

    AdminCollection:
      type: object
      description: A collection in the administration (not an `ItemRef`, unfiltered).
      required: [id, source, name, itemCount, items]
      properties:
        id:
          $ref: "#/components/schemas/CollectionID"
        source:
          type: string
          enum: [tmdb, manual]
        name:
          type: string
        nameDe:
          type: string
        tmdbId:
          type: integer
          format: int64
        itemCount:
          type: integer
          minimum: 0
        items:
          type: array
          description: Members in order; empty in the list view.
          items:
            $ref: "#/components/schemas/AdminCollectionItem"

    AdminCollectionItem:
      type: object
      required: [itemId, kind, title, position]
      properties:
        itemId:
          $ref: "#/components/schemas/ItemID"
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
        year:
          type: integer
        position:
          type: integer

    CollectionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    CollectionItemsRequest:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/ItemID"

    HomeRowSetting:
      type: object
      required: [key, position, hidden]
      properties:
        key:
          $ref: "#/components/schemas/HomeRowKey"
        position:
          type: integer
          minimum: 0
          maximum: 7
        hidden:
          type: boolean

    TraktStatus:
      type: object
      required: [configured, listKey, entries]
      properties:
        configured:
          type: boolean
          description: A client id is set (environment or stored setting).
        lastSuccess:
          type: string
          format: date-time
        lastAttempt:
          type: string
          format: date-time
        lastError:
          type: string
          description: Why the last attempt failed; the spotlight row is hidden meanwhile (I-7).
        listKey:
          type: string
          description: The list the spotlight row is configured to show (`getSpotlightConfig`).
        entries:
          type: integer
          minimum: 0
          description: |
            Entries (films and shows) of that list that are young enough to show, before the library
            intersection; 0 after a failed run or when the last success is older than twice the
            fetch interval.

    SpotlightListKind:
      type: object
      description: One of the seven kinds of public Trakt list the spotlight row can show (ADR 0011).
      required: [key, media, mediaFilters, needsUrl]
      properties:
        key:
          $ref: "#/components/schemas/SpotlightListKey"
        media:
          type: array
          description: The values of `media` this kind allows (`boxoffice` allows `movie` only).
          items:
            $ref: "#/components/schemas/SpotlightMedia"
        mediaFilters:
          type: boolean
          description: |
            `true`: the media is a filter on the fetched entries, which carry their own media (the
            user list). `false`: the media selects the list that is fetched.
        needsUrl:
          type: boolean
          description: The kind needs `listUrl` (the public user list).

    SpotlightListKey:
      type: string
      enum: [trending, popular, watched_weekly, collected_monthly, anticipated, boxoffice, url]

    SpotlightMedia:
      type: string
      enum: [movie, show, both]

    SpotlightConfig:
      type: object
      required: [enabled, listKey, media, itemCount, minHits, intervalHours, listKinds]
      properties:
        enabled:
          type: boolean
          description: "`false` keeps the row off the start page; the fetch keeps running."
        listKey:
          $ref: "#/components/schemas/SpotlightListKey"
        listUrl:
          type: string
          description: The address of the public user list; only with `listKey` `url`.
        media:
          $ref: "#/components/schemas/SpotlightMedia"
        itemCount:
          type: integer
          minimum: 5
          maximum: 20
          description: How many visible library hits the row shows at most, per profile (S-3).
        minHits:
          type: integer
          minimum: 0
          maximum: 10
          description: Below this number of visible hits (counted before the cut to `itemCount`) the row is omitted (AN-3, S-3).
        intervalHours:
          type: integer
          minimum: 6
          maximum: 48
          description: Hours between two fetches; entries older than twice this are stale and not shown (S-8).
        listKinds:
          type: array
          description: The fixed catalogue of list kinds (read only).
          items:
            $ref: "#/components/schemas/SpotlightListKind"

    SpotlightConfigUpdate:
      type: object
      description: The writable part of `SpotlightConfig`.
      required: [enabled, listKey, media, itemCount, minHits, intervalHours]
      properties:
        enabled:
          type: boolean
        listKey:
          $ref: "#/components/schemas/SpotlightListKey"
        listUrl:
          type: string
          maxLength: 500
          description: Required with `listKey` `url`, ignored otherwise.
        media:
          $ref: "#/components/schemas/SpotlightMedia"
        itemCount:
          type: integer
          minimum: 5
          maximum: 20
        minHits:
          type: integer
          minimum: 0
          maximum: 10
        intervalHours:
          type: integer
          minimum: 6
          maximum: 48

    SpotlightEntries:
      type: object
      required: [listKey, entries, orphans]
      properties:
        listKey:
          $ref: "#/components/schemas/SpotlightListKey"
        entries:
          type: array
          description: The fetched entries in fetch order, at most 100 per medium.
          maxItems: 200
          items:
            $ref: "#/components/schemas/SpotlightEntry"
        orphans:
          type: array
          description: Overrides of this list whose title is not among the fetched entries any more.
          items:
            $ref: "#/components/schemas/SpotlightEntry"

    SpotlightEntry:
      type: object
      description: |
        One entry of the fetched list with its library hit and its override. Not an `ItemRef`: the
        administration is system-wide and names the library title by id and title only.
      required: [media, tmdbId, position, hidden, orphaned]
      properties:
        media:
          type: string
          enum: [movie, show]
        tmdbId:
          type: integer
          format: int64
        position:
          type: integer
          minimum: 0
          description: The 1-based rank in the fetched list; 0 for an orphaned override.
        title:
          type: string
          description: The title as Trakt names it.
        year:
          type: integer
        itemId:
          $ref: "#/components/schemas/ItemID"
          description: The library title matched by TMDB id; absent when the library has no such title (never on the start page, S-4).
        itemTitle:
          type: string
        hidden:
          type: boolean
        pinnedRank:
          type: integer
          minimum: 1
          description: The 1-based place the entry is pinned to in the row; absent when not pinned.
        note:
          type: string
          maxLength: 280
        orphaned:
          type: boolean
          description: The override has no entry in the fetched list.
        posterUrl:
          type: string
          description: The poster (`w200`) of the library hit through `getAdminItemImage`; absent without hit or poster.

    SpotlightEntryOverride:
      type: object
      description: |
        The override of one entry. A field that is absent keeps its value; `null` clears it. An
        empty object removes the override.
      properties:
        hidden:
          type: boolean
        pinnedRank:
          type: integer
          minimum: 1
          nullable: true
        note:
          type: string
          maxLength: 280
          nullable: true

    # -------------------------------------------------------------------------------------------
    # Administration and notifications (M8).
    # -------------------------------------------------------------------------------------------
    SystemInfo:
      type: object
      description: |
        The server's state for the wizard (A-1) and the dashboard (A-3). Carries no secret, so the wizard
        shows it before an account exists.
      required: [version, startedAt, gpu, inotify, configFs, cacheFs]
      properties:
        version:
          type: string
          examples: ["0.9.0+abc1234"]
        startedAt:
          type: string
          format: date-time
        gpu:
          $ref: "#/components/schemas/GPUInfo"
        inotify:
          $ref: "#/components/schemas/InotifyInfo"
        configFs:
          type: string
          description: File system type of the config directory, for example `ext4`; `unknown` when undetected.
          examples: ["ext4"]
        cacheFs:
          type: string
          description: File system type of the cache directory.
          examples: ["ext4"]

    GPUInfo:
      type: object
      description: The transcode backend found at start (M1b, M4) and the GPU devices visible in the container.
      required: [backend, hardwareEncode, tonemapper, hwTonemap, devices]
      properties:
        backend:
          type: string
          enum: [nvenc, qsv, vaapi, software]
        hardwareEncode:
          type: boolean
          description: The backend encodes on the GPU (every backend but software).
        tonemapper:
          type: string
          enum: [cuda, placebo, vpp_qsv, vaapi, cpu]
          description: The HDR to SDR filter of the backend's pipeline.
        hwTonemap:
          type: boolean
          description: The tonemapper runs on the GPU (every tonemapper but cpu).
        ffmpegVersion:
          type: string
          description: First line of `ffmpeg -version`.
        composeOverride:
          type: string
          enum: [nvidia, intel, amd]
          description: |
            The Docker Compose override file (`compose.<value>.yaml`) that passes the GPU into the
            container: from the backend (nvenc → nvidia, qsv and vaapi on Intel → intel, vaapi otherwise
            → amd), without a hardware backend from the devices (`/dev/nvidia0` → nvidia,
            `/dev/dri/renderD*` → intel). Absent when no GPU device is visible.
        devices:
          type: object
          required: [dri, nvidia]
          properties:
            dri:
              type: boolean
              description: A render node `/dev/dri/renderD*` exists in the container.
            nvidia:
              type: boolean
              description: "`/dev/nvidia0` exists in the container."
      examples:
        - backend: software
          hardwareEncode: false
          tonemapper: cpu
          hwTonemap: false
          composeOverride: nvidia
          devices: {dri: false, nvidia: true}

    InotifyInfo:
      type: object
      required: [maxUserWatches, watchedDirs, usagePercent, warn]
      properties:
        maxUserWatches:
          type: integer
          format: int64
          minimum: 0
          description: "`/proc/sys/fs/inotify/max_user_watches`; 0 when unreadable."
        watchedDirs:
          type: integer
          format: int64
          minimum: 0
          description: Directories the library watcher holds (0 in the wizard).
        usagePercent:
          type: number
          format: double
          minimum: 0
          description: watchedDirs per maxUserWatches in percent.
        warn:
          type: boolean
          description: The limit is below 65536 or more than 80 % of it are used; the UI shows the sysctl command.

    BrowseWatch:
      type: string
      enum: [inotify, poll, inotify_poll]
      x-enum-varnames: [BrowseWatchInotify, BrowseWatchPoll, BrowseWatchInotifyPoll]
      description: |
        Change detection the scanner would choose for this directory (plan 3.4). Its own schema with
        its own constant names: a generated enum without them takes package-wide, unprefixed names,
        and `Inotify`, `Poll` and `InotifyPoll` belong to `LibraryRoot.watch` already.

    BrowseWarning:
      type: string
      enum: [network_share, fuse_unknown]
      x-enum-varnames: [BrowseWarnNetworkShare, BrowseWarnFUSEUnknown]
      description: A hint, not an error; the library works with polling.

    BrowseRequest:
      type: object
      required: [rootId]
      properties:
        rootId:
          type: string
          description: Id of a root from `listBrowseRoots`; stable for the lifetime of the server process.
          maxLength: 64
        rel:
          type: string
          description: |
            Directory below the root, slash-separated and relative; empty or absent lists the root
            itself. Absolute paths, `..` segments and NUL bytes are rejected (`validation_failed`).
          maxLength: 4096
          examples: ["Filme/Action"]
        cursor:
          type: string
          description: |
            `nextCursor` of the previous page; without it the first page is returned. Longer than
            `rel`, because it carries the root, the directory and the last name of the page.
          maxLength: 12288
        limit:
          type: integer
          description: Rows per page; without it the server answers with 200.
          minimum: 1
          maximum: 500

    BrowseRoot:
      type: object
      required: [id, path, source]
      properties:
        id:
          type: string
          description: Opaque id for `BrowseRequest.rootId`.
        path:
          type: string
          description: Absolute path of the root, as it is shown to the administrator.
        browsable:
          type: boolean
          description: |
            False for a grandfathered library root that lies below no configured root: the dialog shows
            it so a directory can carry its library's name, but it cannot be entered.
        source:
          type: string
          enum: [configured, library]
          x-enum-varnames: [BrowseRootConfigured, BrowseRootLibrary]
          description: "`configured`: from `SLOUCHCAT_BROWSE_ROOTS`; `library`: a root of an existing library."
        fsType:
          type: string
          description: Detected file system class (`ext4`, `xfs`, `btrfs`, `zfs`, `fuse`, `nfs`, `smb`, `unknown`), as in `LibraryRoot`; omitted by `listSetupRoots`.
        warning:
          $ref: "#/components/schemas/BrowseWarning"
          description: Omitted by `listSetupRoots`, which answers before any account exists.
        libraryId:
          type: integer
          format: int64
          description: The library this root belongs to; absent for a configured root that is none.
        libraryName:
          type: string

    DirectoryListing:
      type: object
      description: One directory below a browsable root, with its subdirectories.
      required: [rootId, rel, atRoot, entries]
      properties:
        rootId:
          type: string
        rel:
          type: string
          description: The listed directory relative to the root; empty at the root itself.
        path:
          type: string
          description: Absolute path of the listed directory, ready for the folder field.
        parentRel:
          type: string
          description: One level up, relative to the root; absent at the root, empty one level below it.
        atRoot:
          type: boolean
          description: "`rel` is empty: there is no way further up, the dialog goes back to the roots."
        fsType:
          type: string
        watch:
          $ref: "#/components/schemas/BrowseWatch"
        warning:
          $ref: "#/components/schemas/BrowseWarning"
        problem:
          type: string
          enum: [not_readable, not_directory]
          x-enum-varnames: [BrowseNotReadable, BrowseNotDirectory]
          description: |
            The directory lies below a root but could not be listed; `entries` is then empty. A path
            below no root answers 404 instead.
        truncated:
          type: boolean
          description: The directory holds more than 50 000 entries; the server read the first 50 000.
        nextCursor:
          type: string
          description: Pass as `cursor` for the next page; absent on the last page.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryEntry"

    DirectoryEntry:
      type: object
      description: One subdirectory as the folder picker shows it.
      required: [name, rel]
      properties:
        name:
          type: string
          description: Name of the subdirectory, without its path.
        rel:
          type: string
          description: Path of the subdirectory relative to the root, for the next `BrowseRequest`.
        path:
          type: string
          description: Absolute path of the subdirectory, ready for the folder field.
        symlink:
          type: boolean
          description: |
            A symlinked directory: it is listed, because the scanner sees it too, but it cannot be
            entered (`path_not_browsable`), because that would leave the root.
        libraryId:
          type: integer
          format: int64
          description: The library this directory already belongs to; absent otherwise. A new library may not overlap it.
        libraryName:
          type: string

    PathCheckRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
          examples: ["/media/movies"]

    PathCheck:
      type: object
      description: A library path as the wizard shows it (plan 3.4).
      required: [ok]
      properties:
        ok:
          type: boolean
          description: The path is an absolute, readable directory.
        fsType:
          type: string
          description: File system type, for example `ext4`, `nfs4`, `cifs`, `fuse.mergerfs`; absent with a problem.
        watchMode:
          type: string
          enum: [inotify, poll, inotify_poll]
          x-enum-varnames: [PathWatchInotify, PathWatchPoll, PathWatchInotifyPoll]
          description: How the scanner would follow changes; absent with a problem.
        warning:
          type: string
          enum: [network_share, fuse_unknown]
          description: A hint, not an error; the library works with polling.
        problem:
          type: string
          enum: [not_absolute, missing, not_directory, not_readable, not_browsable]
          description: |
            Why the path is not usable; set exactly when `ok` is false. `not_browsable`: the path lies
            below none of the browsable roots (`SLOUCHCAT_BROWSE_ROOTS`). The path is then not described
            further, so the answer tells nothing about the file system outside those roots.

    TMDBCheckRequest:
      type: object
      required: [tmdbApiKey]
      properties:
        tmdbApiKey:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
          description: TMDB v4 read access token; neither stored nor logged.

    TMDBCheck:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        problem:
          type: string
          enum: [invalid, unreachable]
          description: TMDB rejected the key (`invalid`) or did not answer (`unreachable`); set exactly when `ok` is false.

    Dashboard:
      type: object
      description: The admin overview (A-3); no `ItemRef`.
      required: [streams, jobs, storage, integrations, webhooks, errors, update]
      properties:
        streams:
          type: array
          items:
            $ref: "#/components/schemas/AdminStream"
        jobs:
          $ref: "#/components/schemas/JobCounts"
        storage:
          type: object
          required: [config, cache]
          properties:
            config:
              $ref: "#/components/schemas/StorageInfo"
            cache:
              $ref: "#/components/schemas/StorageInfo"
        integrations:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationStatus"
        webhooks:
          $ref: "#/components/schemas/WebhookTileStatus"
        errors:
          type: array
          maxItems: 50
          description: The newest errors of the server log, newest first, redacted like the log itself.
          items:
            $ref: "#/components/schemas/ErrorEntry"
        update:
          $ref: "#/components/schemas/UpdateState"
        browse:
          $ref: "#/components/schemas/BrowseHealth"

    BrowseHealth:
      type: object
      description: |
        The state of the folder browser of the library form. A listing that hangs on a mount which
        stopped answering keeps its slot for good, because a blocked system call cannot be cancelled;
        `lostSlots` counts them. At `lostSlots` equal to `slots` the browser answers `browse_busy`
        until the server restarts. A warning, not an error: nothing else is affected.
      required: [lostSlots, slots]
      properties:
        lostSlots:
          type: integer
          minimum: 0
        slots:
          type: integer
          minimum: 0

    JobCounts:
      type: object
      required: [queued, running, failed, recentFailed]
      properties:
        queued:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        recentFailed:
          type: array
          maxItems: 10
          description: The last failed jobs, newest first.
          items:
            $ref: "#/components/schemas/JobSummary"

    JobSummary:
      type: object
      required: [id, type, state, attempts, maxAttempts, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          description: Job type, for example `scan.library`, `metadata.match`, `notify.deliver`.
          examples: ["metadata.match"]
        state:
          type: string
          enum: [queued, running, done, failed, cancelled]
        attempts:
          type: integer
          minimum: 0
        maxAttempts:
          type: integer
          minimum: 1
        lastError:
          type: string
          description: Error of the last attempt, redacted.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StorageInfo:
      type: object
      required: [path, totalBytes, freeBytes]
      properties:
        path:
          type: string
          examples: ["/config"]
        totalBytes:
          type: integer
          format: int64
          minimum: 0
        freeBytes:
          type: integer
          format: int64
          minimum: 0

    IntegrationStatus:
      type: object
      required: [key, state]
      properties:
        key:
          type: string
          enum: [tmdb, tvdb, youtube, trakt, email, push, telegram, updateCheck]
        state:
          type: string
          enum: [configured, missing, error, disabled]
          description: |
            `configured` (set and, where checked, working), `missing` (not set), `error` (the last use
            failed, see `detail`), `disabled` (switched off, the update check).
        detail:
          type: string
          description: Why the state is `error`; never contains a secret.
        checkedAt:
          type: string
          format: date-time

    ErrorEntry:
      type: object
      required: [at, source, message]
      properties:
        at:
          type: string
          format: date-time
        source:
          type: string
          description: The component or job type that logged the error.
          examples: ["metadata.match"]
        message:
          type: string
          description: Message and error text of the log record, redacted.
        jobId:
          type: integer
          format: int64
        jobType:
          type: string

    UpdateState:
      type: object
      required: [enabled, currentVersion, available]
      properties:
        enabled:
          type: boolean
          description: The daily update check is on.
        currentVersion:
          type: string
        latestVersion:
          type: string
          description: Newest published version from the release manifest.
        available:
          type: boolean
          description: latestVersion is newer than the running version.
        url:
          type: string
          format: uri
          description: Release page of latestVersion.
        notes:
          type: string
          description: Release notes from the manifest (plain text).
        checkedAt:
          type: string
          format: date-time
        error:
          type: string
          description: Why the last check failed.

    UpdateNotice:
      type: object
      description: A newer version is published (header badge of the main account, A-5).
      required: [version, url]
      properties:
        version:
          type: string
          examples: ["0.9.1"]
        url:
          type: string
          format: uri

    SettingSource:
      type: string
      enum: [env, stored, none]
      description: Where a value comes from; `env` wins over a stored value and cannot be changed in the UI.

    KeyState:
      type: object
      required: [source]
      properties:
        source:
          $ref: "#/components/schemas/SettingSource"
        hint:
          type: string
          maxLength: 4
          description: The last four characters of a stored key; absent for keys from the environment.

    SMTPTLS:
      type: string
      enum: [starttls, tls, none]
      description: STARTTLS on the plain port (default), implicit TLS, or no encryption.

    AdminSettings:
      type: object
      required: [publicUrlSource, updateCheckEnabled, keys, email, telegram, push]
      properties:
        publicUrl:
          type: string
          format: uri
          description: Address of the server for links in e-mails and messages.
        publicUrlSource:
          $ref: "#/components/schemas/SettingSource"
        updateCheckEnabled:
          type: boolean
        keys:
          $ref: "#/components/schemas/AdminSettingsKeys"
        email:
          $ref: "#/components/schemas/AdminSettingsEmail"
        telegram:
          $ref: "#/components/schemas/AdminSettingsTelegram"
        push:
          $ref: "#/components/schemas/AdminSettingsPush"

    AdminSettingsKeys:
      type: object
      description: The provider keys (M3, M7); the values themselves are never returned.
      required: [tmdb, tvdb, tvdbPin, youtube, trakt]
      properties:
        tmdb:
          $ref: "#/components/schemas/KeyState"
        tvdb:
          $ref: "#/components/schemas/KeyState"
        tvdbPin:
          $ref: "#/components/schemas/KeyState"
        youtube:
          $ref: "#/components/schemas/KeyState"
        trakt:
          $ref: "#/components/schemas/KeyState"

    AdminSettingsEmail:
      type: object
      description: The e-mail server; the password is never returned.
      required: [source]
      properties:
        source:
          $ref: "#/components/schemas/SettingSource"
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        user:
          type: string
        from:
          type: string
          description: Sender address, optionally with a name (`Slouchcat <media@example.ch>`).
        tls:
          $ref: "#/components/schemas/SMTPTLS"

    AdminSettingsTelegram:
      type: object
      description: The Telegram bot; the token is never returned.
      required: [source]
      properties:
        source:
          $ref: "#/components/schemas/SettingSource"
        botUsername:
          type: string
          description: The bot's user name from `getMe`, without `@`.

    AdminSettingsPush:
      type: object
      required: [configured]
      properties:
        configured:
          type: boolean
          description: A VAPID key pair exists (created on first use).
        publicKey:
          type: string
          description: VAPID public key, base64url.

    AdminSettingsUpdate:
      type: object
      description: |
        Fields left out keep their value. `clear` removes stored values; a field may not be set and
        cleared in the same request. Every secret is write-only.
      properties:
        publicUrl:
          type: string
          format: uri
          maxLength: 2048
          description: http or https URL without query; set or cleared (`clear`), never through an empty string.
        updateCheckEnabled:
          type: boolean
        keys:
          $ref: "#/components/schemas/AdminSettingsKeysUpdate"
        email:
          $ref: "#/components/schemas/AdminSettingsEmailUpdate"
        telegram:
          $ref: "#/components/schemas/AdminSettingsTelegramUpdate"
        clear:
          type: array
          uniqueItems: true
          description: Stored values to remove.
          items:
            type: string
            enum: [publicUrl, tmdb, tvdb, tvdbPin, youtube, trakt, email, telegram]

    AdminSettingsKeysUpdate:
      type: object
      description: New keys; each is stored encrypted and never returned.
      properties:
        tmdb:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        tvdb:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        tvdbPin:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        youtube:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        trakt:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true

    AdminSettingsEmailUpdate:
      type: object
      description: The e-mail server as a whole; `password` absent keeps the stored password.
      required: [host, port, from, tls]
      properties:
        host:
          type: string
          minLength: 1
          maxLength: 253
          examples: ["smtp.example.ch"]
        port:
          type: integer
          minimum: 1
          maximum: 65535
          examples: [587]
        user:
          type: string
          maxLength: 254
        password:
          type: string
          format: password
          maxLength: 1024
          writeOnly: true
        from:
          type: string
          minLength: 3
          maxLength: 320
        tls:
          $ref: "#/components/schemas/SMTPTLS"

    AdminSettingsTelegramUpdate:
      type: object
      required: [botToken]
      properties:
        botToken:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
          description: Token from BotFather (`<bot id>:<secret>`); checked with `getMe` before it is stored.

    EmailTestRequest:
      type: object
      properties:
        to:
          type: string
          format: email
          maxLength: 254

    Backup:
      type: object
      required: [name, createdAt, sizeBytes, includesSecrets, encrypted, kind]
      properties:
        name:
          type: string
          examples: ["slouchcat-backup-0.9.0-20261021T120000Z.tar.gz"]
        createdAt:
          type: string
          format: date-time
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        includesSecrets:
          type: boolean
          description: The archive carries the key file and the encrypted settings.
        encrypted:
          type: boolean
          description: The archive is encrypted with a passphrase (age); restoring it needs the passphrase.
        version:
          type: string
          description: Server version that wrote the backup; absent when unknown.
        kind:
          type: string
          enum: [manual, auto]
          description: "`auto`: written by the server before a migration or a restore."

    BackupRequest:
      type: object
      required: [includeSecrets]
      properties:
        includeSecrets:
          type: boolean
          description: Include the key file and the encrypted settings; needs a passphrase.
        passphrase:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
          writeOnly: true

    RestoreUpload:
      type: object
      description: |
        The parts in this order: `passphrase` (when the archive is encrypted), then `file`. The server
        reads the file as a stream and ignores parts after it.
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: A backup archive (`.tar.gz` or `.tar.gz.age`).
        passphrase:
          type: string
          format: password
          maxLength: 1024
          writeOnly: true

    RestoreRequest:
      type: object
      properties:
        passphrase:
          type: string
          format: password
          maxLength: 1024
          writeOnly: true

    RestoreResult:
      type: object
      required: [restartAt, version, includesSecrets]
      properties:
        restartAt:
          type: string
          format: date-time
          description: When the server restarts; the client polls `getHealth` from then on.
        version:
          type: string
          description: Server version that wrote the backup.
        includesSecrets:
          type: boolean
          description: Without secrets the provider keys, the e-mail server, the bot and the push keys must be entered again.

    ProfileRef:
      type: object
      description: A profile in the account overview of the administration.
      required: [id, name, maxRating, isPrimary]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        maxRating:
          $ref: "#/components/schemas/Rating"
        isPrimary:
          type: boolean

    ChannelSummary:
      type: object
      required: [channel, enabled]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        enabled:
          type: boolean

    AdminAccount:
      type: object
      description: An account as the administration sees it (A-2).
      required: [id, email, role, isOwner, maxRating, allLibraries, libraryIds, profiles, createdAt, channels, limits]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user]
        isOwner:
          type: boolean
          description: The one account that cannot be deleted or demoted (ADR 0014).
        maxRating:
          $ref: "#/components/schemas/Rating"
        allLibraries:
          type: boolean
        libraryIds:
          type: array
          items:
            type: integer
            format: int64
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileRef"
        lastSeenAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        channels:
          type: array
          items:
            $ref: "#/components/schemas/ChannelSummary"
        limits:
          $ref: "#/components/schemas/PlaybackLimits"
          description: |
            Bandwidth, maximum output height and concurrent streams of the account (W-8); they cap every
            profile of the account. `watchLimitMinutes` is a profile setting and always absent here.

    AccountRoleUpdate:
      type: object
      description: |
        The role an account should have (`setAccountRole`). There is no field for the owner badge:
        the owner is fixed to the first account and cannot be handed over (decision 12 g).
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, user]
          description: "`admin` runs the server and its libraries, `user` manages only its own profiles."

    AccountUpdate:
      type: object
      required: [currentPassword]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        currentPassword:
          type: string
          format: password
          maxLength: 256
          writeOnly: true
        newPassword:
          type: string
          format: password
          minLength: 10
          maxLength: 256
          writeOnly: true

    Channel:
      type: string
      enum: [email, push, telegram]
      description: A notification channel; the in-app inbox is always on and no channel.

    EventType:
      type: string
      enum: [new_content, errors, invitations, announcements]
      description: |
        `new_content`: a new episode of a favourite (per profile, prefixed with the profile name);
        `errors`: failures the main user should see (main account only); `invitations`: an
        invitation was accepted; `announcements`: the main user published an announcement.

    ChannelSettings:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          description: email, push and telegram, in this order.
          items:
            $ref: "#/components/schemas/ChannelSetting"

    ChannelSetting:
      type: object
      required: [channel, enabled, events, available]
      properties:
        channel:
          $ref: "#/components/schemas/Channel"
        enabled:
          type: boolean
        events:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/EventType"
        available:
          type: boolean
          description: The server has this channel configured.
        email:
          $ref: "#/components/schemas/EmailChannel"
        telegram:
          $ref: "#/components/schemas/TelegramChannel"
        push:
          $ref: "#/components/schemas/PushChannel"

    EmailChannel:
      type: object
      required: [address]
      properties:
        address:
          type: string
          format: email
          maxLength: 254
          description: Recipient; the account's e-mail unless set.

    TelegramChannel:
      type: object
      required: [linked]
      properties:
        linked:
          type: boolean
        chatId:
          type: string
          description: The linked chat (no secret).
        linkCode:
          type: string
          pattern: "^[A-Z0-9]{6}$"
          description: Open link code; the user sends `/start <code>` to the bot.
        linkExpiresAt:
          type: string
          format: date-time
        botUsername:
          type: string

    PushChannel:
      type: object
      required: [subscriptions]
      properties:
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/PushSubscriptionSummary"

    ChannelSettingUpdate:
      type: object
      required: [enabled, events]
      properties:
        enabled:
          type: boolean
        events:
          type: array
          uniqueItems: true
          maxItems: 5
          items:
            $ref: "#/components/schemas/EventType"
        email:
          $ref: "#/components/schemas/EmailChannel"
          description: E-mail channel only; absent uses the account's e-mail.

    PushSubscriptionSummary:
      type: object
      required: [id, createdAt, thisDevice]
      properties:
        id:
          type: integer
          format: int64
        deviceName:
          type: string
        createdAt:
          type: string
          format: date-time
        thisDevice:
          type: boolean
          description: The subscription belongs to the device of the calling session.

    PushSubscriptionRequest:
      type: object
      description: The browser's `PushSubscription.toJSON()` plus a device name.
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 2048
          writeOnly: true
          description: Push service URL; a capability secret, never returned or logged.
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
              maxLength: 256
              writeOnly: true
            auth:
              type: string
              maxLength: 64
              writeOnly: true
        deviceName:
          type: string
          maxLength: 80

    VapidKey:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: string
          description: VAPID public key (uncompressed P-256 point, base64url).

    Announcement:
      type: object
      required: [id, title, body, createdAt, acknowledgedCount, profileCount]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string
          description: Plain text; line breaks are kept.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          description: Absent while unpublished.
        createdBy:
          type: string
          description: E-mail of the account that wrote it; absent when that account is gone.
        acknowledgedCount:
          type: integer
          minimum: 0
          description: Profiles that acknowledged it.
        profileCount:
          type: integer
          minimum: 0
          description: Profiles of every account.

    AnnouncementRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          minLength: 1
          maxLength: 4000
        publish:
          type: boolean
          default: false

    AnnouncementUpdate:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          minLength: 1
          maxLength: 4000

    ProfileAnnouncement:
      type: object
      required: [id, title, body, publishedAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string
        publishedAt:
          type: string
          format: date-time

    StatsDays:
      type: integer
      enum: [7, 30, 90, 365]
      default: 30
      description: Length of the statistics period in days, ending now.

    Stats:
      type: object
      description: Usage statistics (A-8), unfiltered; titles are plain `StatTitle`s, never `ItemRef`s.
      required: [days, topTitles, watchTime, playback, devices]
      properties:
        days:
          $ref: "#/components/schemas/StatsDays"
        topTitles:
          type: array
          maxItems: 20
          description: Most watched titles by played time.
          items:
            $ref: "#/components/schemas/StatTitle"
        watchTime:
          type: array
          description: Played time per profile, most first.
          items:
            $ref: "#/components/schemas/StatProfile"
        playback:
          $ref: "#/components/schemas/StatPlayback"
        devices:
          type: array
          description: Played time per device type, most first.
          items:
            $ref: "#/components/schemas/StatDevice"

    StatTitle:
      type: object
      required: [itemId, title, kind, plays, watchedMs]
      properties:
        itemId:
          $ref: "#/components/schemas/ItemID"
        title:
          type: string
        kind:
          $ref: "#/components/schemas/ItemKind"
        year:
          type: integer
        plays:
          type: integer
          minimum: 0
          description: Distinct playback sessions (an event without one counts on its own).
        watchedMs:
          type: integer
          format: int64
          minimum: 0

    StatProfile:
      type: object
      required: [profileId, profileName, accountEmail, watchedMs, plays]
      properties:
        profileId:
          type: integer
          format: int64
        profileName:
          type: string
        accountEmail:
          type: string
        watchedMs:
          type: integer
          format: int64
          minimum: 0
        plays:
          type: integer
          minimum: 0

    StatPlayback:
      type: object
      description: Playback sessions started in the period by mode.
      required: [direct, remux, transcode, transcodeShare, hardwareShare]
      properties:
        direct:
          type: integer
          minimum: 0
        remux:
          type: integer
          minimum: 0
        transcode:
          type: integer
          minimum: 0
        transcodeShare:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: transcode per all sessions; 0 without sessions.
        hardwareShare:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Transcodes encoded on the GPU per transcodes; 0 without transcodes.

    StatDevice:
      type: object
      required: [type, count, watchedMs]
      properties:
        type:
          type: string
          enum: [desktop, phone, tablet, tv, other, unknown]
          x-enum-varnames: [StatDeviceDesktop, StatDevicePhone, StatDeviceTablet, StatDeviceTv, StatDeviceOther, StatDeviceUnknown]
          description: The type the device reported; `unknown` for events without a known device.
        count:
          type: integer
          minimum: 0
          description: Distinct devices of this type with played time in the period.
        watchedMs:
          type: integer
          format: int64
          minimum: 0

    WebhookPayload:
      type: object
      description: |
        The body Radarr or Sonarr sends. Only `eventType` and the directory are read; every other field
        is accepted and ignored, so a new field of a later version breaks nothing (I-8).
      additionalProperties: true
      properties:
        eventType:
          type: string
          description: |
            The event as the service names it: `Download`, `Rename`, `MovieFileDelete`,
            `EpisodeFileDelete`, `MovieDelete`, `SeriesDelete`, `Test`, `Grab`, `Health` …
          examples: ["Download"]
        movie:
          type: object
          description: The film of a Radarr event.
          additionalProperties: true
          properties:
            folderPath:
              type: string
              description: Directory of the film as Radarr sees it.
              examples: ["/movies/Dune (2021)"]
        series:
          type: object
          description: The series of a Sonarr event.
          additionalProperties: true
          properties:
            path:
              type: string
              description: Directory of the series as Sonarr sees it.
              examples: ["/tv/Slouchcat Test Show"]

    WebhookResult:
      type: object
      description: What Slouchcat did with a received webhook.
      required: [result]
      properties:
        result:
          type: string
          enum: [scan_queued, acknowledged, ignored]
          description: |
            `scan_queued`: a targeted scan of the reported directory runs; `acknowledged`: the `Test`
            event of Radarr or Sonarr; `ignored`: an event without an effect here.
        path:
          type: string
          description: The directory that is scanned, after the path mapping; only with `scan_queued`.
          examples: ["/media/Filme/Dune (2021)"]

    Integration:
      type: object
      description: One webhook address handed to Radarr or Sonarr (I-8). It never carries the token.
      required: [id, name, kind, tokenTail, pathMap, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: ["Radarr"]
        kind:
          type: string
          enum: [radarr, sonarr]
        tokenTail:
          type: string
          minLength: 4
          maxLength: 4
          description: Last four characters of the token, so an address can be recognised in a list.
        pathMap:
          type: array
          description: Prefix pairs, longest match wins; empty by default.
          items:
            $ref: "#/components/schemas/PathMapping"
        lastSeenAt:
          type: string
          format: date-time
          description: When this integration last reported; absent until the first webhook.
        createdAt:
          type: string
          format: date-time

    IntegrationCreated:
      type: object
      description: |
        A just created or renewed integration together with its full address. This is the only
        answer that contains it; afterwards only `tokenTail` remains (plan 3.8 point 2).
      required: [integration, url, token]
      properties:
        integration:
          $ref: "#/components/schemas/Integration"
        url:
          type: string
          description: The complete address to paste into "Connect → Webhook".
          examples: ["https://slouchcat.example.ch/api/v1/webhooks/4C8c..."]
        token:
          type: string
          description: The token alone, for an address the administration assembles itself.

    IntegrationRequest:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          type: string
          enum: [radarr, sonarr]

    PathMapping:
      type: object
      description: Translates a prefix of the reported path into a prefix on this server.
      required: [from, to]
      properties:
        from:
          type: string
          description: Absolute prefix as Radarr or Sonarr sees it.
          examples: ["/movies"]
        to:
          type: string
          description: Absolute prefix on this server.
          examples: ["/media/Filme"]

    PathMapRequest:
      type: object
      required: [pathMap]
      properties:
        pathMap:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/PathMapping"

    IntegrationEvent:
      type: object
      description: One received webhook in the log of an integration (the newest 20).
      required: [id, receivedAt, event, result]
      properties:
        id:
          type: integer
          format: int64
        receivedAt:
          type: string
          format: date-time
        event:
          type: string
          description: The event as Radarr or Sonarr named it.
          examples: ["Download"]
        reportedPath:
          type: string
          description: The directory the service reported; absent for events without one.
        resolvedPath:
          type: string
          description: The directory after the path mapping; absent for events without one.
        result:
          type: string
          enum: [scan_queued, acknowledged, ignored, outside_roots, invalid_payload]
          description: |
            `scan_queued`: a targeted scan runs; `acknowledged`: the Test event; `ignored`: no effect;
            `outside_roots`: the mapped path lies under no library root; `invalid_payload`: an acting
            event without a directory.

    WebhookTileStatus:
      type: object
      description: The "Webhooks" tile of the dashboard (A-3, decision 5.6).
      required: [total, eventsLast24h, silent]
      properties:
        total:
          type: integer
          minimum: 0
          description: Configured integrations.
        eventsLast24h:
          type: integer
          minimum: 0
          description: Webhooks received in the last 24 hours.
        silent:
          type: array
          description: Names that have reported nothing for seven days.
          items:
            type: string
