      operationId: setItemsRating
      summary: Assign an age rating to many titles at once (B-9, AN-1)
      description: |
        The same semantics as `setItemRating` for every id in the list, in transactions of at most 500 rows.
        Unknown ids are skipped and not counted. `null` clears the overrides.
      tags: [admin]
      x-visibility: admin
      requestBody:
