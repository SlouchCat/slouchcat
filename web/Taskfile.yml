# Web app, design tokens and TypeScript API client. Included from the root Taskfile with dir ./web,
# so every command runs in web/. Workspace-wide scripts are reached with `pnpm -w`.
version: "3"

vars:
  WEBASSETS: ../server/internal/webassets/dist
  DOCKER: docker
  # The Storybook screenshots run in the official Playwright image of exactly the installed
  # @playwright/test version, so baselines match on every machine and in CI (storybook.config.ts).
  PLAYWRIGHT_VERSION:
    sh: node -p "require('./package.json').devDependencies['@playwright/test']"
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v{{.PLAYWRIGHT_VERSION}}-noble
  # The e2e shards of CI: the length of the matrix in .github/workflows/ci.yml (job e2e). Six keep
  # the longest shard at about 4.5 min of tests plus 1.5 min of setup (ADR 0013, addendum).
  CI_E2E_SHARDS: "6"
  REPO:
    sh: git rev-parse --show-toplevel
  # Heavy local runs (e2e, Storybook screenshots) wait for one of a few machine-wide slots, so
  # parallel agents do not slow each other's runs down; CI skips the wait (scripts/heavy-slot.sh).
  HEAVY: "{{.REPO}}/scripts/heavy-slot.sh"
  # The repository is mounted at the same path inside the container: pnpm's bin shims and
  # symlinks keep working.
  PLAYWRIGHT_DOCKER: >-
    {{.DOCKER}} run --rm --init --ipc=host
    --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI
    -v "{{.REPO}}:{{.REPO}}" -w "{{.REPO}}/web"
    {{.PLAYWRIGHT_IMAGE}}

tasks:
  tokens:
    internal: true
    desc: Build the design tokens (web build, lint and tests import them)
    cmds:
      - pnpm --filter @slouchcat/design-tokens run build

  gen:
    desc: Build design tokens and generate the TypeScript API client from api/openapi.yaml
    cmds:
      - pnpm -w run gen

  # The other half of the root `gen:check`: the web job runs it right after `web:gen`. The path
  # leaves web/ because the generated client is a workspace package of its own.
  gen:check:
    desc: Fail when the generated TypeScript client differs from the committed state
    cmds:
      - git diff --exit-code --stat -- ../packages/api-client/src/generated

  lint:
    desc: ESLint, stylelint, tsc --noEmit for every package, then prettier --check
    deps: [tokens]
    cmds:
      - pnpm -w run lint

  test:
    desc: Vitest across the workspace (contrast, API client, locales, home route)
    deps: [tokens]
    cmds:
      - pnpm -w run test

  build:
    desc: Build tokens and the PWA into web/dist and copy it into the Go embed folder
    cmds:
      - pnpm -w run build
      - mkdir -p {{.WEBASSETS}}
      # The glob skips dotfiles, so the committed .gitkeep stays.
      - rm -rf {{.WEBASSETS}}/*
      - cp -r dist/. {{.WEBASSETS}}/

  # SHARD=i/n runs one shard of the plan e2e/shard-plan.mjs makes from e2e/durations.json (CI: one
  # runner per shard), instead of Playwright's `--shard`, which splits by count, not by time. The
  # blob report of a shard is then named report-<i>.zip, so the gate can merge all of them.
  e2e:
    desc: >-
      Playwright keyboard suite (P-15) against a fresh server on :8097 with a temporary config dir;
      expects server/bin/slouchcat with the current web build embedded (run `task build` first).
      SHARD=i/n runs one shard planned by duration (e2e/shard-plan.mjs)
    deps: [tokens]
    env:
      SLOUCHCAT_E2E_SHARD: "{{.SHARD}}"
    cmds:
      - |
        set -eu
        if [ -n "{{.SHARD}}" ]; then
          list="node_modules/.playwright-shards/shard-$(echo '{{.SHARD}}' | tr / -).txt"
          mkdir -p node_modules/.playwright-shards
          node e2e/shard-plan.mjs --shard '{{.SHARD}}' --out "$list" -- {{.CLI_ARGS}}
          '{{.HEAVY}}' pnpm exec playwright test --test-list "$list" {{.CLI_ARGS}}
        else
          '{{.HEAVY}}' pnpm exec playwright test {{.CLI_ARGS}}
        fi

  # `task e2e:quick` in the root builds first; this half only runs Playwright.
  e2e:quick:
    desc: Chromium only, no retries, stop at the first failure, port E2E_PORT (8097); specs after --
    deps: [tokens]
    env:
      SLOUCHCAT_E2E_PORT: '{{.E2E_PORT | default "8097"}}'
    cmds:
      - pnpm exec playwright test --project=chromium --retries=0 --max-failures=1 {{.CLI_ARGS}}

  e2e:parallel:
    desc: E2E_SHARDS (3) shards side by side from port E2E_PORT (8097) in steps of 20, one merged report
    deps: [tokens]
    cmds:
      - >-
        '{{.HEAVY}}' node e2e/parallel.mjs --shards {{.E2E_SHARDS | default "3"}}
        --base-port {{.E2E_PORT | default "8097"}} -- {{.CLI_ARGS}}

  # The web half of `task check:fast`: ESLint (with its cache), stylelint and Prettier on the files
  # changed against BASE (default HEAD: the working tree, untracked files included), both tsc
  # projects, and Vitest on the tests related to the changed sources. `task ci:web` stays the
  # whole check.
  check:fast:
    desc: Fast web checks of the changed files (BASE=HEAD); ESLint cached, tsc, vitest related
    deps: [tokens]
    vars:
      BASE: '{{.BASE | default "HEAD"}}'
    cmds:
      - |
        set -eu
        changed=$( { git diff --name-only --relative --diff-filter=d '{{.BASE}}' -- . ;
          git ls-files --others --exclude-standard -- . ; } | sort -u )
        code=$(printf '%s\n' "$changed" | grep -E '\.(ts|tsx|js|mjs)$' || true)
        css=$(printf '%s\n' "$changed" | grep -E '^src/.*\.css$' || true)
        pretty=$(printf '%s\n' "$changed" | grep -E '\.(ts|tsx|js|mjs|json|css|md|yaml|yml|html)$' || true)
        src=$(printf '%s\n' "$changed" | grep -E '^src/.*\.(ts|tsx)$' || true)
        echo "changed in web/: $(printf '%s\n' "$changed" | grep -c . || true) files"
        if [ -n "$code" ]; then
          pnpm exec eslint --cache --cache-location node_modules/.cache/eslint/ --no-warn-ignored \
            --max-warnings 0 $code
        fi
        if [ -n "$css" ]; then pnpm exec stylelint --max-warnings 0 $css; fi
        if [ -n "$pretty" ]; then pnpm -w exec prettier --check --ignore-unknown $(printf 'web/%s ' $pretty); fi
        pnpm exec tsc --noEmit -p tsconfig.json
        pnpm exec tsc --noEmit -p tsconfig.node.json
        if [ -n "$src" ]; then pnpm exec vitest related --run $src; fi

  # Self-test of the shard plan: every test in exactly one shard, as Playwright reads the lists.
  e2e:shards:check:
    desc: Check that the e2e shards together hold every test exactly once (E2E_SHARDS, default the CI count)
    cmds:
      - node e2e/shard-plan.mjs --check --shards {{.E2E_SHARDS | default .CI_E2E_SHARDS}}

  # Downloads the blob reports of CI runs and rewrites e2e/durations.json from them; review and
  # commit the result. RUNS: space-separated run ids, e.g. the last two green runs on main.
  e2e:durations:
    desc: Refresh e2e/durations.json from the blob reports of CI runs (RUNS="<id> <id>", needs gh)
    requires:
      vars: [RUNS]
    cmds:
      - |
        set -eu
        dir=$(mktemp -d)
        trap 'rm -rf "$dir"' EXIT
        for run in {{.RUNS}}; do
          gh run download "$run" -p 'e2e-blob-*' -D "$dir/$run"
        done
        node e2e/durations.mjs "$dir"/*
        node e2e/shard-plan.mjs --shards {{.CI_E2E_SHARDS}}

  storybook:
    desc: Storybook dev server for web/src/ui on http://localhost:6006
    deps: [tokens]
    cmds:
      - pnpm run storybook

  storybook:build:
    desc: Build the static Storybook of web/src/ui into web/storybook-static
    deps: [tokens]
    cmds:
      - pnpm run storybook:build

  storybook:test:
    desc: >-
      Screenshot every story and compare with the baselines in e2e-storybook/__screenshots__
      (maxDiffPixelRatio 0.001, A-2); runs Chromium in the Playwright Docker image
    deps: [storybook:build]
    cmds:
      - "'{{.HEAVY}}' {{.PLAYWRIGHT_DOCKER}} node_modules/.bin/playwright test -c storybook.config.ts {{.CLI_ARGS}}"

  storybook:update:
    desc: Rewrite the screenshot baselines after an intended visual change (review the PNG diff)
    deps: [storybook:build]
    cmds:
      - "'{{.HEAVY}}' {{.PLAYWRIGHT_DOCKER}} node_modules/.bin/playwright test -c storybook.config.ts --update-snapshots {{.CLI_ARGS}}"

  icons:
    desc: Regenerate the PWA PNG icons in public/icons from public/icon.svg (ffmpeg)
    deps: [tokens]
    cmds:
      - pnpm run icons

  dev:
    desc: Vite dev server; /api is proxied to the Go server on :8096
    deps: [tokens]
    cmds:
      - pnpm exec vite

  ci:
    desc: Everything CI runs for the web side
    cmds:
      - pnpm -w install --frozen-lockfile
      - task: gen
      - task: lint
      - task: test
      - task: build
