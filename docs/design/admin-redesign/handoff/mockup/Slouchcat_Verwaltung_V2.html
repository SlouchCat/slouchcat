function render(){let inner=s.page==='overview'?overview():s.page==='media'?media():s.page==='people'?people():s.page==='curation'?curation():s.page==='automation'?automation():system();root.innerHTML=`<div class="app ${s.nav?'navopen':''}"><aside class="side"><div class="brand">${logo()}<div><div class="brandname">Slouchcat</div><div class="brandtag">CONTROL CENTER</div></div></div><div class="group-label">VERWALTUNG</div>${Object.entries(P).map(([id,p])=>`<button class="nav-btn ${s.page===id?'active':''}" ${to(id,'')}>${ic(p.icon)}<span>${p.title}</span>${s.page===id?`<span style="margin-left:auto;color:var(--accent)">${ic('chev',13)}</span>`:''}</button>`).join('')}<div class="sidefoot"><div class="avatar">SC</div><div class="tiny">Administrator<small>Interaktiver Entwurf</small></div></div></aside><main class="main"><header class="topbar"><div class="row"><button class="iconbtn mobile-only" data-do="nav">${ic('menu')}</button><div class="crumb"><span>Verwaltung</span>${ic('chev',12)}<span>${P[s.page].title}${s.tab?' / '+s.tab:''}</span></div></div><div class="tools"><span class="smallstatus"><span class="dot"></span> Demo-Modus</span><button class="search-btn" data-do="search">${ic('search',15)} <span>Bereich suchen</span><kbd>⌘ K</kbd></button><button class="iconbtn" data-do="help" aria-label="Informationen">${ic('spark',16)}</button></div></header><div class="content">${tabs()}${inner}</div></main></div><div class="demo-banner">INTERAKTIVES KONZEPT · Beispieldaten · Keine Verbindung zu deinem Slouchcat-Server</div>${s.details?modal():''}${s.search?searchModal():''}${s.toast?`<div class="message">${s.toast}</div>`:''}`;}
function toast(message){s.toast=message;render();}
function modal(){let [type,name]=s.details.split(':');let title=name||'Details';if(type==='library')return `<div class="overlay" data-overlay><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><div class="eyebrow">BIBLIOTHEKEN / DETAILS</div><h2>${title}</h2></div><button class="iconbtn" data-do="close">${ic('close')}</button></div><p>Konzentrierte Detailansicht statt einer langen Bibliotheksseite. Konfiguration und Aktionen sind klar getrennt.</p><label class="input-label">Bibliothek</label><input class="field" value="${title}"/><label class="input-label">Medienordner</label><input class="field" value="/media/${title}"/><div class="setting"><div><strong>Dateien überwachen</strong><p>Änderungen automatisch erkennen.</p></div><button class="toggle ${s.controls['Dateien überwachen']?'on':''}" data-toggle="Dateien überwachen"></button></div><div class="row" style="margin-top:21px">${btn('Scan starten','scan','','')}${btn('Speichern','save','','secondary')}</div></div></div>`;
if(type==='job'){let j=s.jobs.find(x=>x.name===name)||s.jobs[0];return `<div class="overlay" data-overlay><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div><div class="eyebrow">AUTOMATISIERUNG / JOB</div><h2>${j.name}</h2></div><button class="iconbtn" data-do="close">${ic('close')}</button></div><p>Nur die Einstellungen dieses Jobtyps, inklusive Zeitplan und letzter Läufe.</p><div class="row between">${pill(j.status,j.status==='Fehler'?'red':'orange')}<span class="muted tiny">${j.type}</span></div><label class="input-label">Zeitplan</label><select class="field" data-field="schedule"><option>${j.interval}</option><option>Alle 15 Minuten</option><option>Alle 6 Stunden</option><option>Täglich</option><option>Manuell</option></select><div class="setting"><div><strong>Aktueller Status</strong><p>${j.status}</p></div><button class="btn sm secondary" data-job-pause="${j.name}">${j.status==='Pausiert'?'Fortsetzen':'Pausieren'}</button></div><div class="row" style="margin-top:19px">${btn('Jetzt ausführen','run-job','','')}${btn('Zeitplan speichern','save','','secondary')}</div></div></div>`;}

function searchModal(){const items=Object.entries(P).flatMap(([id,p])=>[{page:id,tab:'',label:p.title},...(SUB[id]||[]).map(tab=>({page:id,tab,label:tab}))]);const results=items.filter(x=>[x.label,P[x.page].title].join(' ').toLowerCase().includes((s.filter||'').toLowerCase())).slice(0,12);return `<div class="overlay" data-overlay><div class="modal search-modal" role="dialog" aria-label="Verwaltungsbereich suchen" aria-modal="true"><input id="global-search" placeholder="Suchen: Bibliotheken, Jobs, Sicherungen …" value="${s.filter||''}" autocomplete="off"><div id="search-results">${searchResults(results)}</div><div style="padding:10px;color:var(--muted);font-size:11px">Esc zum Schliessen · Einträge öffnen per Klick</div></div></div>`}

const allSearch=Object.entries(P).flatMap(([id,p])=>[{page:id,tab:'',label:p.title},...(SUB[id]||[]).map(tab=>({page:id,tab,label:tab}))]);
root.addEventListener('click',e=>{const el=e.target.closest('button');if(!el){if(e.target.hasAttribute('data-overlay')){s.details=null;s.search=false;render()}return};if(el.dataset.go){goto(el.dataset.go,el.dataset.sub);return}if(el.dataset.detail){s.details=el.dataset.detail;render();return}if(el.dataset.toggle){let label=el.dataset.toggle;s.controls[label]=!s.controls[label];s.draft=true;render();return}if(el.dataset.homeToggle){s.home[Number(el.dataset.homeToggle)].on=!s.home[Number(el.dataset.homeToggle)].on;s.draft=true;render();return}if(el.dataset.move){let [a,b]=el.dataset.move.split(':').map(Number),to=a+b;if(to>=0&&to<s.home.length){[s.home[a],s.home[to]]=[s.home[to],s.home[a]];s.draft=true;render()}return}if(el.dataset.days){s.statDays=el.dataset.days;render();return}if(el.dataset.jobFilter){s.filter=el.dataset.jobFilter;render();return}if(el.dataset.jobPause){let j=s.jobs.find(j=>j.name===el.dataset.jobPause);j.status=j.status==='Pausiert'?'Geplant':'Pausiert';toast(`Job «${j.name}» im Mockup ${j.status==='Pausiert'?'pausiert':'fortgesetzt'}.`);return}const action=el.dataset.do;if(!action)return;
switch(action){case 'search':s.search=true;s.filter='';render();setTimeout(()=>document.getElementById('global-search')?.focus(),10);break;case 'close':s.details=null;s.search=false;render();break;case 'nav':s.nav=!s.nav;render();break;case 'go-attention':goto('automation','Hintergrundjobs');break;case 'show-failed':s.filter='Fehler';render();break;case 'help':toast('Neues Verwaltungskonzept: Alle Zahlen und Aktionen sind Beispieldaten.');break;case 'save':s.draft=false;s.details=null;toast('Änderungen nur im Mockup gespeichert – kein Serverzugriff.');break;case 'refresh':toast('Beispielansicht aktualisiert. Keine Live-Daten geladen.');break;case 'run-job':{let j=s.jobs.find(x=>s.details?.endsWith(':'+x.name));if(j){j.status='Läuft';j.pct=12} s.details=null;toast('Job im Mockup gestartet – keine echte Ausführung.');break}case 'scan':s.details=null;toast('Bibliotheksscan simuliert – keine Änderung am Server.');break;case 'preview-home':toast('Die Vorschau wird rechts neben der Reihenfolge aktualisiert.');break;case 'restart':toast('Server-Neustart nur simuliert.');break;default:if(['new-backup','restore-backup','check-update','invite','add-library','add-podcast','add-radio','show-radio','edit-spotlight','add-rule','add-collection','new-message','demo-test'].includes(action)){s.details=`${action}:`+({'new-backup':'Sicherung erstellen','restore-backup':'Datei wiederherstellen','check-update':'Update-Prüfung','invite':'Konto einladen','add-library':'Bibliothek hinzufügen','add-podcast':'Feed hinzufügen','add-radio':'Sender hinzufügen','show-radio':'Senderkatalog','edit-spotlight':'Spotlight bearbeiten','add-rule':'Empfehlungsregel','add-collection':'Sammlung erstellen','new-message':'Mitteilung erstellen','demo-test':'Verbindung testen'}[action]);render();break}}});
root.addEventListener('input',e=>{if(e.target.id==='global-search'){s.filter=e.target.value;document.getElementById('search-results').innerHTML=searchResults(allSearch.filter(x=>[x.label,P[x.page].title].join(' ').toLowerCase().includes(s.filter.toLowerCase())).slice(0,12));}else if(e.target.hasAttribute('data-filter')){s.filter=e.target.value;const input=e.target;const begin=input.selectionStart;render();const next=root.querySelector('[data-filter]');next?.focus();next?.setSelectionRange(begin,begin);}else if(e.target.hasAttribute('data-field'))s.draft=true;});

return `<section class="feature-suite"><div class="feature-overview"><div class="feature-head"><div><div class="feature-top">${ic('list',16)}<h2>Optionen & Arbeitsabläufe</h2></div><p>Weitere Einstellmöglichkeiten und Vorgänge dieses Bereichs. Öffne jeden Eintrag, um das Detailkonzept auszuprobieren.</p></div><span class="feature-count">${data.length} Bereiche</span></div><div class="feature-grid">${data.map((f,i)=>`<button class="feature-card" data-detail="feature:${encodeURIComponent(tab)}:${i}" aria-label="${escapeHtml(f.title)} öffnen"><span><strong>${escapeHtml(f.title)}</strong><small>${escapeHtml(f.subtitle)}</small></span><span class="feature-chevron">${ic('chev',16)}</span></button>`).join('')}</div><div class="scope-note">Prototyp: Alle Eingaben, Tests und Aktionen bleiben lokal. Keine Verbindung zur Slouchcat-API. Unterfunktionen sind nach Quellcodebestand strukturiert, aber noch nicht vollständig gegen jeden API-Fall abgenommen.</div></div></section>`}
function featureFields(){return '';}
function featureModal(){let bits=s.details.split(':');let tab=decodeURIComponent(bits[1]||'');let idx=Number(bits[2]);let f=FEATURE_SPEC[tab]?.[idx];if(!f)return originalModal();let controls=f.fields.map((x,i)=>{
let id=`feature-field-${i}`;let key=`${tab}:${idx}:${i}`;let value=s.featureDraft?.[key];if(value===undefined)value=x[2];
if(x[0]==='switch')return `<label class="feature-check"><input type="checkbox" data-feature-key="${escapeHtml(key)}" ${value?'checked':''}><span>${escapeHtml(x[1])}</span></label>`;
if(x[0]==='textarea')return `<div class="feature-field"><label for="${id}">${escapeHtml(x[1])}</label><textarea id="${id}" data-feature-key="${escapeHtml(key)}">${escapeHtml(value)}</textarea></div>`;
if(x[0]==='select')return `<div class="feature-field"><label for="${id}">${escapeHtml(x[1])}</label><select id="${id}" data-feature-key="${escapeHtml(key)}">${x[2].map(opt=>`<option value="${escapeHtml(opt)}" ${opt===value?'selected':''}>${escapeHtml(opt)}</option>`).join('')}</select></div>`;
return `<div class="feature-field"><label for="${id}">${escapeHtml(x[1])}</label><input id="${id}" type="${x[0]==='number'?'number':'text'}" data-feature-key="${escapeHtml(key)}" value="${escapeHtml(value)}"></div>`;
}).join('');return `<div class="overlay" data-overlay><div class="modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(f.title)}"><div class="modal-head"><div><div class="feature-detail-label">${escapeHtml(tab)} / OPTION ${String(idx+1).padStart(2,'0')}</div><h2>${escapeHtml(f.title)}</h2></div><button class="iconbtn" data-do="close" aria-label="Schliessen">${ic('close')}</button></div><p>${escapeHtml(f.subtitle)}</p>${controls}<div class="feature-warning">${ic('warn',16)}${f.actions.some(a=>/lösch|entfern|wiederher|neustart|zusammenführ/i.test(a))?'Gefährliche Aktionen benötigen in der echten Anwendung eine ausdrückliche Bestätigung.':'Eingaben und Aktionen sind Demo-Simulationen; sie werden nicht an einen Server gesendet.'}</div><div class="feature-actions">${f.actions.map(a=>`<button data-feature-action="${escapeHtml(a)}">${escapeHtml(a)}</button>`).join('')}</div><div class="feature-source">Quelle: web/src/features/admin/${escapeHtml(f.source||'')} </div></div></div>`}
media=function(){if(s.tab===extraTab){return `${heading('Hörbuch-Quellen','Quellen, Audnexus, Google Books und Matching für Hörbücher getrennt von den Bibliotheken.')}${workspace(extraTab)}`;}return originalMedia()+workspace(s.tab)};
people=function(){return originalPeople()+workspace(s.tab)};
curation=function(){return originalCuration()+workspace(s.tab)};
automation=function(){return originalAutomation()+workspace(s.tab)};
system=function(){return originalSystem()+workspace(s.tab)};
modal=function(){if(s.details?.startsWith('feature:'))return featureModal();return originalModal()};
const extraCoverage=()=>`<details class="coverage"><summary>Funktionsabdeckung: 19 bestehende Hauptseiten und zusätzliche Unterseiten ansehen</summary><div class="feature-overview"><table class="map-table"><thead><tr><th>GitHub-Seite</th><th>Neue Position</th></tr></thead><tbody>${COVERAGE_MAP.map(([key,path,where])=>`<tr><td class="mono">${escapeHtml(path)}</td><td>${escapeHtml(where)}</td></tr>`).join('')}</tbody></table><div class="coverfoot">Die Zuordnung der 19 Hauptrouten stammt aus sections.ts. Zusätzliche Unterseiten wie Podcastdetails und Hörbuch-Quellen sind im Mockup thematisch integriert. Eine vollständige Funktionsabnahme erfolgt erst nach gemeinsamem Feinschliff.</div></div></details>`;
overview=function(){return originalOverview()+extraCoverage()};
// Media source page is covered by the nested AudiobookSourcesPage, reachable via an extra tab.
FEATURE_SPEC[extraTab]=FEATURE_SPEC['Bibliotheken'].filter(f=>f.title==='Hörbuch-Quellen').map(f=>({...f}));
root.addEventListener('input',e=>{const input=e.target;if(!input.dataset.featureKey)return;s.featureDraft=s.featureDraft||{};s.featureDraft[input.dataset.featureKey]=input.type==='checkbox'?input.checked:input.value;});
root.addEventListener('change',e=>{const input=e.target;if(!input.dataset.featureKey)return;s.featureDraft=s.featureDraft||{};s.featureDraft[input.dataset.featureKey]=input.type==='checkbox'?input.checked:input.value;});
root.addEventListener('click',e=>{const b=e.target.closest('button[data-feature-action]');if(!b)return;const action=b.dataset.featureAction;if(/löschen|entfernen|wiederherstellen|neustart|zusammenführen/i.test(action)){if(!window.confirm(`Nur Mockup: «${action}» simulieren? Auf dem Server wird nichts verändert.`))return;}s.details=null;toast(`Demo: «${action}» wurde simuliert. Keine Serveränderung.`);});

s.tab='';render();
})();
</script></body></html>
