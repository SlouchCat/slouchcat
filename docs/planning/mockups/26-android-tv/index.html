<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slouchcat TV-App · Mockup Konzept 26</title>
<link rel="stylesheet" href="css/app.css?v=2">
<link rel="stylesheet" href="css/browse.css?v=2">
<link rel="stylesheet" href="css/media.css?v=2">
</head>
<body>
<header id="tools" aria-label="Mockup-Leiste">
  <span class="mk">Mockup</span>
  <strong>Slouchcat · TV-App</strong>
  <label class="jump">Seite
    <select id="jump" aria-label="Zu einer Seite springen"></select>
  </label>
  <button type="button" class="tbtn" data-tool="reset">Neu starten</button>
  <button type="button" class="tbtn" data-tool="remote" aria-pressed="true">Fernbedienung</button>
</header>
<main id="stage">
  <div id="room">
    <div id="tvset">
      <div id="bezel">
        <div id="fit">
          <div id="screen">
            <div id="app">
              <div id="art" aria-hidden="true"></div>
              <div id="view" data-scroll></div>
              <nav id="rail" data-row="rail" data-enter aria-label="Navigation"></nav>
              <div id="tvclock" aria-hidden="true"></div>
            </div>
            <div id="overlays"></div>
            <div id="toast" role="status" aria-live="polite"></div>
            <div id="off" hidden></div>
          </div>
        </div>
        <span class="led" aria-hidden="true"></span>
      </div>
      <div id="stand" aria-hidden="true"><i></i></div>
    </div>
    <p id="keys">Tastatur: Pfeiltasten, Enter, Backspace oder Esc für Zurück, Leertaste für Wiedergabe/Pause</p>
  </div>
  <aside id="remote" aria-label="Fernbedienung">
    <span class="rc-ir" aria-hidden="true"></span>
    <div class="rc-pad">
      <button type="button" class="rc-d up" data-rc="up" aria-label="Hoch"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="m5 15 7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="rc-d left" data-rc="left" aria-label="Links"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="rc-ok" data-rc="ok" aria-label="OK">OK</button>
      <button type="button" class="rc-d right" data-rc="right" aria-label="Rechts"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="rc-d down" data-rc="down" aria-label="Runter"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="m5 9 7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="rc-keys">
      <span class="rc-b"><button type="button" data-rc="back" aria-label="Zurück"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><small>Zurück</small></span>
      <span class="rc-b"><button type="button" data-rc="home" aria-label="Start"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg></button><small>Start</small></span>
      <span class="rc-b"><button type="button" data-rc="play" aria-label="Wiedergabe/Pause"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 5v14l9-7z" fill="currentColor"/><path d="M16 5v14M21 5v14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button><small>Wiedergabe/Pause</small></span>
    </div>
    <span class="rc-brand" aria-hidden="true">slouchcat</span>
  </aside>
</main>
<script src="../27-android-handy/js/data.js?v=2"></script>
<script src="js/core.js?v=2"></script>
<script src="js/home.js?v=2"></script>
<script src="js/setup.js?v=2"></script>
<script src="js/browse.js?v=2"></script>
<script src="js/media.js?v=2"></script>
<script src="js/boot.js?v=2"></script>
</body>
</html>
