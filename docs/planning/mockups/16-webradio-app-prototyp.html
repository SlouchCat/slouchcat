<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Slouchcat Webradio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Concept 16 prototype: switches on top, then the viewer app (sidebar, header, page) in a desktop or
     phone frame. Three structurally different radio pages share one state, one mini player and one
     «Jetzt läuft» view. Slouchcat tokens, dark only; the accent follows the profile (ember, teal). */
  :root {
    color-scheme: dark;
    --bg-base: #0b0c10; --bg-elevated: #13151b; --overlay: #0b0c10d9; --overlay-light: #0b0c1033;
    --surface-1: #16181f; --surface-2: #1d2029; --surface-3: #262a35;
    --text-primary: #f3f3f5; --text-secondary: #b6b9c4; --text-muted: #9095a3;
    --border-subtle: #ffffff14; --border-strong: #ffffff2e; --focus: #f3f3f5;
    --scrim-solid: #0b0c10f5; --scrim-strong: #0b0c10cc; --scrim-clear: #0b0c1000;
    --accent: #e8794a; --on-accent: #1c0d06; --accent-soft: #e8794a33;
    --success: #5fcf8f; --warning: #e8b65a; --danger: #f2777a; --live: #f2777a;
    --ember: #e8794a; --teal: #45c2b1; --on-teal: #04191a;
    /* eight muted tones for generated station tiles and covers */
    --tile-1: #3b5b7a; --tile-2: #7a4141; --tile-3: #4f7a5e; --tile-4: #7a6a3b;
    --tile-5: #5b5e72; --tile-6: #2f6a6a; --tile-7: #7f3e5e; --tile-8: #45508a;
    /* backgrounds of the few "Logo vom Sender" tiles */
    --own-ring: #101216; --own-wave: #1d3550; --own-fip: #e9a3bd; --own-on-fip: #2a1020;
    --own-kexp: #050505; --own-sun: #f0c27a; --own-on-sun: #3a2208; --own-stripes: #1c2029;
    --font: system-ui, -apple-system, "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px; --r-full: 999px;
    --gutter: 32px; --side: 232px; --ease: cubic-bezier(.2, 0, 0, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg-base); color: var(--text-primary); font-family: var(--font); font-size: 15px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 48px; line-height: 1.45;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg { flex: none; }
  .wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 14px; }
  .intro h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -0.02em; text-wrap: balance; }
  .intro p { margin: 0; color: var(--text-secondary); max-width: 80ch; font-size: .9rem; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .group > span { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
  .seg { display: inline-flex; flex-wrap: wrap; background: var(--surface-1); border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { font-size: .82rem; color: var(--text-secondary); background: transparent; border: 0; border-radius: 999px; padding: 6px 12px; }
  .seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text-primary); }
  .seg button:hover { color: var(--text-primary); }
  .vdesc { margin: 0; font-size: .86rem; color: var(--text-secondary); min-height: 1.3em; }
  .vdesc b { color: var(--text-primary); font-weight: 600; }

  /* ---------- frame + shell ---------- */
  .frame { position: relative; background: var(--bg-base); border: 1px solid var(--border-subtle); border-radius: 14px; overflow: hidden; width: 100%; margin-inline: auto; height: 820px; }
  .frame.phone { max-width: 390px; height: 800px; border-radius: 28px; border-color: var(--border-strong); }
  .app { position: absolute; inset: 0; display: grid; grid-template-columns: var(--side) minmax(0, 1fr); }
  .app.ph { grid-template-columns: minmax(0, 1fr); --gutter: 16px; }
  .side { background: var(--bg-elevated); border-right: 1px solid var(--border-subtle); padding: 12px 10px; display: flex; flex-direction: column; overflow-y: auto; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 8px 10px 14px; font-weight: 700; letter-spacing: -0.02em; font-size: 1.12rem; white-space: nowrap; }
  .brand.sm { padding: 0; font-size: 1rem; }
  .cat { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); display: inline-grid; place-items: center; color: var(--on-accent); font-size: 13px; font-weight: 800; flex: none; }
  .nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .ni { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: var(--r-md); color: var(--text-secondary); font-weight: 500; width: 100%; background: none; border: 0; text-align: left; white-space: nowrap; }
  .ni svg { width: 18px; height: 18px; }
  .ni:hover { background: var(--surface-2); color: var(--text-primary); }
  .ni[aria-current="page"] { background: var(--surface-3); color: var(--text-primary); }
  .ni .cnt, .ni .eq { margin-left: auto; }
  .ni .dot { width: 18px; display: inline-grid; place-items: center; } .ni .dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
  .ng { padding: 16px 12px 4px; font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
  .cnt { font-size: .78rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; min-height: 16px; }
  .foot { border-top: 1px solid var(--border-subtle); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
  .main { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; }
  .hdr { height: 60px; display: flex; align-items: center; gap: 8px; padding: 0 var(--gutter); border-bottom: 1px solid var(--border-subtle); }
  .ph .hdr { padding: 0 8px 0 4px; background: var(--bg-elevated); }
  .hsearch { display: flex; align-items: center; gap: 10px; min-height: 38px; width: min(420px, 50%); padding: 0 14px; background: var(--surface-2); border: 0; border-radius: var(--r-full); color: var(--text-muted); font-size: .9rem; }
  .hsearch svg { width: 16px; height: 16px; }
  .grow { flex: 1; }
  .ib { width: 40px; height: 40px; border-radius: 50%; background: none; border: 0; color: var(--text-primary); display: inline-grid; place-items: center; flex: none; }
  .ib:hover { background: var(--surface-2); } .ib svg { width: 20px; height: 20px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: .85rem; margin-left: 4px; }
  .scroll { overflow-y: auto; overflow-x: hidden; min-height: 0; padding: 20px var(--gutter) 120px; }
  .pg { display: grid; gap: 28px; min-width: 0; }
  .pghead h1 { margin: 0; font-size: 1.7rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
  .pghead p { margin: 4px 0 0; color: var(--text-muted); font-size: .88rem; }
  .sec { display: grid; gap: 12px; min-width: 0; }
  .sh { display: flex; align-items: baseline; gap: 10px; }
  .sh h2 { margin: 0; font-size: 1.08rem; font-weight: 650; letter-spacing: -0.01em; }
  .more { margin-left: auto; background: none; border: 0; color: var(--text-secondary); font-size: .85rem; display: inline-flex; align-items: center; gap: 4px; border-radius: var(--r-sm); padding: 2px 4px; }
  .more svg { width: 14px; height: 14px; }
  .muted { color: var(--text-muted); }

  /* ---------- shared controls ---------- */
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: var(--r-full); min-height: 40px; padding: 0 18px; font-size: .9rem; background: var(--surface-3); color: var(--text-primary); font-weight: 500; }
  .btn.primary { background: var(--text-primary); color: var(--bg-base); font-weight: 650; }
  .btn.big { min-height: 48px; padding: 0 22px; font-size: 1rem; } .btn svg { width: 18px; height: 18px; }
  .linkbtn { background: none; border: 0; color: var(--text-secondary); text-decoration: underline; text-underline-offset: 3px; font-size: .84rem; padding: 4px 2px; border-radius: var(--r-sm); }
  .linkbtn:hover { color: var(--text-primary); }
  .search { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border: 1px solid var(--border-subtle); border-radius: var(--r-full); padding: 0 16px; min-height: 46px; max-width: 640px; }
  .search:focus-within { border-color: var(--border-strong); outline: 3px solid var(--focus); outline-offset: 2px; }
  .search svg { width: 18px; height: 18px; color: var(--text-muted); }
  .search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; font-size: .95rem; color: var(--text-primary); }
  .search input::placeholder { color: var(--text-muted); }
  .sortl { display: inline-flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--text-muted); white-space: nowrap; }
  select { background: var(--surface-2); border: 1px solid var(--border-subtle); border-radius: var(--r-full); padding: 7px 12px; font-size: .85rem; color: var(--text-primary); }
  .sw { display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; padding: 6px 2px; font-size: .86rem; color: var(--text-secondary); white-space: nowrap; border-radius: var(--r-sm); text-align: left; }
  .sw .knob { width: 34px; height: 20px; border-radius: 10px; background: var(--surface-3); position: relative; flex: none; transition: background .15s; }
  .sw .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--text-secondary); transition: transform .15s var(--ease); }
  .sw[aria-checked="true"] { color: var(--text-primary); }
  .sw[aria-checked="true"] .knob { background: var(--accent); } .sw[aria-checked="true"] .knob::after { transform: translateX(14px); background: var(--on-accent); }
  .cc { display: inline-block; font-size: .64rem; font-weight: 700; letter-spacing: .04em; padding: 0 5px; border-radius: 4px; border: 1px solid var(--border-strong); color: var(--text-secondary); line-height: 1.5; margin-right: 6px; vertical-align: 1px; }
  .new { position: absolute; top: 8px; left: 8px; font-size: .64rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; background: var(--text-primary); color: var(--bg-base); border-radius: 4px; padding: 1px 6px; }
  .active { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .achip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 8px 0 12px; border-radius: var(--r-full); background: var(--accent-soft); border: 1px solid var(--accent); color: var(--text-primary); font-size: .82rem; }
  .achip svg { width: 14px; height: 14px; }
  .tb { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }

  /* station logo tiles: generated initials or a "Logo vom Sender" */
  .lg { position: relative; display: grid; place-items: center; overflow: hidden; container-type: inline-size; border-radius: var(--r-md); flex: none; aspect-ratio: 1; color: var(--text-primary); }
  .lg.gen { background: radial-gradient(circle at 28% 22%, color-mix(in srgb, var(--lc) 100%, var(--text-primary) 14%), transparent 70%), linear-gradient(150deg, var(--lc), color-mix(in srgb, var(--lc) 38%, var(--bg-base))); }
  .lg.gen b { font-size: 30cqi; font-weight: 800; letter-spacing: -0.03em; line-height: 1; text-shadow: 0 1px 2px var(--scrim-strong); }
  .lg.own svg { width: 100%; height: 100%; }
  .own.ring { background: var(--own-ring); } .own.wave { background: var(--own-wave); } .own.fip { background: var(--own-fip); color: var(--own-on-fip); }
  .own.kexp { background: var(--own-kexp); } .own.sun { background: var(--own-sun); color: var(--own-on-sun); } .own.stripes { background: var(--own-stripes); }
  .lg.fill { width: 100%; border-radius: var(--r-lg); }
  .lg.m { width: 44px; border-radius: 8px; } .lg.r { width: 48px; } .lg.xs { width: 22px; border-radius: 5px; } .lg.f { width: 64px; }
  .lg.big { width: 132px; border-radius: var(--r-lg); box-shadow: 0 16px 40px var(--scrim-strong); } .lg.xl { width: 100%; border-radius: var(--r-xl); }
  .lg.xs b { font-size: 38cqi; }
  /* generated song covers */
  .cov { display: grid; place-items: center; aspect-ratio: 1; overflow: hidden; container-type: inline-size; background: radial-gradient(circle at 30% 25%, var(--c1), transparent 62%), radial-gradient(circle at 80% 85%, color-mix(in srgb, var(--c2) 80%, var(--text-primary) 10%), transparent 55%), linear-gradient(135deg, var(--c2), var(--bg-base)); }
  .cov b { font-size: 26cqi; font-weight: 800; letter-spacing: -0.04em; opacity: .9; text-shadow: 0 2px 6px var(--scrim-strong); }
  .cov.blur { position: absolute; inset: -60px; aspect-ratio: auto; filter: blur(48px) saturate(1.2); opacity: .75; }
  .cov.big { width: 132px; border-radius: var(--r-lg); box-shadow: 0 16px 40px var(--scrim-strong); flex: none; }
  .cov.xl { width: 100%; border-radius: var(--r-xl); box-shadow: 0 24px 60px var(--scrim-strong); }
  .cov.sm { width: 40px; border-radius: 6px; flex: none; } .cov.sm b { font-size: 34cqi; }
  /* equalizer marker of the playing station */
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
  .eq i { width: 3px; background: var(--accent); border-radius: 1px; height: 40%; animation: eq 1s var(--ease) infinite alternate; }
  .eq i:nth-child(2) { animation-delay: -.4s; height: 90%; } .eq i:nth-child(3) { animation-delay: -.7s; height: 60%; }
  .eq.still i { animation: none; }
  @keyframes eq { from { height: 25%; } to { height: 100%; } }
  .fresh { animation: fresh .5s var(--ease); }
  @keyframes fresh { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  /* favorite heart */
  .fav { width: 36px; height: 36px; border-radius: 50%; border: 0; background: none; color: var(--text-secondary); display: inline-grid; place-items: center; flex: none; }
  .fav svg { width: 19px; height: 19px; } .fav:hover { color: var(--text-primary); background: var(--surface-2); }
  .fav[aria-pressed="true"] { color: var(--accent); }
  .fav.ov { position: absolute; top: 6px; right: 6px; background: var(--scrim-strong); width: 32px; height: 32px; opacity: 0; transition: opacity .15s; }
  .fav.ov[aria-pressed="true"], .card:hover .fav.ov, .card:focus-within .fav.ov, .ftile .fav.ov, .ph .fav.ov { opacity: 1; }

  /* square cards (A, C, start page) */
  .grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px 14px; }
  .ph .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 10px; }
  .card { position: relative; min-width: 0; }
  .cb { display: grid; gap: 4px; width: 100%; padding: 0; border: 0; background: none; text-align: left; border-radius: var(--r-lg); }
  .cb .art { position: relative; display: block; border-radius: var(--r-lg); transition: transform .18s var(--ease), box-shadow .18s; }
  .cb:hover .art, .cb:focus-visible .art { transform: scale(1.04); box-shadow: 0 0 0 2px var(--text-primary), 0 12px 30px var(--scrim-strong); }
  .cb:focus-visible { outline: none; }
  .cb .art .eq { position: absolute; left: 8px; bottom: 8px; background: var(--scrim-strong); padding: 4px; height: 22px; border-radius: 6px; }
  .card.on .art { box-shadow: 0 0 0 2px var(--accent); }
  .cn { font-size: .88rem; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
  .cr { font-size: .76rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip { list-style: none; margin: 0 calc(var(--gutter) * -1); padding: 4px var(--gutter) 10px; display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: var(--gutter); scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .strip > li { flex: none; width: 140px; scroll-snap-align: start; }
  .ph .strip > li { width: calc((100% - 28px) / 3); }
  .tiles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .ph .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile { width: 100%; min-height: 76px; border: 0; border-radius: var(--r-lg); padding: 12px 14px; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; text-align: left; background: linear-gradient(135deg, var(--lc), color-mix(in srgb, var(--lc) 30%, var(--bg-base))); transition: transform .18s var(--ease); }
  .tile:hover { transform: translateY(-2px); }
  .tile b { font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; } .tile small { font-size: .76rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .tile.mood { min-height: 96px; } .tile.mood b { font-size: 1.15rem; }
  .empty { display: grid; justify-items: center; gap: 8px; text-align: center; padding: 48px 16px; background: var(--surface-1); border-radius: var(--r-lg); color: var(--text-secondary); }
  .empty svg { width: 36px; height: 36px; color: var(--text-muted); } .empty h3 { margin: 4px 0 0; color: var(--text-primary); font-size: 1.05rem; } .empty p { margin: 0 0 8px; max-width: 46ch; font-size: .88rem; }
  .hintbox { background: var(--surface-1); border-radius: var(--r-lg); padding: 14px 16px; color: var(--text-secondary); font-size: .88rem; }

  /* ---------- A: filter buttons + dropdowns ---------- */
  .quick { display: flex; gap: 8px; flex-wrap: wrap; }
  .qchip { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 16px; border-radius: var(--r-full); background: var(--surface-2); border: 1px solid transparent; font-weight: 550; font-size: .9rem; }
  .qchip svg { width: 16px; height: 16px; } .qchip:hover { background: var(--surface-3); }
  .qchip.ch { background: var(--surface-3); border-color: var(--border-strong); }
  .qchip .cc { margin: 0; }
  .qchip[aria-pressed="true"] { background: var(--text-primary); color: var(--bg-base); } .qchip[aria-pressed="true"] .cc { color: var(--bg-base); border-color: var(--bg-base); }
  .fbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ph .fbar { flex-wrap: nowrap; overflow-x: auto; margin: 0 calc(var(--gutter) * -1); padding: 2px var(--gutter) 6px; scrollbar-width: none; }
  .ddw { position: relative; flex: none; }
  .fbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px 0 14px; border-radius: var(--r-full); border: 1px solid var(--border-strong); background: none; font-size: .86rem; white-space: nowrap; }
  .fbtn svg { width: 14px; height: 14px; color: var(--text-muted); } .fbtn:hover { background: var(--surface-2); }
  .fbtn.set { border-color: var(--accent); background: var(--accent-soft); }
  .fbtn .n { font-variant-numeric: tabular-nums; font-weight: 700; }
  .dd { position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; width: 260px; max-height: 360px; display: grid; grid-template-rows: minmax(0, 1fr) auto; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: var(--r-lg); box-shadow: 0 20px 50px var(--scrim-strong); }
  .dd .opts { overflow-y: auto; padding: 6px; }
  .ddf { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px 8px; border-top: 1px solid var(--border-subtle); }
  .opt { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 38px; padding: 0 10px; border: 0; border-radius: 8px; background: none; text-align: left; font-size: .88rem; }
  .opt:hover { background: var(--surface-2); }
  .opt .n { margin-left: auto; color: var(--text-muted); font-variant-numeric: tabular-nums; font-size: .8rem; }
  .opt.zero { color: var(--text-muted); }
  .ckbox { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border-strong); display: inline-grid; place-items: center; flex: none; }
  .opt[aria-pressed="true"] .ckbox { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .ckbox svg { width: 12px; height: 12px; }

  /* sheets, drawer, shade (inside the frame) */
  .shade { position: absolute; inset: 0; background: var(--overlay); z-index: 40; border: 0; padding: 0; width: 100%; cursor: default; }
  .sheet { position: absolute; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 82%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--bg-elevated); border-radius: 20px 20px 0 0; border-top: 1px solid var(--border-strong); }
  .enter { animation: up .22s var(--ease); }
  .sheet.full { top: 0; max-height: none; border-radius: 0; border: 0; }
  @keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .shh { display: flex; align-items: center; gap: 8px; padding: 12px 8px 8px 20px; }
  .shh h2 { margin: 0; font-size: 1.1rem; flex: 1; }
  .shb { overflow-y: auto; padding: 0 12px 12px; min-height: 0; }

  const h = H[s.id] = { pool, i: hash(s.n) % pool.length, list: [] };

// ---------- render ----------
function isPhone() { return S.device === 'phone' || frame.getBoundingClientRect().width < 760; }
function fkey(el) {
  if (!el || !el.dataset) return null;
  const z = el.closest('[data-zone]')?.dataset.zone || '';
  if (el.dataset.a) return [z, el.dataset.a, el.dataset.id || '', el.dataset.k || '', el.dataset.v || ''].join('|');
  for (const n of ['search', 'sort', 'slider']) if (n in el.dataset) return `${z}|#${n}`;
  return null;
}
function findKey(key) { for (const el of frame.querySelectorAll('[data-a],[data-search],[data-sort],[data-slider]')) if (fkey(el) === key) return el; return null; }
function render() {
  const ae = document.activeElement, key = frame.contains(ae) ? fkey(ae) : null;
  const caret = ae && ae.dataset && 'search' in ae.dataset ? ae.selectionStart : null;
  const sc = $('#sc', frame), top = sc ? sc.scrollTop : 0, rows = {};
  frame.querySelectorAll('[data-row]').forEach(r => { rows[r.dataset.row] = r.scrollLeft; });
  frame.className = 'frame' + (S.device === 'phone' ? ' phone' : '');
  const ph = isPhone(), p = PROFILES[S.profile];
  frame.style.setProperty('--accent', p.acc); frame.style.setProperty('--on-accent', p.on);
  frame.style.setProperty('--accent-soft', `color-mix(in srgb, ${p.acc} 20%, transparent)`);
  const body = S.view === 'home' ? home() : { A: vA, B: vB, C: vC }[S.variant](ph);
  const sheet = S.ov.sheet ? (S.ov.sheet === 'all' ? sheetB() : sheetA()) : '';
  const drawer = S.ov.drawer && ph ? `<button type="button" class="shade" data-a="closeov" tabindex="-1" aria-label="Menü schliessen"></button><div class="drawer" role="dialog" aria-modal="true" aria-label="Menü" data-zone="drawer" data-trap><button type="button" class="ib" data-a="closeov" aria-label="Menü schliessen" data-autofocus>${I.x}</button><div class="brand"><span class="cat">S</span>Slouchcat</div>${navList()}</div>` : '';
  frame.innerHTML = `<div class="app${ph ? ' ph' : ''}">${ph ? '' : `<aside class="side" data-zone="side"><div class="brand"><span class="cat">S</span>Slouchcat</div>${navList()}</aside>`}
    <div class="main">${hdr(ph)}<div class="scroll" id="sc" data-zone="page">${body}</div>${mini()}${S.ov.np ? npView() : ''}</div>
    ${sheet}${drawer}${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}</div>`;
  const nsc = $('#sc', frame); nsc.scrollTop = top;
  frame.querySelectorAll('[data-row]').forEach(r => { if (rows[r.dataset.row]) r.scrollLeft = rows[r.dataset.row]; });
  if (S.toRes) { S.toRes = false; const res = $('#res', frame); if (res) nsc.scrollTop = res.offsetTop - 12; }
  let target = null;
  if (S.focusSel) { target = frame.querySelector(S.focusSel); S.focusSel = null; }
  else if (S.focusKey) { target = findKey(S.focusKey); S.focusKey = null; }
  else if (key) target = findKey(key);
  if (target) { target.focus({ preventScroll: true }); if (caret != null && target.setSelectionRange) target.setSelectionRange(caret, caret); }
  $('#vdesc').innerHTML = DESC[S.view === 'home' ? 'home' : S.variant];
  S.anim.clear();
}
function setTxt(el, txt) {
  if (el.textContent === txt) return;
  el.textContent = txt;
  if (!RM.matches) { el.classList.remove('fresh'); void el.offsetWidth; el.classList.add('fresh'); }
}
function setHtml(el, h) { if (el.dataset.h !== h) { el.dataset.h = h; el.innerHTML = h; } }
// Updates the live parts (titles, covers, offset) in place, without a full render.
function updateLive() {
  const o = S.player.offset;
  frame.querySelectorAll('[data-np]').forEach(el => { const s = BY[el.dataset.np]; if (s.meta) setTxt(el, npText(s)); });
  frame.querySelectorAll('[data-npt]').forEach(el => setTxt(el, cur(BY[el.dataset.npt]).t));
  frame.querySelectorAll('[data-npa]').forEach(el => setTxt(el, cur(BY[el.dataset.npa]).a));
  frame.querySelectorAll('[data-cover]').forEach(el => {
    const c = cur(BY[el.dataset.cover]), st = coverStyle(c);
    if (el.getAttribute('style') !== st) { el.setAttribute('style', st); const b = el.querySelector('b'); if (b) b.textContent = ini(c.a); }
  });
  frame.querySelectorAll('[data-off]').forEach(el => setHtml(el, offHtml()));
  frame.querySelectorAll('[data-slider]').forEach(el => { if (!S.drag) el.value = -o; el.setAttribute('aria-valuetext', offText(o)); });
  frame.querySelectorAll('[data-livebtn]').forEach(el => el.setAttribute('aria-pressed', String(o === 0)));
  frame.querySelectorAll('[data-hist]').forEach(el => setHtml(el, histHtml(BY[el.dataset.hist])));
}

// ---------- actions ----------
let toastTimer;
function toast(t) { S.toast = t; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = ''; render(); }, 2200); }
function openOv(kind, val, opener) { S.retKey = fkey(opener); S.ov[kind] = val; S.focusSel = '[data-autofocus]'; S.anim.add(kind); }
function closeOv() {
  const o = S.ov;
  if (o.np) o.np = false; else if (o.sheet) o.sheet = null; else if (o.drawer) o.drawer = false; else if (o.dd) o.dd = null; else return false;
  S.focusKey = S.retKey; return true;
}
function act(a, t) {
  const id = +t.dataset.id, k = t.dataset.k, v = t.dataset.v, p = S.player;
  switch (a) {
    case 'play':
      if (p.id === id) p.playing = !p.playing; else { if (!p.id) S.anim.add('mini'); p.id = id; p.playing = true; p.offset = 0; }
      break;
    case 'pp': p.playing = !p.playing; break;
    case 'live': p.offset = 0; p.playing = true; break;
    case 'fav': { const f = favs(); f.has(id) ? f.delete(id) : f.add(id); toast(f.has(id) ? `${BY[id].n} ist jetzt in Meine Sender` : `${BY[id].n} aus Meine Sender entfernt`); break; }
    case 'np': openOv('np', true, t); break;
    case 'npclose': case 'closeov': closeOv(); break;
    case 'fv': toggleFacet(k, v); break;
    case 'clearf': S.f[k].clear(); if (k === 'country') S.f.region.clear(); break;
    case 'rm':
      if (S.f[k]) toggleFacet(k, v); else if (k === 'meta') S.metaOnly = false; else if (k === 'fav') S.favOnly = false; else if (k === 'top') S.top = false; else if (k === 'q') S.q = '';
      break;
    case 'reset': resetAll(); break;
    case 'meta': S.metaOnly = !S.metaOnly; break;
    case 'quick':
      if (v === 'ch') { const on = S.f.country.size === 1 && S.f.country.has('CH'); S.f.country.clear(); S.f.region.clear(); if (!on) { S.f.country.add('CH'); S.toRes = S.variant === 'A' && t.classList.contains('more'); } }
      if (v === 'fav') S.favOnly = !S.favOnly;
      if (v === 'top') S.top = !S.top;
      break;
    case 'pick': resetAll(); S.f[k].add(v); S.toRes = true; break;
    case 'dd': S.ov.dd = S.ov.dd === k ? null : k; if (S.ov.dd) { S.retKey = fkey(t); S.focusSel = '.dd .opt'; } break;
    case 'sheet': openOv('sheet', k, t); break;
    case 'drawer': openOv('drawer', true, t); break;
    case 'prof': S.profile = S.profile === 'marco' ? 'lea' : 'marco'; S.favOnly = false; toast(`Profil ${PROFILES[S.profile].name}: eigene Meine Sender`); break;
    case 'nav':
      if (v === 'home' || v === 'radio') { S.view = v; S.ov.drawer = false; syncSeg(); $('#sc', frame) && ($('#sc', frame).scrollTop = 0); }
      else toast('Im Prototyp nicht verbunden');
      break;
    case 'stub': toast('Im Prototyp nicht verbunden'); break;
  }
  render();
}
frame.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (S.ov.dd && !e.target.closest('.ddw')) { S.ov.dd = null; if (!t) { render(); return; } }
  if (t && frame.contains(t)) act(t.dataset.a, t);
});
frame.addEventListener('input', e => {
  const el = e.target;
  if ('search' in el.dataset) { S.q = el.value; render(); }
  if ('slider' in el.dataset) { let o = -Number(el.value); if (o < 10) o = 0; S.player.offset = o; updateLive(); }
});
frame.addEventListener('change', e => { if ('sort' in e.target.dataset) { S.sort = e.target.value; render(); } });
frame.addEventListener('pointerdown', e => { if (e.target.dataset && 'slider' in e.target.dataset) S.drag = true; });
document.addEventListener('pointerup', () => { if (S.drag) { S.drag = false; updateLive(); } });
frame.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (closeOv()) { e.preventDefault(); render(); } return; }
  if (e.key !== 'Tab') return;
  const traps = frame.querySelectorAll('[data-trap]'), trap = traps[traps.length - 1];
  if (!trap) return;
  const f = [...trap.querySelectorAll('button:not([tabindex="-1"]), input, select, [tabindex="0"]')].filter(x => x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (!trap.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

// prototype switches above the frame
function syncSeg() { document.querySelectorAll('[data-seg]').forEach(g => g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(S[g.dataset.seg] === b.dataset.v)))); }
document.querySelectorAll('[data-seg]').forEach(g => g.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S[g.dataset.seg] = b.dataset.v;
  S.ov = { dd: null, sheet: null, drawer: false, np: false };
  syncSeg(); render();
}));
let lastPh = null;
addEventListener('resize', () => { const ph = isPhone(); if (ph !== lastPh) { lastPh = ph; render(); } });

// clock: paused playback falls behind live (max. 30 min buffer), titles change every 20 s
let sec = 0;
setInterval(() => {
  sec++;
  const p = S.player;
  if (p.id && !p.playing && p.offset < 1800) p.offset++;
  if (sec % 20 === 0) metaTick();
  if (p.id || sec % 20 === 0) updateLive();
}, 1000);

render(); lastPh = isPhone();
</script>

</body>
