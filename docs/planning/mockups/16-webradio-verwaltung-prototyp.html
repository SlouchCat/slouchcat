<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Slouchcat Radio-Verwaltung</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Slouchcat tokens (packages/design-tokens), profile accent "ember", admin compact density (concept 12, ADR 0020). Prototype only. */
:root {
  color-scheme: dark;
  --bg-base: #0b0c10; --bg-elevated: #13151b; --surface-1: #16181f; --surface-2: #1d2029; --surface-3: #262a35;
  --text-primary: #f3f3f5; --text-secondary: #b6b9c4; --text-muted: #9095a3;
  --border: #ffffff14; --border-strong: #ffffff24; --scrim: #0b0c10cc; --shadow: #00000080;
  --accent: #e8794a; --accent-hover: #f08a5d; --on-accent: #1c0d06;
  --danger: #f2777a; --success: #5fcf8f; --warning: #e8b65a;
  --tint-accent: color-mix(in srgb, var(--accent) 16%, transparent);
  --tint-success: color-mix(in srgb, var(--success) 14%, transparent);
  --tint-warning: color-mix(in srgb, var(--warning) 14%, transparent);
  --tint-danger: color-mix(in srgb, var(--danger) 14%, transparent);
  /* Generated logo tiles: muted hues from the accent families (teal, sky, rose, violet, amber). */
  --tile-1: #2f4f7f; --tile-2: #6b3f6e; --tile-3: #2f6b5e; --tile-4: #7a5a2a; --tile-5: #4b4f8f; --tile-6: #7a3b3b; --tile-7: #3d6b3a; --tile-8: #5a4a7a;
  --font: system-ui, -apple-system, "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ctl: 44px; --ctl-s: 36px; --row: 48px; --fs-ctl: 16px;
  --ease: cubic-bezier(.2, 0, 0, 1);
}
/* Compact sizes only with a mouse and from 768 px (concept 12, 5.1). */
@media (min-width: 768px) and (pointer: fine) { :root { --ctl: 32px; --ctl-s: 28px; --row: 40px; --fs-ctl: 14px; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg-base); color: var(--text-primary); font: 14px/1.45 var(--font); padding-block: 20px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, p, dl, dd { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:is(a, button, input, select, [tabindex], label:has(input)):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label:has(input[type=radio]:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.i { flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.num, td, .stat b { font-variant-numeric: tabular-nums; }
.mut { color: var(--text-muted); font-size: 12px; }
.sec { color: var(--text-secondary); }
.mono { font-family: var(--mono); font-size: 12px; }
.ell { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grow { flex: 1; }

/* Prototype intro (not part of the design) */
.intro { max-width: 82rem; margin: 0 auto 16px; display: flex; flex-direction: column; gap: 10px; }
.intro h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
.intro p { color: var(--text-secondary); max-width: 70rem; }
.vseg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 9px; background: var(--surface-1); border: 1px solid var(--border); }
.vseg button { min-height: var(--ctl-s); padding: 0 14px; border: 0; border-radius: 6px; background: transparent; color: var(--text-secondary); font-weight: 600; cursor: pointer; }
.vseg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text-primary); }
.vseg button b { color: var(--accent); margin-right: 6px; }
.vdesc { font-size: 13px; }

/* Desktop frame */
.frame { container: frame / inline-size; max-width: 82rem; margin: 0 auto; border: 1px solid var(--border-strong); border-radius: 12px; overflow: hidden; background: var(--bg-base); box-shadow: 0 24px 60px var(--shadow); }
.fbar { display: flex; align-items: center; gap: 12px; height: 32px; padding: 0 12px; background: var(--surface-1); border-bottom: 1px solid var(--border); }
.fbar i { width: 10px; height: 10px; border-radius: 5px; background: var(--surface-3); }
.addr { flex: 1; min-width: 0; max-width: 32rem; margin: 0 auto; padding: 2px 10px; border-radius: 6px; background: var(--bg-base); color: var(--text-muted); font: 12px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.apphead { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; border-bottom: 1px solid var(--border); }
.brand { display: inline-flex; align-items: center; gap: 8px; color: var(--text-primary); text-decoration: none; font-size: 17px; font-weight: 700; }
.brand span { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 800; }
.avatar { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 16px; background: var(--accent); color: var(--on-accent); font-weight: 700; }
.apphead .navtoggle { display: none; }
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 720px; }
.anav { background: var(--bg-elevated); border-right: 1px solid var(--border); padding: 12px 0 24px; }
.n { display: flex; align-items: center; gap: 10px; min-height: var(--ctl); padding: 0 12px 0 24px; color: var(--text-secondary); text-decoration: none; }
.n:hover { background: var(--surface-2); color: var(--text-primary); }
.n[aria-current="page"] { background: var(--surface-3); color: var(--text-primary); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.n.top { padding-left: 12px; }
.n .new { margin-left: auto; }
.gh { display: flex; align-items: center; gap: 8px; height: 28px; margin: 12px 0 4px; padding: 0 12px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--tint-accent); }
.page { container: page / inline-size; min-width: 0; max-width: 75rem; padding: 24px 32px 48px; }
@container frame (width < 768px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .anav { display: none; border-right: 0; border-bottom: 1px solid var(--border); }
  .anav.open { display: block; }
  .apphead .navtoggle { display: inline-flex; }
  .page { padding: 16px; }
}

/* Controls */
.b { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--ctl); padding: 0 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary); font-size: var(--fs-ctl); font-weight: 500; white-space: nowrap; cursor: pointer; flex: none; text-decoration: none; }
.b:hover { background: var(--surface-3); }
.b:disabled, .b[aria-disabled="true"] { opacity: .45; cursor: default; }
.bp { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.bp:hover { background: var(--accent-hover); }
.bs { min-height: var(--ctl-s); padding: 0 10px; font-size: 13px; }
.bi { width: var(--ctl); padding: 0; }
.bs.bi { width: var(--ctl-s); }
.bg { background: transparent; border-color: transparent; color: var(--text-secondary); }
.bg:hover { color: var(--text-primary); }
.dz { color: var(--danger); }
.in { min-height: var(--ctl); padding: 0 10px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--bg-base); color: var(--text-primary); font-size: var(--fs-ctl); min-width: 0; }
select.in { padding-right: 6px; }
.in[aria-invalid="true"] { border-color: var(--danger); }
.srch { position: relative; display: flex; }
.srch .i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
.srch .in { padding-left: 32px; width: 100%; }
.c { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; background: var(--surface-3); color: var(--text-secondary); font-size: 12px; font-weight: 500; white-space: nowrap; flex: none; }
.cs { background: var(--tint-success); color: var(--success); } .cw { background: var(--tint-warning); color: var(--warning); }
.cd { background: var(--tint-danger); color: var(--danger); } .ca { background: var(--tint-accent); color: var(--accent); }
.tg { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-primary); }
.d { display: inline-block; width: 8px; height: 8px; border-radius: 4px; flex: none; background: var(--text-muted); }
.d.ok { background: var(--success); } .d.wa { background: var(--warning); } .d.er { background: var(--danger); } .d.live { background: var(--accent); animation: pulse 1.6s var(--ease) infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .d.live, .spin { animation: none !important; } }
.spin { width: 14px; height: 14px; border-radius: 7px; border: 2px solid var(--surface-3); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
.lk, .au { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 10px; font-size: 11px; font-weight: 600; white-space: nowrap; flex: none; }
.lk { background: var(--tint-accent); color: var(--accent); }
.au { background: var(--surface-2); color: var(--text-muted); }
.sw { position: relative; width: 36px; height: 20px; border-radius: 10px; border: 0; background: var(--surface-3); cursor: pointer; flex: none; padding: 0; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 7px; background: var(--text-secondary); transition: transform 160ms var(--ease); }
.sw[aria-checked="true"] { background: var(--accent); }
.sw[aria-checked="true"]::after { transform: translateX(16px); background: var(--on-accent); }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 7px; background: var(--bg-base); border: 1px solid var(--border); }
.seg button { min-height: calc(var(--ctl) - 6px); padding: 0 12px; border: 0; border-radius: 5px; background: transparent; color: var(--text-secondary); font-size: var(--fs-ctl); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text-primary); font-weight: 600; }
.bar { display: block; height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width 240ms var(--ease); }
.bar.ok > i { background: var(--success); } .bar.wa > i { background: var(--warning); }

/* Page pattern S-2 / S-4 */
.ph { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-height: 32px; }
.ph h1 { font-size: 24px; line-height: 32px; font-weight: 600; outline: none; }
.help { width: 24px; min-height: 24px; height: 24px; border-radius: 12px; color: var(--text-muted); }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
.ph .acts { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.helptext { margin-top: 8px; max-width: 48rem; font-size: 13px; color: var(--text-secondary); }
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 16px; }
.stat { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 56px; padding: 6px 12px; border-left: 4px solid var(--surface-3); border-radius: 8px; background: var(--surface-1); min-width: 0; }
.stat b { font-size: 18px; font-weight: 700; line-height: 1.15; }
.stat span { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.ok { border-left-color: var(--success); } .stat.wa { border-left-color: var(--warning); } .stat.ac { border-left-color: var(--accent); }
.h2 { display: flex; align-items: center; gap: 8px; margin: 24px 0 12px; font-size: 16px; font-weight: 600; }
.h2 .mut { font-weight: 400; }
.h2 .acts { margin-left: auto; display: flex; gap: 8px; }
.panel { min-width: 0; padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-elevated); }
.panel h3, .ed h3 { font-size: 14px; font-weight: 600; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@container page (width < 860px) { .two { grid-template-columns: minmax(0, 1fr); } }

/* Tabs (S-14 ?tab=) */
.tabs { display: flex; gap: 4px; margin-top: 16px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.tab { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: var(--ctl); padding: 0 12px; border: 0; background: transparent; color: var(--text-secondary); font-weight: 600; white-space: nowrap; cursor: pointer; }
.tab:hover { color: var(--text-primary); }
.tab[aria-selected="true"] { color: var(--text-primary); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
.tab .c { height: 18px; padding: 0 6px; font-size: 11px; }

/* Dense tables (S-5) */
.tw { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-elevated); }
.t { width: 100%; border-collapse: collapse; table-layout: fixed; }
.t th { height: 32px; padding: 0 12px; text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t td { height: var(--row); padding: 0 12px; border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t tr:last-child td { border-bottom: 0; }
.t tbody tr:hover td { background: var(--surface-1); }
.t td.ra { text-align: right; overflow: visible; }
.t th.ra { text-align: right; }
.t .num { text-align: right; }
.t tr.off td:not(.ra) { opacity: .55; }
.cell { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; }
.cell .i { color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 16px 0 12px; }
.toolbar .srch { flex: 1 1 220px; max-width: 320px; }
.chk-l { display: inline-flex; align-items: center; gap: 8px; min-height: var(--ctl); cursor: pointer; color: var(--text-secondary); }
.chk-l input { accent-color: var(--accent); width: 16px; height: 16px; }
.tfoot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 8px 2px 0; }

/* Logo tiles: generated only, never real logos */
.lg { position: relative; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; flex: none; overflow: hidden; background: var(--tc); color: var(--text-primary); font-size: 11px; font-weight: 800; letter-spacing: -.02em; }
.lg.l40 { width: 40px; height: 40px; font-size: 14px; } .lg.l56 { width: 56px; height: 56px; border-radius: 10px; font-size: 19px; }
.lg.k-sender { background: radial-gradient(circle at 70% 30%, color-mix(in srgb, var(--text-primary) 26%, var(--tc)) 0 22%, var(--tc) 23%); }
.lg.k-web { background: repeating-linear-gradient(135deg, var(--tc) 0 6px, color-mix(in srgb, var(--tc) 70%, var(--bg-base)) 6px 12px); }
.lg.k-eigen { background: linear-gradient(180deg, color-mix(in srgb, var(--tc) 50%, var(--surface-3)) 0 55%, var(--tc) 55%); }
.lg.k-eigen::before { content: ""; position: absolute; width: 34%; height: 34%; top: 14%; right: 16%; border-radius: 50%; background: color-mix(in srgb, var(--warning) 70%, var(--tc)); }
.lg.k-up { background: var(--surface-1); border: 1px dashed var(--border-strong); color: var(--text-muted); }
.lg span { position: relative; text-shadow: 0 1px 2px var(--shadow); }

/* Relay tiles (Streams page «Kacheln») */
.load { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 24px; align-items: center; padding: 12px 16px; border-radius: 10px; background: var(--tint-accent); border: 1px solid var(--border); }
.load .lm { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.load .lm b { color: var(--text-primary); font-size: 13px; }
@container page (width < 640px) { .load { grid-template-columns: minmax(0, 1fr); } }
.relays { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 12px; }
.rt { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); min-width: 0; }
.rt h3 { font-size: 15px; font-weight: 700; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--text-muted); } .kv dd { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rt footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); }
.empty { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 96px; border: 1px dashed var(--border-strong); border-radius: 10px; color: var(--text-secondary); }

/* Setting rows (S-7) */
.srows { border: 1px solid var(--border); border-radius: 12px; background: var(--bg-elevated); }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, auto); gap: 8px 24px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.srow:last-of-type { border-bottom: 0; }
.srow .sl b { display: block; font-weight: 600; }
.srow .sl span { font-size: 12px; color: var(--text-muted); }
.srow .sc { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
.chain { display: flex; flex-direction: column; gap: 6px; }
.chain .row { justify-content: flex-end; }
@container page (width < 640px) { .srow { grid-template-columns: minmax(0, 1fr); } .srow .sc, .chain .row { justify-content: flex-start; } }
.savebar { position: sticky; bottom: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); border-radius: 0 0 12px 12px; background: var(--surface-2); }
.savebar span { margin-right: auto; color: var(--text-secondary); }

/* Classification */
.cov { display: flex; flex-direction: column; gap: 12px; }
.cv { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr) 3rem; gap: 4px 12px; align-items: center; }
.cv b { font-weight: 600; } .cv .num { text-align: right; font-weight: 700; }
.cv .mut { grid-column: 2 / 4; }
.covline { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }

/* Variant B: master-detail */
.hbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; margin-top: 12px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); font-size: 13px; color: var(--text-secondary); }
.hbar b { color: var(--text-primary); }
.ms { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
.ml { display: flex; flex-direction: column; gap: 10px; min-width: 0; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-elevated); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips .gl { width: 100%; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); margin-top: 4px; }
.fc { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 9px; border-radius: 13px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-size: 12px; cursor: pointer; }
.fc[aria-pressed="true"] { background: var(--tint-accent); border-color: var(--accent); color: var(--text-primary); }
.fc small { color: var(--text-muted); font-variant-numeric: tabular-nums; }
.lb { max-height: 560px; overflow-y: auto; margin: 0 -4px; padding: 2px 4px; display: flex; flex-direction: column; gap: 2px; }
.opt { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
.opt:hover { background: var(--surface-2); }
.opt[aria-selected="true"] { background: var(--surface-3); box-shadow: inset 3px 0 0 var(--accent); }
.opt .t1 { font-weight: 600; } .opt .t2 { font-size: 12px; color: var(--text-muted); }
.opt .ic { margin-left: auto; display: flex; gap: 6px; align-items: center; color: var(--text-muted); }
.md { min-width: 0; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-elevated); }
.md .ed { padding: 16px; }
.mdback { display: none; margin: 12px 16px 0; }
@container frame (width < 900px) {
  .ms { grid-template-columns: minmax(0, 1fr); }
  .ms[data-mode="list"] .md, .ms[data-mode="detail"] .ml { display: none; }
  .mdback { display: inline-flex; }
}

/* Variant C */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
@container page (width < 900px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container page (width < 440px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
.kt { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 14px 16px; border: 1px solid var(--border); border-left: 4px solid var(--surface-3); border-radius: 10px; background: var(--bg-elevated); color: inherit; text-align: left; font: inherit; }

function saveEditor() {

  const t = TAGS.find((x) => x.tag === tag); if (!t || !t.sel) return;
  TAGS = TAGS.filter((x) => x !== t);
  if (t.sel === 'ignore') { IGNORED += 1; up(); toast(`«${tag}» wird ignoriert.`); return; }
  const [f, v] = t.sel.split(':');
  RULES.push({ tag, f, v, n: t.n }); COVER[f] = Math.min(CAT.reach, COVER[f] + Math.round(t.n * 0.6));
  up(); toast(`«${tag}» → ${FACETS[f].label} ${v} · ${n(t.n)} Sender neu eingeordnet.`);
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const a = el.dataset.a, id = el.dataset.id;
  if (el.tagName === 'A') e.preventDefault();
  if (S.menu && a !== 'menu' && a !== 'mi') { S.menu = null; renderLayer(); }
  switch (a) {
    case 'variant': if (S.ov.length) return; S.v = el.dataset.v; S.ed = null; S.menu = null; up(); break;
    case 'nav': if (el.dataset.l !== 'Radio') toast(`«${el.dataset.l}» ist in diesem Entwurf nicht gezeichnet.`); break;
    case 'navtoggle': S.navOpen = !S.navOpen; $('#anav').classList.toggle('open', S.navOpen); el.setAttribute('aria-expanded', S.navOpen); break;
    case 'help': S.help = !S.help; up(); break;
    case 'tab': S.tab = el.dataset.t; up(); $('#tab-' + S.tab).focus(); break;
    case 'sync': startSync(); break;
    case 'job': toast('Öffnet /admin/jobs?type=radio.sync (Hintergrundjobs, Konzept 09).'); break;
    case 'edit': openEditor(id); openOv({ t: 'edit' }); break;
    case 'hide': stationAction('hide', id); break;
    case 'menu': {
      if (S.menu && S.menu.id === id) { S.menu = null; up(); el.focus(); break; }
      S.menu = { id }; up(); const first = $('#rowmenu .mi'); if (first) first.focus(); break;
    }
    case 'mi': { const mid = S.menu.id, m = el.dataset.m; S.menu = null; up(); const b = document.getElementById('mb-' + mid); if (b) b.focus(); stationAction(m, mid); break; }
    case 'freset': S.f = { q: '', cc: '', genre: '', state: '', src: '', changed: false }; up(); break;
    case 'relaystop': { const s = st(id), r = relayOf(id); askConfirm('Weiterleitung beenden?', `${r.who.join(' und ')} ${r.who.length > 1 ? 'hören' : 'hört'} «${s.name}» dann nicht mehr. Der Puffer wird freigegeben.`, 'Beenden', () => { RELAYS = RELAYS.filter((x) => x.sid !== id); toast(`Weiterleitung «${s.name}» beendet.`); }); break; }
    case 'assign': assignTag(el.dataset.tag); break;
    case 'ruledel': { const r = RULES.find((x) => x.tag === el.dataset.tag); askConfirm('Regel entfernen?', `«${r.tag}» ordnet dann nichts mehr zu; ${n(r.n)} Sender verlieren ${FACETS[r.f].label} ${r.v}, ausser es ist von Hand gesetzt. Der Tag erscheint wieder in der Arbeitsliste.`, 'Entfernen', () => { RULES = RULES.filter((x) => x !== r); TAGS.push({ tag: r.tag, n: r.n, sel: r.f + ':' + r.v }); TAGS.sort((x, y) => y.n - x.n); COVER[r.f] = Math.max(0, COVER[r.f] - Math.round(r.n * 0.6)); toast(`Regel «${r.tag}» entfernt.`); }); break; }
    case 'confirm': { const o = S.ov.pop(); o.fn(); up(); const ret = S.ov.length ? $(`#layer [data-ov="${S.ov.length - 1}"] .shb button, #layer [data-ov="${S.ov.length - 1}"] footer .b`) : back(o); if (ret) ret.focus(); break; }
    case 'ovclose': closeOv(); break;
    case 'recheck': { const o = S.ov[S.ov.length - 1]; runCheck(st(o.id), (r) => { o.res = r; keepFocus(renderLayer); }); break; }
    case 'add': S.addForm = { name: '', url: '', web: '', cc: S.set.country, region: '', genre: '', kind: 'Musik', logo: 'initialen', err: {} }; openOv({ t: 'add' }); break;
    case 'addsave': {
      const f = S.addForm, err = {};
      if (!f.name.trim()) err.name = 'Bitte einen Namen eingeben.';
      if (!/^https?:\/\/\S+\.\S+/.test(f.url.trim())) err.url = 'Bitte eine Adresse mit http:// oder https:// eingeben.';
      f.err = err; if (Object.keys(err).length) { renderLayer(); const k = Object.keys(err)[0]; $('#add-' + k).focus(); break; }
      const pl = /\.(pls|m3u8?)$/i.test(f.url.trim());
      const s = mk([f.name.trim(), f.cc, f.region, f.genre, f.kind, '', 'Schweizerdeutsch', 128, 'MP3', '', 'en']);
      s.streams[0].url = f.url.trim() + (pl ? ' → aufgelöst: icecast/mp3-128' : ''); s.logo = f.logo; s.logoHand = f.logo !== 'initialen'; s.changed = '06.11.2026';
      STATIONS.push(s); S.ov.pop(); if (S.v === 'A') S.tab = 'eigene'; if (S.v === 'B') { S.b.sel = s.id; S.ed = null; }
      up(); toast(`«${s.name}» hinzugefügt${pl ? ', Wiedergabeliste aufgelöst (1 Adresse)' : ''}.`); $('#ph1').focus(); break;
    }
    case 'edunlock': { const d = S.ed.draft, k = el.dataset.k; d[k] = d.auto[k]; delete d.locks[k]; up(); const s2 = $('#ed-' + k); if (s2) s2.focus(); break; }
    case 'edupload': S.ed.draft.uploaded = true; S.ed.draft.logoHand = true; up(); toast('Bild übernommen (im Entwurf ohne echte Datei).'); break;
    case 'edcheck': { const ed = S.ed; runCheck(ed.draft, (r) => { if (S.ed === ed) { ed.check = r; up(); } }); break; }
    case 'edvis': { const d = S.ed.draft; d.hidden = !d.hidden; d.hiddenBy = d.hidden ? 'hand' : ''; up(); break; }
    case 'edrec': S.ed.draft.rec = !S.ed.draft.rec; up(); break;
    case 'edsave': if (saveEditor()) { if (S.ov.length && S.ov[S.ov.length - 1].t === 'edit') closeOv(true); else up(); } break;
    case 'edreset': S.ed = null; up(); break;
    case 'del': stationAction('del', id); break;
    case 'setv': { const k = el.dataset.k, v = el.dataset.v; S.setDraft[k] = isNaN(v) ? v : Number(v); up(); break; }
    case 'settog': S.setDraft[el.dataset.k] = !S.setDraft[el.dataset.k]; up(); break;
    case 'setcc': { const c = S.setDraft.chosen, v = el.dataset.v; S.setDraft.chosen = c.includes(v) ? c.filter((x) => x !== v) : c.concat(v); up(); break; }
    case 'setsave': S.set = clone(S.setDraft); RELAYS.forEach((r) => { r.buf = Math.min(r.buf, S.set.buffer * 60); }); up(); toast('Einstellungen gespeichert.'); (document.querySelector('#settings .srow select, #settings .srow button') || $('#ph1')).focus(); break;
    case 'setdiscard': S.setDraft = clone(S.set); up(); $('#ph1').focus(); break;
    case 'bpanel': openOv({ t: 'panel', p: el.dataset.p }); break;
    case 'bchip': { const g = el.dataset.g, v = el.dataset.v, l = S.b.chips[g]; S.b.chips[g] = l.includes(v) ? l.filter((x) => x !== v) : l.concat(v); up(); break; }
    case 'bchipreset': S.b.chips = { state: [], cc: [], genre: [] }; up(); $('#b-q').focus(); break;
    case 'bsel': selectB(id, true); break;
    case 'bback': S.b.mode = 'list'; up(); { const o = document.getElementById('o-' + S.b.sel); if (o) o.focus(); } break;
    case 'clive': S.c.live = !S.c.live; up(); break;
    case 'call': openOv({ t: 'panel', p: 'katalog' }); break;
    case 'crules': S.c.rulesAll = true; up(); break;
    case 'find': openOv({ t: 'find', q: '' }); break;
    case 'findpick': S.ov.pop(); openEditor(id); S.ov.push({ t: 'edit', sel: '[data-a="find"]' }); up(); focusFirst(); break;
  }
});
function selectB(id, open) {
  const go = () => { S.b.sel = id; S.ed = null; if (open) S.b.mode = 'detail'; up(); const o = document.getElementById('o-' + id); if (o && S.b.mode === 'list') o.focus(); else if (open && getComputedStyle($('.mdback')).display !== 'none') $('.mdback').focus(); else if (o) o.focus(); };
  if (id !== S.b.sel && isDirty()) askConfirm('Änderungen verwerfen?', `Deine Änderungen an «${st(S.b.sel).name}» sind nicht gespeichert.`, 'Verwerfen', () => { S.ed = null; setTimeout(go); }, false);
  else go();
}
document.addEventListener('input', (e) => {
  const el = e.target, a = el.dataset.in; if (!a) return;
  if (a === 'f') { S.f[el.dataset.k] = el.value; keepFocus(renderMain); }
  if (a === 'bq') { S.b.q = el.value; keepFocus(renderMain); }
  if (a === 'crq') { S.c.rq = el.value; keepFocus(renderMain); }
  if (a === 'findq') { S.ov[S.ov.length - 1].q = el.value; keepFocus(renderLayer); }
  if (a === 'addf' && el.tagName === 'INPUT') { S.addForm[el.dataset.k] = el.value; }
  if (a === 'edname') { const d = S.ed.draft; d.name = el.value; if (d.name !== d.catalogName && d.src !== 'eigen') d.locks.name = true; else delete d.locks.name; keepFocus(() => { const s = S.v === 'B' ? $('.md .savebar') : null; if (S.v === 'B' && !!s !== isDirty()) renderMain(); else if (S.v !== 'B') renderLayer(); }); }
});
document.addEventListener('change', (e) => {
  const el = e.target, a = el.dataset.in; if (!a) return;
  if (a === 'f' && el.tagName === 'SELECT') { S.f[el.dataset.k] = el.value; up(); }
  if (a === 'fchk') { S.f.changed = el.checked; up(); }
  if (a === 'tagsel') { TAGS.find((t) => t.tag === el.dataset.tag).sel = el.value; up(); }
  if (a === 'rulesel') { const r = RULES.find((x) => x.tag === el.dataset.tag), [f, v] = el.value.split(':'); r.f = f; r.v = v; up(); toast(`Regel «${r.tag}» → ${FACETS[f].label} ${v} · ${n(r.n)} Sender neu eingeordnet.`); }
  if (a === 'addf') { S.addForm[el.dataset.k] = el.value; if (el.dataset.k === 'cc') { S.addForm.region = ''; keepFocus(renderLayer); } }
  if (a === 'edf') { const d = S.ed.draft, k = el.dataset.k; d[k] = el.value; if (el.value !== d.auto[k]) d.locks[k] = true; else delete d.locks[k]; up(); }
  if (a === 'edlogo') { const d = S.ed.draft; d.logo = el.value; d.logoHand = el.value !== d.autoLogo; up(); }
  if (a === 'edpref') { const d = S.ed.draft; d.pref = Number(el.value); if (d.pref !== d.autoPref) d.locks.pref = true; else delete d.locks.pref; S.ed.check = null; up(); }
  if (a === 'set') { const k = el.dataset.k; S.setDraft[k] = el.type === 'number' ? Math.max(1, Number(el.value) || 1) : el.value; up(); }
  if (a === 'setpos') { const k = el.dataset.k, other = k === 'mb' ? 'it' : 'mb', v = Number(el.value); S.setDraft[other + 'Pos'] = S.setDraft[k + 'Pos']; S.setDraft[k + 'Pos'] = v; up(); }
});

/* Keyboard: Escape, focus trap in dialogs, menu, tablist and listbox arrows. */
document.addEventListener('keydown', (e) => {
  if (S.menu) {
    const items = [...document.querySelectorAll('#rowmenu .mi')], i = items.indexOf(document.activeElement);
    if (e.key === 'Escape' || e.key === 'Tab') { const id = S.menu.id; S.menu = null; up(); const b = document.getElementById('mb-' + id); if (b) b.focus(); if (e.key === 'Escape') e.preventDefault(); return; }
    const mv = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: items.length - 1 }[e.key];
    if (mv !== undefined) { e.preventDefault(); items[(mv + items.length) % items.length].focus(); }
    return;
  }
  if (e.key === 'Escape' && S.ov.length) { e.preventDefault(); closeOv(); return; }
  if (e.key === 'Tab' && S.ov.length) {
    const top = $(`#layer [data-ov="${S.ov.length - 1}"]`); if (!top) return;
    const f = [...top.querySelectorAll('button:not(:disabled), input:not(:disabled), select, a[href], [tabindex="0"]')].filter((x) => x.offsetParent !== null);
    if (!f.length) return;
    if (!top.contains(document.activeElement)) { e.preventDefault(); f[0].focus(); return; }
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    return;
  }
  const tab = e.target.closest && e.target.closest('[role="tab"]');
  if (tab && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
    e.preventDefault(); const k = TABS.findIndex(([t]) => t === S.tab);
    const nk = e.key === 'Home' ? 0 : e.key === 'End' ? TABS.length - 1 : (k + (e.key === 'ArrowRight' ? 1 : -1) + TABS.length) % TABS.length;
    S.tab = TABS[nk][0]; up(); $('#tab-' + S.tab).focus(); return;
  }
  const opt = e.target.closest && e.target.closest('[role="option"]');
  if (opt) {
    const all = [...document.querySelectorAll('#blist [role="option"]')], i = all.indexOf(opt);
    const nx = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: all.length - 1 }[e.key];
    if (nx !== undefined) { e.preventDefault(); const t = all[Math.max(0, Math.min(all.length - 1, nx))]; selectB(t.dataset.id, false); }
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectB(opt.dataset.id, true); }
  }
});
document.addEventListener('pointerdown', (e) => { if (S.menu && !e.target.closest('#rowmenu') && !e.target.closest('[data-a="menu"]')) { S.menu = null; keepFocus(renderLayer); } });
addEventListener('resize', () => { if (S.menu) positionMenu(); });
addEventListener('scroll', () => { if (S.menu) positionMenu(); }, true);

/* Live polling every 5 s, paused while a dialog is open (S-6). Only text nodes change, focus stays. */
setInterval(() => {
  const lab = $('#livelabel'); if (lab) lab.outerHTML = liveLabel();
  if (S.ov.length) return;
  RELAYS.forEach((r, i) => {
    r.up += 5; r.buf = Math.min(r.buf + 5, S.set.buffer * 60);
    const u = document.getElementById('ru-' + i), b = document.getElementById('rb-' + i), bb = document.getElementById('rbb-' + i);
    if (u) u.textContent = hms(r.up);
    if (b) b.textContent = `${Math.floor(r.buf / 60)} von ${S.set.buffer} Min.`;
    if (bb) bb.style.width = pct(r.buf, S.set.buffer * 60) + '%';
  });
}, 5000);

renderMain();
</script>
