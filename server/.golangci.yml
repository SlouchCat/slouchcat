# golangci-lint v2 configuration (run with `task server:lint`). Enforces CLAUDE.md rules 2, 3
# and 10 where a linter can: os/exec only in internal/transcode and cmd/updater (ADR 0024),
# store/systemq only in the packages that may read titles unfiltered. The analyzer
# tools/itemsaccess covers SQL literals.
version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - noctx
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  settings:
    depguard:
      rules:
        os-exec:
          files:
            - $all
            - "!**/internal/transcode/**"
            - "!**/cmd/updater/**"
          deny:
            - pkg: os/exec
              desc: external processes run only through internal/transcode, and docker compose only in cmd/updater (CLAUDE.md rule 3, ADR 0024)
        systemq:
          files:
            - $all
            - "!**/internal/{visibility,admin,library,metadata,jobs,notify,offline}/**"
          deny:
            - pkg: github.com/slouchcat/slouchcat/server/internal/store/systemq
              desc: unfiltered queries are allowed only in visibility, admin, library, metadata, jobs, notify and offline (CLAUDE.md rule 2)
        test-helpers:
          # storetest and vistest open template databases and seed fixtures for tests. Code that
          # ships must never reach them; vistest builds on storetest, so the two may import each
          # other.
          files:
            - $all
            - "!$test"
            - "!**/internal/store/storetest/**"
            - "!**/internal/visibility/vistest/**"
          deny:
            - pkg: github.com/slouchcat/slouchcat/server/internal/store/storetest
              desc: test helper; import it only from _test.go files
            - pkg: github.com/slouchcat/slouchcat/server/internal/visibility/vistest
              desc: test helper; import it only from _test.go files
        browse:
          # The folder browser (idea 02) is the first code that lists directories. It gets its own
          # boundary instead of a place in internal/admin, which may read titles unfiltered: a
          # directory walker has no business in that package, and that exception list stays small.
          # It reads through internal/paths, shares the scanner's rules (Ignored, WatchMode,
          # PathProblem) with internal/library and knows nothing else of the server.
          files:
            - "**/internal/browse/**"
          allow:
            - $gostd
            - github.com/slouchcat/slouchcat/server/internal/paths
            - github.com/slouchcat/slouchcat/server/internal/model
            - github.com/slouchcat/slouchcat/server/internal/library
        apicheck:
          files:
            - "**/cmd/apicheck/**"
          deny:
            - pkg: github.com/slouchcat/slouchcat/server/internal
              desc: the P-16 third-party client knows the server only through api/openapi.yaml; importing a package of this server would make it an inside client and void the evidence (plan section 8, P-16)
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^exec\.(Command|CommandContext|LookPath)$
          pkg: ^os/exec$
          msg: external processes run only through internal/transcode (and docker compose in cmd/updater, ADR 0024), with exec.CommandContext and an argument list (CLAUDE.md rule 3)
        - pattern: \.(EnqueueOverridingPause|RaiseQueuedJobForPlayback|EnqueueOverridingWindow)$
          msg: only a playback lifts the pause, a playback or an offline download the time window of a job type, through package library (concept 14 6.5, ADR 0022; concept 15 4.3, M-1)
    govet:
      enable-all: true
      disable:
        - fieldalignment # readability of structs wins over a few bytes
        - shadow # `err` shadowing is idiomatic
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    warn-unused: true
    presets:
      - std-error-handling
    rules:
      - path: internal/transcode/
        linters:
          - forbidigo
      # The updater companion runs docker compose (ADR 0024). Only exec.CommandContext is lifted
      # there; exec.Command and exec.LookPath stay forbidden.
      - path: ^cmd/updater/
        linters:
          - forbidigo
        text: "^use of `exec\\.CommandContext` forbidden"
      - path: internal/(jobs|library)/
        linters:
          - forbidigo
        text: (EnqueueOverridingPause|RaiseQueuedJobForPlayback|EnqueueOverridingWindow)
      - path: _test\.go
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/slouchcat/slouchcat/server
