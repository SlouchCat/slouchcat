# Server tasks, included from the root Taskfile with dir ./server (`task server:<name>`).
# All Go tools run through `go tool` with the versions pinned in go.mod.
version: "3"

vars:
  VERSION:
    # Only the server's own release tags (`v1.2.3`) count: the tags of the relay services and of the
    # apps (`relay-v…`, `app-v…`, `tv-v…`) are no server version, and the update check would read a
    # build described from them as a development build.
    sh: git describe --tags --match 'v[0-9]*' --always --dirty 2>/dev/null || echo dev

tasks:
  gen:
    desc: Generate the API server (oapi-codegen) and the database queries (sqlc)
    cmds:
      - go tool oapi-codegen -config oapi-codegen.yaml ../api/openapi.yaml
      - go tool sqlc generate

  # Half of the root `gen:check`: the server job runs it right after `server:gen`, so codegen drift
  # is caught in the job that produced it. Paths are relative to server/ (this file's dir).
  gen:check:
    desc: Fail when the generated Go code differs from the committed state (codegen drift)
    cmds:
      - git diff --exit-code --stat -- internal/api/gen internal/store

  lint:
    desc: golangci-lint, the itemsaccess analyzer and go vet
    cmds:
      - go tool golangci-lint run ./...
      - go run ./tools/itemsaccess/cmd/itemsaccess ./...
      - go vet ./...
      # A group in testgroups.txt that names a package which no longer exists would run no tests
      # and still pass. Here that is a red lint instead.
      - scripts/testgroups.sh --check

  test:
    desc: >-
      Run the server tests with the race detector. GROUP picks one of the parallel CI groups
      (`task server:test GROUP=rest`, see testgroups.txt); without it every package runs, which is
      what `task ci` and every local run do.
    vars:
      GROUP: '{{.GROUP | default "all"}}'
    cmds:
      # In two steps, not `go test ... $(scripts/testgroups.sh ...)`: a command substitution throws
      # its exit status away, so a broken group would reach `go test` as an empty argument list.
      - |
        # -f: a group of a split package is "-run=<pattern> <package>", and a pattern with [ or *
        # must reach go test as written, not as the file names it happens to match.
        set -euf
        packages=$(scripts/testgroups.sh "{{.GROUP}}")
        # The whole suite under -race is a heavy run: it waits for a machine-wide slot locally
        # (scripts/heavy-slot.sh, docs/dev/SETUP.md); CI runs it straight away.
        #
        # -gcflags turns checkptr off inside modernc.org only; the race detector stays on everywhere.
        # -race enables checkptr for every package, and modernc.org/sqlite and modernc.org/libc are
        # pure-Go C translations made of unsafe pointer arithmetic: 35 % of TestContractChildProfiles
        # went to runtime.checkptr in a profile, and the test takes 58 s instead of 121 s without it
        # (measured 4 November 2026). This module's own code does not import unsafe, so checkptr has
        # nothing of ours to check. Marco's decision of 4 November 2026. CI runs this task as well
        # (`task server:test GROUP=...`), so local and CI builds stay the same.
        ../scripts/heavy-slot.sh go test -race -gcflags='modernc.org/...=-d=checkptr=0' -timeout 30m $packages

  check:fast:
    desc: >-
      Quick Go check while working (`task server:check:fast`, BASE=<ref> to compare with something
      other than origin/main): go vet and go test without the race detector, only for the packages
      changed since the merge base with BASE (committed, staged, unstaged, new) and the packages
      that import them directly (scripts/changedpkgs.sh). Files outside a package that tests read
      count for the reading package (testdata/db, testdata/podcasts, testdata/webhooks,
      api/openapi.yaml); not seen are the generated media in testdata/media (library, transcode,
      playback, offline, metadata, cmd/slouchcat) and the web build embedded by webassets. Does
      nothing when no Go package changed. Not a replacement for `task ci`, which still runs every
      package with -race.
    vars:
      BASE: '{{.BASE | default "origin/main"}}'
    cmds:
      # Two steps for the same reason as in `test`: a failing script must not turn into an empty
      # package list.
      - |
        set -eu
        packages=$(scripts/changedpkgs.sh "{{.BASE}}")
        if [ -z "$packages" ]; then
          echo "no changed Go package since {{.BASE}}"
          exit 0
        fi
        echo "$packages"
        go vet $packages
        go test -count=1 $packages

  freeze:x-clients:
    desc: >-
      Freeze the operations with x-clients of the contract at REF (default: the newest server
      release tag) into internal/api/testdata/x-clients-frozen.json, the state that
      TestXClientsCompatibility compares api/openapi.yaml with (docs/dev/VERTRAEGLICHKEIT.md).
      Run it after every release whose contract changes an operation with x-clients, for example
      `task server:freeze:x-clients REF=v1.42.0`, and commit the file.
    vars:
      REF: '{{.REF | default ""}}'
    cmds:
      - |
        set -euo pipefail
        ref="{{.REF}}"
        [ -n "$ref" ] || ref=$(git describe --tags --match 'v[0-9]*' --abbrev=0)
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT
        git show "$ref:api/openapi.yaml" >"$tmp"
        SLOUCHCAT_FREEZE_X_CLIENTS="$tmp" SLOUCHCAT_FREEZE_X_CLIENTS_REF="$ref" \
          go test -count=1 -v -run '^TestXClientsCompatibility$' ./internal/api | grep -E 'froze|^(ok|FAIL)'

  check:fast:selftest:
    desc: Check scripts/changedpkgs.sh, which `check:fast` relies on, against a throwaway repository
    cmds:
      - scripts/changedpkgs_selftest.sh

  build:
    desc: Build the static server binary into bin/slouchcat
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o bin/slouchcat ./cmd/slouchcat

  build:e2e:
    desc: >-
      Build the e2e server binary bin/slouchcat-e2e with the tag radiotest (plan 3.8): the radio
      reads its catalog URL from SLOUCHCAT_TEST_RADIO_CATALOG_URL and may dial the loopback. Only
      the Playwright suite runs it; the image and bin/slouchcat never carry the tag
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -tags radiotest -trimpath -ldflags "-s -w -X main.version={{.VERSION}}" -o bin/slouchcat-e2e ./cmd/slouchcat

  dev:
    desc: Run the server in development mode with data under ../.dev
    cmds:
      - mkdir -p ../.dev/config ../.dev/cache
      - go run ./cmd/slouchcat serve --dev --log-format text --config-dir ../.dev/config --cache-dir ../.dev/cache

  apicheck:
    desc: >-
      Third-party client test P-16 (the evidence for C-5): starts a fresh server with its own
      /config and its own port and lets the contract-only client in cmd/apicheck run through
      every viewer function; needs ffmpeg and the test media (`task testdata:media`). Not part
      of `task ci`. Arguments after `--` go to the client, for example `-report p16.md`.
    vars:
      # 0 lets the kernel pick a free port; the run then reads the real address out of the
      # server's own log, so it never talks to someone else's server on a fixed port.
      APICHECK_PORT: '{{.APICHECK_PORT | default "0"}}'
    cmds:
      - go build -o bin/apicheck ./cmd/apicheck
      - task: build
      # Through bash: the task runner's own shell has no job control, so it would wait for the
      # server in the background for ever. bash starts it, stops it again and cleans up.
      - |
        bash -s -- "{{.APICHECK_PORT}}" {{.CLI_ARGS}} <<'APICHECK'
        set -eu
        port=$1
        shift
        root=$(mktemp -d -t slouchcat-apicheck-XXXXXX)
        pid=""
        cleanup() {
          if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi
          rm -rf "$root"
        }
        trap cleanup EXIT
        fail() {
          echo "$1" >&2
          echo "--- Server-Log, letzte 60 Zeilen ---" >&2
          tail -n 60 "$root/server.log" >&2
          exit 1
        }
        # The same throw-away setup the Playwright suite uses (web/e2e/start-server.mjs): own
        # config and cache directory, own port, no TMDB key, development mode. New library folders
        # must lie below a browsable root (idea 02, E14), and the default /media is on no test
        # machine: the root is the test media, as in the e2e suite.
        if [ ! -d ../testdata/media ]; then echo "Keine Testmedien: zuerst task testdata:media." >&2; exit 1; fi
        SLOUCHCAT_TMDB_API_KEY= SLOUCHCAT_BROWSE_ROOTS="$(cd ../testdata/media && pwd)" bin/slouchcat serve \
          --listen "127.0.0.1:$port" \
          --config-dir "$root/config" --cache-dir "$root/cache" \
          --dev --log-format text --log-level info >"$root/server.log" 2>&1 &
        pid=$!
        addr=""
        for _ in $(seq 1 120); do
          kill -0 "$pid" 2>/dev/null || fail "Der Server hat sich beim Start beendet."
          addr=$(sed -n 's/.*msg=listening addr=\([^ ]*\).*/\1/p' "$root/server.log" | tail -n 1)
          if [ -n "$addr" ]; then break; fi
          sleep 0.5
        done
        [ -n "$addr" ] || fail "Der Server hat innert 60 s keine Adresse gemeldet."
        bin/apicheck -base "http://$addr" \
          -spec ../api/openapi.yaml -testdata ../testdata "$@" \
          || fail "Der Fremd-Client-Test ist fehlgeschlagen."
        APICHECK

  devicecheck:
    desc: >-
      The device check of concept 27 (stage 1): apicheck with -devices plays a phone that pairs a TV
      against a freshly started server. Arguments after `--` go to the client, for example
      `-relay http://127.0.0.1:8180` for a running pairing relay (`task relay:build`, relay/bin/pair).
    cmds:
      - task: apicheck
        vars:
          CLI_ARGS: '-devices {{.CLI_ARGS}}'

  vuln:
    desc: Check dependencies for known vulnerabilities (needs network access)
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  ci:
    desc: Everything CI runs for the server, in order
    cmds:
      - task: gen
      - task: lint
      - task: test
      - task: build
      - task: vuln
