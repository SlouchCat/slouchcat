# Tasks of the Android apps (concept 27, 5.7), included from the root Taskfile with dir ./android
# (`task android:<name>`). Every Gradle run waits for a heavy slot (scripts/heavy-slot.sh); CI
# never waits. JDK and SDK: JAVA_HOME and ANDROID_HOME, else the places of
# scripts/install-android-tools.sh under ~/.local/share.
version: "3"

env:
  JAVA_HOME:
    sh: echo "${JAVA_HOME:-$HOME/.local/share/jdk/current}"
  ANDROID_HOME:
    sh: echo "${ANDROID_HOME:-$HOME/.local/share/android-sdk}"

tasks:
  check:
    desc: >-
      Debug and unsigned release builds (R8) of both flavours (play, foss), lint of every module with the own rules, the
      generators of client, texts and tokens (CI job "android")
    cmds:
      - ../scripts/heavy-slot.sh ./gradlew --console=plain ciCheck {{.CLI_ARGS}}

  # The two halves of check, as the two CI jobs of "android" run them (ciCheckDebug, ciCheckRelease).
  check:debug:
    desc: Debug builds of both flavours and of the TV app, lint of every module, the generators (half of android:check)
    cmds:
      - ../scripts/heavy-slot.sh ./gradlew --console=plain ciCheckDebug {{.CLI_ARGS}}

  check:release:
    desc: Unsigned release builds (R8) of both flavours and of the TV app (the other half of android:check)
    cmds:
      - ../scripts/heavy-slot.sh ./gradlew --console=plain ciCheckRelease {{.CLI_ARGS}}

  test:
    desc: All JVM tests of the apps, the lint rules and the generators (Robolectric, no emulator)
    cmds:
      - ../scripts/heavy-slot.sh ./gradlew --console=plain ciTest {{.CLI_ARGS}}

  apk:
    desc: >-
      Debug APKs and unsigned release APKs (R8) of both flavours into app-mobile/build/outputs/apk, of the TV app into
      app-tv/build/outputs/apk
    cmds:
      - ../scripts/heavy-slot.sh ./gradlew --console=plain :app-mobile:assemblePlayDebug :app-mobile:assembleFossDebug :app-mobile:assemblePlayRelease :app-mobile:assembleFossRelease :app-tv:assembleDebug :app-tv:assembleRelease
      - find app-mobile/build/outputs/apk app-tv/build/outputs/apk -name '*.apk' -print

  bundle:
    desc: >-
      App bundles (AAB) for the store: play of the phone app and the TV app (foss never goes to the store); signed with
      the four slouchcat.signing.* values, else unsigned
    cmds:
      - ../scripts/heavy-slot.sh ./gradlew --console=plain :app-mobile:bundlePlayRelease :app-tv:bundleRelease
      - find app-mobile/build/outputs/bundle app-tv/build/outputs/bundle -name '*.aab' -print

  # The files of a release in android/dist/ (docs/dev/ANDROID-INBETRIEBNAHME.md): APPS="app tv"
  # (default), app or tv; the release workflow builds only the app of its tag.
  dist:
    desc: >-
      Debug APKs for adb install, release APKs and bundles of both apps with the version in the name into android/dist/,
      checked with apksigner and aapt2, with SHA256SUMS; APPS=app or APPS=tv for one app
    cmds:
      - APPS="{{.APPS | default "app tv"}}" ../scripts/android-dist.sh

  # The job "sign" of release-android.yml, locally: no Gradle, the key from SLOUCHCAT_SIGNING_*.
  sign:
    desc: >-
      Signs the unsigned release files in android/dist/ (or DIR) with the upload key from the four SLOUCHCAT_SIGNING_*
      environment variables (zipalign, apksigner, jarsigner) and writes SHA256SUMS again
    cmds:
      - ../scripts/android-sign.sh "{{.DIR | default "dist"}}"

  # The generated client against a real server: the server of this repository with fresh data and
  # the media tree of scripts/android-test-media.sh on its own port (CONTRACT_PORT, from 8597; the emulator reaches it as http://10.0.2.2:<port>).
  contract:
    desc: >-
      Contract test of the Kotlin client: starts bin/slouchcat with fresh data on CONTRACT_PORT
      (8597) and runs core/api's contractTest against it
    vars:
      CONTRACT_PORT: '{{.CONTRACT_PORT | default "8597"}}'
    cmds:
      - task: :server:build
      # Stage 8: the push relay and the fake of Google's push service (relay/), for push end to end.
      - task: :relay:build
      - |
        bash -s -- "{{.CONTRACT_PORT}}" <<'CONTRACT'
        set -eu
        port=$1
        root=$(mktemp -d -t slouchcat-contract-XXXXXX)
        pid=""
        # The helpers of scripts/android-helpers.sh (Seerr and TMDB mocks, push relay, fcmfake and the
        # pairing relay): ports PORT-11, PORT-12, PORT+83, PORT+84, the pairing relay PORT+82.
        . ../scripts/android-helpers.sh
        cleanup() {
          status=$?
          if [ "$status" -ne 0 ]; then helpers_save_logs core/api/build/reports/tests/contractTest/helpers; fi
          if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; fi
          helpers_stop
          rm -rf "$root"
        }
        trap cleanup EXIT
        fail() {
          echo "$1" >&2
          echo "--- server log, last 40 lines ---" >&2
          tail -n 40 "$root/server.log" >&2
          exit 1
        }
        # The same throw-away setup as task apicheck: own config and cache, no TMDB key; a small
        # media tree as the only browsable root (the detail pages' contract test adds it).
        mkdir -p "$root/media"
        ../scripts/android-test-media.sh "$root/media"
        # Real video for the player's contract test (needs ffmpeg).
        ../scripts/android-test-video.sh "$root/media"
        # The helpers first: the server inherits the addresses of the TMDB mock and the push relay.
        helpers_start "$root" "$port" "$((port + 82))" || fail "A helper did not come up."
        SLOUCHCAT_BROWSE_ROOTS="$root/media" SLOUCHCAT_TMDB_API_KEY= ../server/bin/slouchcat serve \
          --listen "127.0.0.1:$port" \
          --config-dir "$root/config" --cache-dir "$root/cache" \
          --dev --log-format text --log-level info >"$root/server.log" 2>&1 &
        pid=$!
        for _ in $(seq 1 120); do
          kill -0 "$pid" 2>/dev/null || fail "The server stopped while starting (port $port taken?)."
          if grep -q 'msg=listening' "$root/server.log"; then break; fi
          sleep 0.5
        done
        grep -q 'msg=listening' "$root/server.log" || fail "The server reported no address within 60 s."
        ../scripts/heavy-slot.sh ./gradlew --console=plain :core:api:contractTest \
          "-Pslouchcat.contract.base=http://127.0.0.1:$port" "-Pslouchcat.contract.media=$root/media" \
          "-Pslouchcat.contract.seerr=http://127.0.0.1:$HELPER_SEERR_PORT" "-Pslouchcat.contract.relay=http://127.0.0.1:$HELPER_PUSH_PORT" \
          "-Pslouchcat.contract.fcmfake=http://127.0.0.1:$HELPER_FCM_PORT" || fail "The contract test failed."
        CONTRACT

  # The flow of the app in an emulator (concept 27 12 «Gerät»): the server of this repository with
  # fresh data on PORT (8597), the connected device or the AVD sc_phone, the instrumentation test
  # SignInFlowTest. SHOTS=<dir> photographs every page and sheet instead (visual check).
  e2e:
    desc: >-
      Instrumentation test in the emulator: server address, sign-in, profile with PIN, «Mehr», «Meine Geräte», sign-out,
      «Fernseher verbinden» through relay/bin/pair on RELAY_PORT (PORT+85), wishes and push (Seerr and TMDB mocks on
      PORT-11 and PORT-12, push relay PORT+83, fcmfake PORT+84, radio test stations PORT+1; scripts/android-helpers.sh), against the server built with the tag radiotest
      on PORT (8597), only in its own emulator AVD (sc_phone) on EMU_PORT (5580); SHOTS=<dir> takes photos
    cmds:
      - task: :server:build
      - task: :relay:build
      - PORT={{.PORT | default "8597"}} RELAY_PORT={{.RELAY_PORT}} AVD={{.AVD | default "sc_phone"}} EMU_PORT={{.EMU_PORT | default "5580"}} SHOTS={{.SHOTS}} LOCALE={{.LOCALE}} CLASS={{.CLASS}} ../scripts/android-e2e.sh

  # Only the flow of stage 8 «Wünsche und Meldungen» (concept 27): android:e2e with its class.
  e2e:messages:
    desc: >-
      Instrumentation test MessagesFlowTest alone (a wish from the search, withdrawn; a declined one in the
      inbox; push through the local relay and fcmfake): task android:e2e CLASS=…MessagesFlowTest
    cmds:
      - task: e2e
        vars: {PORT: '{{.PORT}}', RELAY_PORT: '{{.RELAY_PORT}}', AVD: '{{.AVD}}', EMU_PORT: '{{.EMU_PORT}}', SHOTS: '{{.SHOTS}}', LOCALE: '{{.LOCALE}}', CLASS: com.slouchcat.app.mobile.MessagesFlowTest}

  # The flow of the TV app in a TV emulator (concept 26 stage 2a): the server with fresh data on PORT
  # (8697), the relay relay/bin/pair on RELAY_PORT (PORT+85), its own emulator AVD (sc_tv) on EMU_PORT
  # (5584), the instrumentation test TvFlowTest; apicheck plays the phone for the scan.
  e2e:tv:
    desc: >-
      Instrumentation test of the TV app in its own TV emulator: set up by hand, profile with PIN, settings, sign out;
      set up by scan through a local relay with apicheck as the phone; the player; wishes and notifications through
      the Seerr and TMDB mocks of scripts/android-helpers.sh; the sound with audiobook, podcast and the test stations of
      the radio mock (PORT+1). Defaults PORT 8697, RELAY_PORT PORT+85, EMU_PORT 5584; SHOTS=<dir> takes photos;
      TESTS=<class> runs only these test classes
    cmds:
      - task: :server:build
      - task: :relay:build
      - cd ../server && go build -o bin/apicheck ./cmd/apicheck
      - PORT={{.PORT | default "8697"}} RELAY_PORT={{.RELAY_PORT}} AVD={{.AVD | default "sc_tv"}} EMU_PORT={{.EMU_PORT | default "5584"}} SHOTS={{.SHOTS}} LOCALE={{.LOCALE}} TESTS={{.TESTS}} ../scripts/android-tv-e2e.sh

  # The pairing of the two apps (concept 27 stage 9): the TV app in its emulator shows its code, the
  # phone app's own Kotlin (:core:pairing, ScannedCode, PhonePairing) plays the phone as a JVM program
  # on the host. Two emulators at once do not fit the machine; the phone's page is checked by
  # TvLinkFlowTest in task android:e2e.
  e2e:pair:
    desc: >-
      The TV app in its emulator pairs with the phone app's Kotlin as a JVM program through a local relay
      (PORT 8697, RELAY_PORT PORT+85, EMU_PORT 5584); SHOTS=<dir> takes photos
    cmds:
      - task: :server:build
      - task: :relay:build
      - cd ../server && go build -o bin/apicheck ./cmd/apicheck
      - task: pair:host
      - PHONE=kotlin PORT={{.PORT | default "8697"}} RELAY_PORT={{.RELAY_PORT}} AVD={{.AVD | default "sc_tv"}} EMU_PORT={{.EMU_PORT | default "5584"}} SHOTS={{.SHOTS}} LOCALE={{.LOCALE}} ../scripts/android-tv-e2e.sh

  # Kotlin seals, Go opens (concept 27 stage 9, code review m-6): the phone app's Kotlin as a JVM
  # program against `apicheck -pair-tv` through a local relay, on the host, without an emulator.
  pair:host:
    desc: The phone's Kotlin pairs with apicheck as the TV through a local relay (PORT 8797, RELAY_PORT 8182), no emulator
    cmds:
      - task: :server:build
      - task: :relay:build
      - cd ../server && go build -o bin/apicheck ./cmd/apicheck
      - PORT={{.PORT | default "8797"}} RELAY_PORT={{.RELAY_PORT | default "8182"}} ../scripts/android-pair-host.sh

  # The quick Android part of `task check:fast`: only when something the apps are built from
  # changed (android/, the contract, the texts, the tokens) against BASE (default HEAD, the
  # working tree with untracked files). Without a JDK it says so and leaves the check to CI.
  check:fast:
    desc: Compile the play debug build and run its JVM tests when android/, the contract, texts or tokens changed
    vars:
      BASE: '{{.BASE | default "HEAD"}}'
    cmds:
      - |
        set -eu
        cd ..
        changed=$( { git diff --name-only '{{.BASE}}' -- android api/openapi.yaml web/src/locales packages/design-tokens ;
          git ls-files --others --exclude-standard -- android api/openapi.yaml web/src/locales packages/design-tokens ; } | sort -u )
        if [ -z "$changed" ]; then echo "android: nothing changed"; exit 0; fi
        if [ ! -x "$JAVA_HOME/bin/java" ] || [ ! -d "$ANDROID_HOME/platforms" ]; then
          echo "android: $(printf '%s\n' "$changed" | grep -c .) files changed, but no JDK or Android SDK here (scripts/install-android-tools.sh); CI checks them"
          exit 0
        fi
        cd android
        if ! printf '%s\n' "$changed" | grep -qvE '^web/src/locales/'; then
          # Only texts changed: the text generator over all languages is the whole check (seconds).
          echo "android: only web/src/locales changed, generating the texts"
          ../scripts/heavy-slot.sh ./gradlew --console=plain -q :core:strings:generateStrings
          exit 0
        fi
        ../scripts/heavy-slot.sh ./gradlew --console=plain -q fastCheck
