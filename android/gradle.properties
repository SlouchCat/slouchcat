# Memory limits for a machine shared by several builds (docs/dev/SETUP.md, section Android): the
# Gradle daemon at most 3 GB, the Kotlin daemon at most 2 GB, at most three workers, one test JVM
# (1.5 GB) at a time (build-logic, TestSlot): together under 8 GB. Stop the daemons after a larger
# run with `./gradlew --stop`.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.workers.max=3
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
android.useAndroidX=true
kotlin.code.style=official
