# Slouchcat – Docker Compose (plan section 3.7).
# Usage: cp .env.example .env && mkdir -p config cache && docker compose up -d
# HTTPS: docker compose --profile https up -d (Caddy, see README and Caddyfile).
# GPU: add -f compose.nvidia.yaml, -f compose.intel.yaml or -f compose.amd.yaml.
name: slouchcat

services:
  slouchcat:
    # Placeholder owner until the public GitHub repository exists (ADR 0001).
    image: ghcr.io/slouchcat/slouchcat:0.1
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: slouchcat
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8096:8096"
    volumes:
      # /config holds the SQLite database: local disk only, never NFS/SMB.
      - ./config:/config
      - ./cache:/cache
      - ${MEDIA_DIR:-/srv/media}:/media:ro
    environment:
      TZ: ${TZ:-Europe/Zurich}
      SLOUCHCAT_LOG_FORMAT: ${SLOUCHCAT_LOG_FORMAT:-json}
      # Optional: TMDB v4 read access token from .env; the wizard can store it encrypted instead.
      SLOUCHCAT_TMDB_API_KEY: ${SLOUCHCAT_TMDB_API_KEY:-}
      # Optional providers (README «Metadaten-Anbieter und Trailer»); empty = not used.
      SLOUCHCAT_TVDB_API_KEY: ${SLOUCHCAT_TVDB_API_KEY:-}
      SLOUCHCAT_TVDB_PIN: ${SLOUCHCAT_TVDB_PIN:-}
      SLOUCHCAT_YOUTUBE_API_KEY: ${SLOUCHCAT_YOUTUBE_API_KEY:-}
      SLOUCHCAT_TRAILER_AI: ${SLOUCHCAT_TRAILER_AI:-off}
      # Empty = ignore X-Forwarded-For; "private" = RFC 1918, loopback and fc00::/7; or a CIDR list.
      # Set it to "private" when the https profile or another reverse proxy is in front (README).
      SLOUCHCAT_TRUSTED_PROXIES: ${SLOUCHCAT_TRUSTED_PROXIES:-}
    # The healthcheck is defined in the image (slouchcat healthcheck).

  # Optional HTTPS front end (plan K-8): only started with --profile https.
  caddy:
    image: caddy:2.10
    container_name: slouchcat-caddy
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      slouchcat:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SLOUCHCAT_DOMAIN: ${SLOUCHCAT_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account: keep this volume, or Caddy requests new certificates.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
