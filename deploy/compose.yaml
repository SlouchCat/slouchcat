# Slouchcat – Docker Compose (plan section 3.7).
# Usage: cp .env.example .env && mkdir -p config cache && docker compose up -d
# HTTPS: docker compose -f compose.yaml -f compose.https-only.yaml --profile https up -d
#   (Caddy, see README and Caddyfile). The https-only override belongs to it: it stops the host
#   publishing port 8096, so nothing but Caddy reaches the server. Without it, and with
#   SLOUCHCAT_TRUSTED_PROXIES=private, any device in the home network can set X-Forwarded-For
#   itself and so empty the limit on login attempts.
# GPU: add -f compose.nvidia.yaml, -f compose.intel.yaml or -f compose.amd.yaml.
name: slouchcat

services:
  slouchcat:
    # Published with every release (ADR 0001, .github/workflows/release.yml). The tag is pinned:
    # an update is a conscious step (SLOUCHCAT_VERSION in .env, then `docker compose pull`), the
    # update check only says that there is one. `docker compose up --build` builds locally instead.
    image: ghcr.io/slouchcat/slouchcat:${SLOUCHCAT_VERSION:-1.4.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: slouchcat
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8096:8096"
    volumes:
      # /config holds the SQLite database: local disk only, never NFS/SMB.
      - ./config:/config
      - ./cache:/cache
      - ${MEDIA_DIR:-/srv/media}:/media:ro
    environment:
      TZ: ${TZ:-Europe/Zurich}
      SLOUCHCAT_LOG_FORMAT: ${SLOUCHCAT_LOG_FORMAT:-json}
      # Optional: TMDB v4 read access token from .env; the wizard can store it encrypted instead.
      SLOUCHCAT_TMDB_API_KEY: ${SLOUCHCAT_TMDB_API_KEY:-}
      # Optional providers (README «Metadaten-Anbieter und Trailer»); empty = not used.
      SLOUCHCAT_TVDB_API_KEY: ${SLOUCHCAT_TVDB_API_KEY:-}
      SLOUCHCAT_TVDB_PIN: ${SLOUCHCAT_TVDB_PIN:-}
      SLOUCHCAT_YOUTUBE_API_KEY: ${SLOUCHCAT_YOUTUBE_API_KEY:-}
      SLOUCHCAT_TRAILER_AI: ${SLOUCHCAT_TRAILER_AI:-off}
      # Trakt client id (M7): the public lists the spotlight row draws from; empty = row hidden.
      SLOUCHCAT_TRAKT_CLIENT_ID: ${SLOUCHCAT_TRAKT_CLIENT_ID:-}
      # Notifications (M8, README «Umgebungsvariablen»); empty = set in the administration or off.
      SLOUCHCAT_SMTP_HOST: ${SLOUCHCAT_SMTP_HOST:-}
      SLOUCHCAT_SMTP_PORT: ${SLOUCHCAT_SMTP_PORT:-}
      SLOUCHCAT_SMTP_USER: ${SLOUCHCAT_SMTP_USER:-}
      SLOUCHCAT_SMTP_PASSWORD: ${SLOUCHCAT_SMTP_PASSWORD:-}
      SLOUCHCAT_SMTP_FROM: ${SLOUCHCAT_SMTP_FROM:-}
      SLOUCHCAT_SMTP_TLS: ${SLOUCHCAT_SMTP_TLS:-}
      SLOUCHCAT_TELEGRAM_BOT_TOKEN: ${SLOUCHCAT_TELEGRAM_BOT_TOKEN:-}
      SLOUCHCAT_PUBLIC_URL: ${SLOUCHCAT_PUBLIC_URL:-}
      # Folders the folder browser of the library form may list, and below which a new library
      # folder must lie (idea 02); comma-separated. Empty = /media, the mount above. Never "/":
      # the browser would show the whole container, including /config with the database, the
      # backups and secret.key, and a library could be created there.
      SLOUCHCAT_BROWSE_ROOTS: ${SLOUCHCAT_BROWSE_ROOTS:-}
      # Empty = ignore X-Forwarded-For; "private" = RFC 1918, loopback and fc00::/7; or a CIDR list.
      # Set it to "private" when the https profile or another reverse proxy is in front (README).
      SLOUCHCAT_TRUSTED_PROXIES: ${SLOUCHCAT_TRUSTED_PROXIES:-}
    # The healthcheck is defined in the image (slouchcat healthcheck).

  # Optional HTTPS front end (plan K-8): only started with --profile https.
  caddy:
    image: caddy:2.10
    container_name: slouchcat-caddy
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      slouchcat:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SLOUCHCAT_DOMAIN: ${SLOUCHCAT_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account: keep this volume, or Caddy requests new certificates.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
