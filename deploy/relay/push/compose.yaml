# Push forwarder of Slouchcat (concept 27 sections 7.3 and 7.5). The same file on own hardware and
# on a rented server; what differs is the environment file (.env, from env.home.example or
# env.rented.example) and the profile "tls", which the rented server's .env switches on with
# COMPOSE_PROFILES=tls. Its two secrets are files in RELAY_SECRETS_DIR (default ./secrets),
# mounted read-only, never part of the image (D-6). Operation: docs/relay/BETRIEB.md.
#
#   docker compose up -d          start (the profile comes from .env)
#   docker compose config         check the file with the values of .env
name: slouchcat-push

services:
  push:
    image: ghcr.io/slouchcat/relay-push:${RELAY_VERSION:-1.0.0}
    build:
      context: ../../..
      dockerfile: deploy/relay/push/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The secrets belong to this user (chown 65532:65532, chmod 0400; BETRIEB.md).
    user: "${RELAY_USER:-65532:65532}"
    # Own hardware: the LAN address the existing reverse proxy connects to. Rented server:
    # 127.0.0.1, so the port is not reachable from outside; only the TLS front end in this stack
    # reaches the service, over the network below.
    ports:
      - "${RELAY_BIND:-127.0.0.1}:${RELAY_PORT:-8181}:8080"
    environment:
      RELAY_PUSH_ORIGINS: ${RELAY_PUSH_ORIGINS:-https://push.slouchcat.com}
      RELAY_TRUSTED_PROXIES: ${RELAY_TRUSTED_PROXIES:-}
      RELAY_LOG_FORMAT: ${RELAY_LOG_FORMAT:-json}
      RELAY_LOG_LEVEL: ${RELAY_LOG_LEVEL:-info}
      RELAY_PUSH_MAX_BODY: ${RELAY_PUSH_MAX_BODY:-3000}
      RELAY_RATE: ${RELAY_RATE:-20}
      RELAY_BURST: ${RELAY_BURST:-200}
      RELAY_PUSH_ADDRESS_RATE: ${RELAY_PUSH_ADDRESS_RATE:-0.5}
      RELAY_PUSH_ADDRESS_BURST: ${RELAY_PUSH_ADDRESS_BURST:-20}
      RELAY_PUSH_REGISTER_RATE: ${RELAY_PUSH_REGISTER_RATE:-0.2}
      RELAY_PUSH_REGISTER_BURST: ${RELAY_PUSH_REGISTER_BURST:-10}
      RELAY_PUSH_KEYFILE: /run/secrets/sealing-keys.json
      RELAY_FCM_CREDENTIALS: /run/secrets/firebase.json
      # Empty: Google's own addresses. Set only for the stand-in of the local rehearsal.
      RELAY_FCM_BASE_URL: ${RELAY_FCM_BASE_URL:-}
      RELAY_FCM_TOKEN_URL: ${RELAY_FCM_TOKEN_URL:-}
    volumes:
      - ${RELAY_SECRETS_DIR:-./secrets}:/run/secrets:ro
    healthcheck:
      test: ["CMD", "/push", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - relay

  # TLS front end for the rented server (profile "tls"). It holds the certificates of the names
  # in RELAY_NAMES; they can be issued again and do not move (7.5).
  tls:
    image: caddy:2.10
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      push:
        condition: service_started
    ports:
      - "${RELAY_TLS_HTTP_PORT:-80}:80"
      - "${RELAY_TLS_HTTPS_PORT:-443}:443"
    environment:
      RELAY_NAMES: ${RELAY_NAMES:-push.slouchcat.com}
      RELAY_TLS: ${RELAY_TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls_data:/data
      - tls_config:/config
    networks:
      relay:
        # The one address the service believes X-Forwarded-For from (RELAY_TRUSTED_PROXIES, D-9);
        # the last of the subnet, because Docker hands out dynamic addresses from the bottom.
        ipv4_address: ${RELAY_TLS_IP:-172.30.90.6}

networks:
  relay:
    ipam:
      config:
        - subnet: ${RELAY_SUBNET:-172.30.90.0/29}

volumes:
  tls_data:
  tls_config:
