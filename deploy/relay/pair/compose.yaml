# Meeting point service of Slouchcat (concept 27 section 7.5). The same file on own hardware and
# on a rented server; what differs is the environment file (.env, from env.home.example or
# env.rented.example) and the profile "tls", which the rented server's .env switches on with
# COMPOSE_PROFILES=tls. Operation: docs/relay/BETRIEB.md.
#
#   docker compose up -d          start (the profile comes from .env)
#   docker compose config         check the file with the values of .env
name: slouchcat-pair

# Docker's own log files, bounded: a flood of bad requests must not fill the disk (L-2).
x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  pair:
    image: ghcr.io/slouchcat/relay-pair:${RELAY_VERSION:-1.0.0}
    build:
      context: ../../..
      dockerfile: deploy/relay/pair/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Running requests finish on a stop (the service waits up to 25 s).
    stop_grace_period: 30s
    logging: *logging
    # Own hardware: the LAN address the existing reverse proxy connects to. Rented server:
    # 127.0.0.1, so the port is not reachable from outside; only the TLS front end reaches it.
    ports:
      - "${RELAY_BIND:-127.0.0.1}:${RELAY_PORT:-8180}:8080"
    environment:
      RELAY_TRUSTED_PROXIES: ${RELAY_TRUSTED_PROXIES:-}
      RELAY_LOG_FORMAT: ${RELAY_LOG_FORMAT:-json}
      RELAY_LOG_LEVEL: ${RELAY_LOG_LEVEL:-info}
      RELAY_PAIR_MAX_OPEN: ${RELAY_PAIR_MAX_OPEN:-10000}
      RELAY_PAIR_MAX_OPEN_PER_CALLER: ${RELAY_PAIR_MAX_OPEN_PER_CALLER:-10}
      RELAY_PAIR_MAX_OPEN_PER_NET: ${RELAY_PAIR_MAX_OPEN_PER_NET:-50}
      RELAY_RATE: ${RELAY_RATE:-2}
      RELAY_BURST: ${RELAY_BURST:-30}
      RELAY_NET_RATE: ${RELAY_NET_RATE:-20}
      RELAY_NET_BURST: ${RELAY_NET_BURST:-300}
    healthcheck:
      test: ["CMD", "/pair", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - relay

  # TLS front end for the rented server (profile "tls"). It runs in the host's network, so it sees
  # the caller's real address, IPv4 and IPv6 alike; behind Docker's port forwarding an IPv6 caller
  # would arrive as the bridge's IPv4 gateway and all IPv6 callers would count as one (code review
  # major 2). It reaches the service on 127.0.0.1:RELAY_PORT; Docker hands that connection on from
  # the gateway of the network below, which is therefore the one trusted proxy (D-9). It holds the
  # certificates of the names in RELAY_NAMES; they can be issued again and do not move (7.5).
  tls:
    # caddy:2.10, pinned by the digest of its image index. Raise tag and digest together:
    #   docker buildx imagetools inspect caddy:<version>
    image: caddy:2.10@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    profiles: ["tls"]
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    depends_on:
      pair:
        condition: service_started
    environment:
      RELAY_NAMES: ${RELAY_NAMES:-pair.slouchcat.com}
      RELAY_TLS: ${RELAY_TLS:-internal}
      RELAY_UPSTREAM: 127.0.0.1:${RELAY_PORT:-8180}
      RELAY_TLS_HTTP_PORT: ${RELAY_TLS_HTTP_PORT:-80}
      RELAY_TLS_HTTPS_PORT: ${RELAY_TLS_HTTPS_PORT:-443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls_data:/data
      - tls_config:/config

networks:
  relay:
    ipam:
      config:
        - subnet: ${RELAY_SUBNET:-172.30.89.0/29}
          # The address the TLS front end's connections come from (RELAY_TRUSTED_PROXIES).
          gateway: ${RELAY_GATEWAY:-172.30.89.1}

volumes:
  tls_data:
  tls_config:
