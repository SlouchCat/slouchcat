# Meeting point service of Slouchcat (concept 27 section 7.5). The same file on own hardware and
# on a rented server; what differs is the environment file (.env, from env.home.example or
# env.rented.example) and the profile "tls", which the rented server's .env switches on with
# COMPOSE_PROFILES=tls. Operation: docs/relay/BETRIEB.md.
#
#   docker compose up -d          start (the profile comes from .env)
#   docker compose config         check the file with the values of .env
name: slouchcat-pair

services:
  pair:
    image: ghcr.io/slouchcat/relay-pair:${RELAY_VERSION:-1.0.0}
    build:
      context: ../../..
      dockerfile: deploy/relay/pair/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Own hardware: the LAN address the existing reverse proxy connects to. Rented server:
    # 127.0.0.1, so the port is not reachable from outside; only the TLS front end in this stack
    # reaches the service, over the network below.
    ports:
      - "${RELAY_BIND:-127.0.0.1}:${RELAY_PORT:-8180}:8080"
    environment:
      RELAY_TRUSTED_PROXIES: ${RELAY_TRUSTED_PROXIES:-}
      RELAY_LOG_FORMAT: ${RELAY_LOG_FORMAT:-json}
      RELAY_LOG_LEVEL: ${RELAY_LOG_LEVEL:-info}
      RELAY_PAIR_MAX_OPEN: ${RELAY_PAIR_MAX_OPEN:-10000}
      RELAY_PAIR_MAX_OPEN_PER_CALLER: ${RELAY_PAIR_MAX_OPEN_PER_CALLER:-10}
      RELAY_RATE: ${RELAY_RATE:-2}
      RELAY_BURST: ${RELAY_BURST:-30}
    healthcheck:
      test: ["CMD", "/pair", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - relay

  # TLS front end for the rented server (profile "tls"). It holds the certificates of the names
  # in RELAY_NAMES; they can be issued again and do not move (7.5).
  tls:
    image: caddy:2.10
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      pair:
        condition: service_started
    ports:
      - "${RELAY_TLS_HTTP_PORT:-80}:80"
      - "${RELAY_TLS_HTTPS_PORT:-443}:443"
    environment:
      RELAY_NAMES: ${RELAY_NAMES:-pair.slouchcat.com}
      RELAY_TLS: ${RELAY_TLS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls_data:/data
      - tls_config:/config
    networks:
      relay:
        # The one address the service believes X-Forwarded-For from (RELAY_TRUSTED_PROXIES, D-9);
        # the last of the subnet, because Docker hands out dynamic addresses from the bottom.
        ipv4_address: ${RELAY_TLS_IP:-172.30.89.6}

networks:
  relay:
    ipam:
      config:
        - subnet: ${RELAY_SUBNET:-172.30.89.0/29}

volumes:
  tls_data:
  tls_config:
