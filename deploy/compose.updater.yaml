# Optional override: the updater companion (ADR 0024), which installs a new release on a click in
# the administration. Add it to every -f file you already use, last:
#   docker compose -f compose.yaml [-f compose.https-only.yaml] [-f compose.intel.yaml] -f compose.updater.yaml up -d
# or put the list into COMPOSE_FILE in .env (compose.yaml:compose.intel.yaml:compose.updater.yaml).
# Needs SLOUCHCAT_DEPLOY_DIR in .env: the absolute host path of this folder.
#
# The updater gets the Docker socket, which is root on the host. That is why it is a container of
# its own: no port, no users, no media, ./config and ./cache masked; it accepts one request
# (install the newest release), picks the version itself from the release manifest and recreates
# only the service slouchcat with exactly the compose files and env files the running container
# was started with.
# Since 1.18.0 it follows the server version on its own: it sets SLOUCHCAT_UPDATER_VERSION in .env
# and recreates itself (ADR 0024, addendum of 2026-11-08, point 2). An updater older than 1.18.0 has
# to be raised once by hand. The compose files travel with each release (point 3): on an update the
# updater replaces the official ones and keeps a copy as <file>.bak-vor-<version>.
services:
  updater:
    image: ghcr.io/slouchcat/slouchcat-updater:${SLOUCHCAT_UPDATER_VERSION:-1.23.1}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.updater
    container_name: slouchcat-updater
    restart: unless-stopped
    # A running install gets time to finish the compose call it is in and to leave its phase in
    # state.json (the updater waits at most 25 s); Docker's default is 10 s.
    stop_grace_period: 30s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The same absolute path as on the host, so that ./config, ./cache and every other relative
      # path of the compose files mean the same inside the updater as they do for the host.
      - ${SLOUCHCAT_DEPLOY_DIR:?SLOUCHCAT_DEPLOY_DIR is not set, see .env.example}:${SLOUCHCAT_DEPLOY_DIR}
      # ... except ./config (database, secret.key, backups) and ./cache: empty, read-only tmpfs
      # over them, so the updater never sees what the server keeps there. Compose does not read
      # bind-mount sources; the server container still gets the host folders. A config or cache
      # folder outside deploy/ is neither mounted here nor masked (Docker then creates an empty
      # mount point ./config or ./cache, owned by root).
      - type: tmpfs
        target: ${SLOUCHCAT_DEPLOY_DIR}/config
        read_only: true
        tmpfs:
          size: 4096
      - type: tmpfs
        target: ${SLOUCHCAT_DEPLOY_DIR}/cache
        read_only: true
        tmpfs:
          size: 4096
    environment:
      SLOUCHCAT_DEPLOY_DIR: ${SLOUCHCAT_DEPLOY_DIR}
      # Owner of ./updater, the token and state.json: the user the server runs as.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Zurich}

  slouchcat:
    depends_on:
      updater:
        condition: service_started
    volumes:
      # Shared with the updater: token and state.json (written by the updater), server.json
      # (written by the server before and after its migrations). Read-write for that reason.
      - ./updater:/run/slouchcat-updater
    environment:
      SLOUCHCAT_UPDATER_URL: http://slouchcat-updater:8099
